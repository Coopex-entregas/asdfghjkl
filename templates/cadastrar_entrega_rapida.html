  <style>
    *{box-sizing:border-box}.rapid-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;align-items:start}.search-box{position:relative}.results{position:absolute;left:0;right:0;top:72px;z-index:40;display:none;max-height:280px;overflow:auto;padding:6px;border:1px solid var(--cx-line-strong);border-radius:12px;background:var(--cx-card);box-shadow:0 18px 42px rgba(12,43,130,.2)}.result{display:flex;justify-content:space-between;gap:10px;padding:10px;border-radius:9px;cursor:pointer}.result:hover,.result.active{background:var(--cx-royal-light)}.result strong{display:block}.result small{color:var(--cx-muted)}.loading{display:none;margin-top:5px;color:var(--cx-muted);font-size:.78rem}.client-meta{display:none;margin-top:8px}.summary{display:grid;gap:8px}.summary div{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--cx-line);border-radius:10px;background:var(--cx-royal-light);font-size:.82rem}.summary span{color:var(--cx-muted)}.summary strong{text-align:right}.side{position:sticky;top:82px}.route-msg,.credit-msg{display:block;min-height:20px;margin-top:5px;font-size:.78rem;color:var(--cx-muted)}.credit-msg{display:none}.mode-links{display:flex;gap:8px}.mode-links .cx-btn{min-width:0}.fila-note{margin-top:5px}.top-actions{display:flex;gap:8px}.scale-note{margin-top:6px;padding:8px 10px;border-radius:10px;background:#eaf8f0;border:1px solid #c3e7d3;color:#087747;font-size:.78rem;font-weight:800}.scale-note.warn{background:#fff5df;border-color:#ebd8a8;color:#805500}
    @media(max-width:860px){.rapid-grid{grid-template-columns:1fr}.side{position:static}.summary{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.summary{grid-template-columns:1fr}.cx-brand-title small{display:none}.top-actions .label{display:none}.cx-wrap{padding:10px}}
  </style>

<script id="cx-delivery-early-theme">
(function(){try{
 const value=localStorage.getItem('cx_sup_brightness');
 const dark=value===null?localStorage.getItem('coopex_theme')==='dark':Number(value)<80;
 document.body.classList.toggle('dark',dark);

<header class="cx-topbar">
  <a class="cx-back-arrow" href="{{ url_for('admin') }}" aria-label="Voltar ao administrador" title="Voltar ao administrador">‹</a>
  <div class="cx-brand"><div class="cx-brand-title"><strong>Entrega rápida</strong><small>Cadastro em poucos segundos</small></div></div>
  <div class="cx-spacer"></div>
  
</header>

<main class="cx-wrap">
  <div class="mode-links cx-tabs"><a class="cx-tab active" href="{{ url_for('cadastrar_entrega') }}">⚡ Entrega rápida</a><a class="cx-tab" href="{{ url_for('cadastrar_entrega', modo='completo') }}">📋 Entrega completa</a></div>
  <div class="rapid-grid">
    <section class="cx-card">
      <div class="cx-card-head"><h1>Pedido rápido</h1></div>
      <div class="cx-card-body">
        <div id="flash" class="cx-note warn" style="display:none;margin-bottom:12px"></div>
        <form id="quickForm" method="POST" action="{{ url_for('cadastrar_entrega') }}" autocomplete="off">
          <input type="hidden" id="cliente_id" name="cliente_id"><input type="hidden" id="bairro" name="bairro">
          <div class="cx-field search-box"><label for="cliente">Cliente</label><input class="cx-input" id="cliente" name="cliente" required autocomplete="off" placeholder="Digite nome ou telefone"><div id="loading" class="loading">Buscando clientes...</div><div id="results" class="results"></div><div id="clientMeta" class="cx-note client-meta"></div></div>
          <div class="cx-grid-2"><div class="cx-field"><label for="coleta_bairro">Bairro da coleta</label><input class="cx-input" id="coleta_bairro" name="coleta_bairro" required placeholder="Preenchido pelo cliente"></div><div class="cx-field"><label for="entrega_bairro">Bairro da entrega</label><input class="cx-input" id="entrega_bairro" name="entrega_bairro" required placeholder="Digite o destino"></div></div>
          <div class="cx-grid-2"><div class="cx-field"><label for="valor">Valor</label><input class="cx-input" id="valor" name="valor" required inputmode="decimal" placeholder="Calculado pela rota"><span id="routeMsg" class="route-msg">Selecione o cliente e informe o destino.</span></div><div class="cx-field"><label for="pagamento">Forma de pagamento</label><select class="cx-select" id="pagamento" name="pagamento" required><option value="Pix" selected>1. Pix</option><option value="Dinheiro">2. Dinheiro</option><option value="Comanda">3. Comanda</option><option id="creditOption" value="CREDITO_AUTO" hidden disabled>4. Crédito automático</option></select><span id="creditMsg" class="credit-msg"></span></div></div>
          <div class="cx-field"><label for="cooperado_id">Atribuir cooperado</label><select class="cx-select" id="cooperado_id" name="cooperado_id"><option value="" selected>Sem cooperado</option>{% for c in cooperados %}<option value="{{ c.id }}">{% if c.id in fila_por_id %}{{ fila_por_id[c.id] }}º da fila — {% endif %}{{ c.nome }}</option>{% endfor %}</select></div>
          <div class="cx-actions"><button class="cx-btn" type="submit">Cadastrar entrega rápida</button><a class="cx-btn alt" href="{{ url_for('clientes') }}">Cadastrar cliente</a></div>
        </form>
      </div>
    </section>

  </div>
</main>

<script>
  const firstQueue={{ primeiro_fila_id|tojson }};
  const el=id=>document.getElementById(id);
  const cliente=el('cliente'),clienteId=el('cliente_id'),results=el('results'),loading=el('loading'),meta=el('clientMeta');
  const origem=el('coleta_bairro'),destino=el('entrega_bairro'),bairro=el('bairro'),valor=el('valor'),pagamento=el('pagamento'),credito=el('creditOption'),creditMsg=el('creditMsg'),coop=el('cooperado_id'),routeMsg=el('routeMsg');
  let timer=null,routeTimer=null,items=[],active=-1,routes=null,abort=null;
  const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
  function hide(){results.style.display='none'}
  function render(list){items=list||[];active=-1;results.innerHTML='';if(!items.length){results.innerHTML='<div class="cx-muted" style="padding:12px;text-align:center">Nenhum cliente encontrado.</div>';results.style.display='block';return}items.forEach((x,i)=>{const d=document.createElement('div');d.className='result';d.innerHTML=`<div><strong>${esc(x.nome)}</strong><small>${esc(x.telefone||'sem telefone')} • ${esc(x.bairro_origem||'sem bairro')}</small></div><b style="color:var(--cx-royal-dark);font-size:.74rem">Selecionar</b>`;d.onmousedown=e=>{e.preventDefault();choose(x)};d.onmousemove=()=>activate(i);results.appendChild(d)});results.style.display='block'}
  function activate(i){[...results.querySelectorAll('.result')].forEach(x=>x.classList.remove('active'));const n=results.children[i];if(n){n.classList.add('active');active=i}}
  async function search(q){if(abort)abort.abort();abort=new AbortController();loading.style.display='block';try{const r=await fetch(`{{ url_for('api_busca_clientes_entrega') }}?q=${encodeURIComponent(q)}&limit=12`,{signal:abort.signal,headers:{'X-Requested-With':'fetch'}});const d=await r.json();render(d.ok?d.items:[])}catch(e){if(e.name!=='AbortError')render([])}finally{loading.style.display='none'}}
  // Saldo em cache compartilhado pelo Admin; nenhuma consulta ao histórico por cliente.
  let activeCreditBalances=null;
  let selectedCreditId=0;
  let creditProfileSeq=0;
  function creditBalance(id,fallback){
    if(activeCreditBalances===null)return Number(fallback||0);
    const n=activeCreditBalances.get(Number(id));
    return n===undefined?0:Number(n);
  }
  function creditState(profile){
    const balance=Number(profile.saldo||0);
    const allowed=Math.abs(balance)>=0.005;
    credito.hidden=!allowed;credito.disabled=!allowed;
    creditMsg.style.display=allowed?'block':'none';
    creditMsg.textContent=allowed?('Saldo de crédito: '+money(balance)):'';
    if(!allowed&&pagamento.value==='CREDITO_AUTO')pagamento.value='Pix';
    sync();
  }
  function refreshCreditSelection(){
    const id=Number(clienteId.value||0);
    if(!id)return;
    const saldo=creditBalance(id,0);
    creditState({saldo});
    const profileName=cliente.value||'';
    if(meta.style.display!=='none')meta.innerHTML=
      '<strong>'+esc(profileName)+'</strong><br>Saldo '+money(saldo);
  }
  function choose(x){
    cliente.value=x.nome||'';clienteId.value=x.id||'';
    origem.value=x.bairro_origem||'';
    meta.style.display='block';
    creditState({saldo:creditBalance(x.id,x.saldo_atual)});
    meta.innerHTML='<strong>'+esc(x.nome)+'</strong><br>'+
      esc(x.bairro_origem||'Sem bairro')+' • Saldo '+money(creditBalance(x.id,x.saldo_atual));
    hide();sync();lookupSoon(30);destino.focus();
  }
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==window.parent)return;
    const data=event.data;
    if(data?.type!=='coopex-creditos-ativos'||!Array.isArray(data.items))return;
    activeCreditBalances=new Map(data.items.map(x=>[Number(x.id),Number(x.saldo||0)]));
    refreshCreditSelection();
  });
  if(new URLSearchParams(location.search).get('modal')==='1'&&window.parent!==window){
    window.parent.postMessage({type:'coopex-entrega-rapida-pronta'},location.origin);
  }
  async function loadRoutes(){if(routes)return routes;const r=await fetch(`{{ url_for('api_list_precos') }}`,{headers:{Accept:'application/json','X-Requested-With':'fetch'},cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error();routes=d.items||[];return routes}
  async function lookup(){bairro.value=destino.value.trim();if(!origem.value.trim()||!destino.value.trim()){routeMsg.textContent='Informe coleta e entrega.';sync();return}routeMsg.textContent='Buscando valor...';try{const list=await loadRoutes(),o=norm(origem.value),d=norm(destino.value),r=list.find(x=>(norm(x.origem)===o&&norm(x.destino)===d)||(norm(x.origem)===d&&norm(x.destino)===o));if(r){valor.value=Number(r.valor||0).toFixed(2).replace('.',',');routeMsg.textContent=`Valor encontrado: ${money(r.valor)}`;routeMsg.style.color='var(--cx-green)'}else{routeMsg.textContent='Rota não cadastrada. Informe o valor manualmente.';routeMsg.style.color='var(--cx-warn)'}}catch(e){routeMsg.textContent='Não foi possível consultar. Informe o valor manualmente.';routeMsg.style.color='var(--cx-warn)'}sync()}
  function lookupSoon(ms=260){clearTimeout(routeTimer);routeTimer=setTimeout(lookup,ms)}
  // A conferência final acontece no próprio formulário; sem painel duplicado.
  function sync(){}

  cliente.oninput=()=>{clienteId.value='';meta.style.display='none';creditState({saldo:0});clearTimeout(timer);const q=cliente.value.trim();if(q.length<2){hide();sync();return}timer=setTimeout(()=>search(q),160);sync()};
  cliente.onkeydown=e=>{const nodes=[...results.querySelectorAll('.result')];if(!nodes.length||results.style.display==='none')return;if(e.key==='ArrowDown'){e.preventDefault();activate(active<nodes.length-1?active+1:0)}else if(e.key==='ArrowUp'){e.preventDefault();activate(active>0?active-1:nodes.length-1)}else if(e.key==='Enter'&&active>=0){e.preventDefault();choose(items[active])}else if(e.key==='Escape')hide()};
  document.addEventListener('click',e=>{if(!results.contains(e.target)&&e.target!==cliente)hide()});origem.oninput=()=>lookupSoon();destino.oninput=()=>{bairro.value=destino.value;lookupSoon();sync()};valor.oninput=sync;pagamento.onchange=sync;coop.onchange=sync;
  let submitting=false;
  el('quickForm').onsubmit=async e=>{
    e.preventDefault();
    if(submitting)return;
    if(!valor.value.trim()){el('flash').textContent='Informe o valor da entrega.';el('flash').style.display='block';valor.focus();return}
    bairro.value=destino.value||origem.value;
    const form=e.currentTarget,btn=form.querySelector('[type="submit"]');
    submitting=true;if(btn){btn.disabled=true;btn.textContent='Salvando…'}
    try{
      const response=await fetch(form.action,{
        method:'POST',body:new FormData(form),credentials:'same-origin',
        headers:{Accept:'application/json','X-Requested-With':'fetch'}
      });
      const data=await response.json();
      if(!response.ok||!data.ok)throw new Error(data.message||data.erro||'Não foi possível registrar a entrega.');
      // Dentro do Admin: mantém o mesmo formulário sem recarregar a página.
      // O pai atualiza somente a linha criada.
      if(new URLSearchParams(location.search).get('modal')==='1' && window.parent!==window){
        window.parent.postMessage({type:'coopex-entrega-rapida-salva',entrega_id:data.entrega_id},location.origin);
        reset();
        const note=el('flash');
        note.textContent='Entrega #'+data.entrega_id+' cadastrada! Pronta para a próxima.';
        note.style.display='block';
        submitting=false;
        if(btn){btn.disabled=false;btn.textContent='Cadastrar entrega rápida'}
        cliente.focus();
        return;
      }
      // Voltar pelo histórico reutiliza o painel já aberto quando o navegador suporta BFCache.
      const previous=document.referrer?new URL(document.referrer,location.href):null;
      if(previous&&previous.origin===location.origin&&previous.pathname==='/admin'&&history.length>1){
        history.back();
      }else{
        location.replace('{{ url_for("admin") }}');
      }
    }catch(err){
      el('flash').textContent=err.message||'Não foi possível salvar. Tente novamente.';
      el('flash').style.display='block';
      submitting=false;if(btn){btn.disabled=false;btn.textContent='Cadastrar entrega rápida'}
    }
  };
  function reset(){el('quickForm').reset();clienteId.value='';cliente.value='';meta.style.display='none';hide();results.innerHTML='';credito.hidden=true;credito.disabled=true;creditMsg.style.display='none';pagamento.value='Pix';coop.value='';routeMsg.textContent='Selecione o cliente e informe o destino.';el('flash').style.display='none';sync()}
  window.addEventListener('pageshow',reset);reset();
  // ESC dentro do iframe não chega ao documento pai: avisar diretamente.
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape' && new URLSearchParams(location.search).get('modal')==='1' && window.parent!==window){
      event.preventDefault();
      window.parent.postMessage({type:'coopex-entrega-rapida-fechar'},location.origin);
    }
  });

  
</script>
<script id="coopex-quick-schedule">
(function(){
  const select=document.getElementById('cooperado_id');
  if(!select)return;
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const iniciais=[...select.options].filter(o=>o.value).map(o=>{const texto=(o.textContent||'').trim();const m=texto.match(/^(\d+)º\s+da\s+fila\s+—\s*(.+)$/i);return{id:String(o.value),nome:(m?m[2]:texto).trim(),fila:m?Number(m[1]):null}});
  const todos=[...iniciais];
  const fila=todos.filter(c=>Number.isFinite(c.fila)).sort((a,b)=>a.fila-b.fila);
  let idsBase=new Set();

  function adicionar(id,texto,antesDe=null){
    if(!id||[...select.options].some(o=>String(o.value)===String(id)))return null;
    const o=document.createElement('option');o.value=String(id);o.textContent=texto;
    if(antesDe)select.insertBefore(o,antesDe);else select.appendChild(o);
    return o;
  }

  function manual(){
    const termo=prompt('Digite parte do nome do cooperado:');if(!termo)return null;
    let lista=todos.filter(c=>norm(c.nome).includes(norm(termo)));
    if(!lista.length){alert('Nenhum cooperado encontrado.');return null}
    if(lista.length===1)return lista[0];
    lista=lista.slice(0,12);const n=Number(prompt('Digite o número do cooperado:\n'+lista.map((c,i)=>`${i+1}. ${c.nome}`).join('\n')))-1;
    return n>=0&&n<lista.length?lista[n]:null;
  }

  async function aplicar(){
    try{
      const r=await fetch('{{ url_for("api_escala_agora") }}',{headers:{Accept:'application/json','X-Requested-With':'fetch'},cache:'no-store'});const d=await r.json();
      if(!r.ok||!d.ok||!d.restricao_ativa)return;
      const itensBase=(d.itens||[]).filter(x=>norm(x.contrato)==='base');
      idsBase=new Set(itensBase.map(x=>String(x.cooperado_id)));

      select.innerHTML='<option value="">Sem cooperado</option>';
      fila.forEach(c=>adicionar(c.id,`${c.fila}º da fila — ${c.nome}`));
      todos.filter(c=>idsBase.has(c.id)&&!Number.isFinite(c.fila)).forEach(c=>adicionar(c.id,c.nome));

      const m=document.createElement('option');m.value='__fora_escala__';m.textContent='Digitar outro cooperado';select.appendChild(m);
      select.value='';
      select.title='Sem cooperado fica primeiro. Depois aparecem a fila e os escalados na BASE.';
      select.dispatchEvent(new Event('change',{bubbles:true}));
    }catch(e){}
  }

  select.addEventListener('change',e=>{
    if(select.value!=='__fora_escala__')return;
    e.stopImmediatePropagation();
    const c=manual();
    if(!c){select.value='';return}
    const manualOpt=select.options[select.options.length-1];
    let o=[...select.options].find(x=>x.value===c.id);
    if(!o)o=adicionar(c.id,c.nome,manualOpt);
    select.value=c.id;
    const resumo=document.getElementById('sCooperado');if(resumo)resumo.textContent=c.nome;
  },true);

  window.addEventListener('pageshow',()=>setTimeout(aplicar,0));
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',aplicar,{once:true});else aplicar();
})();
</script>
