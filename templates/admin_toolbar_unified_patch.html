</style>

<script id="coopex-admin-toolbar-unified-script">
(function(){
  function texto(el){return String(el?.textContent||'').replace(/\s+/g,' ').trim()}

  function montar(){
    const header=document.querySelector('header');
    const toolbar=document.querySelector('.bank-toolbar');
    if(!header||!toolbar||document.getElementById('adminToolbarRight'))return false;

    const topbar=header.querySelector('.topbar');
    const kpis=topbar?.querySelector('.kpis');
    const theme=topbar?.querySelector('.theme-toggle');
    const logout=topbar?.querySelector('.logout');

    const right=document.createElement('div');
    right.id='adminToolbarRight';
    right.className='admin-toolbar-right';

    if(kpis)right.appendChild(kpis);
    if(theme)right.appendChild(theme);
    if(logout)right.appendChild(logout);
    toolbar.appendChild(right);

    const banner=document.querySelector('.banner');
    const panelHead=document.querySelector('.panel-head');
    if(panelHead){
      [...panelHead.querySelectorAll('.badge')].forEach(function(badge){
        if(/\bem aberto\b/i.test(texto(badge)))badge.classList.add('admin-open-count');
      });
    }
    if(banner&&panelHead){
      const badges=[...banner.querySelectorAll('.badge')];
      const holiday=badges.find(item=>/feriado|dia normal|não é feriado|nao e feriado/i.test(texto(item)))||badges[badges.length-1];
      if(holiday){
        holiday.classList.add('admin-holiday-status');
        holiday.classList.remove('good','bad','neu');
        panelHead.appendChild(holiday);
      }
    }

    header.style.setProperty('display','none','important');
    if(banner)banner.style.setProperty('display','none','important');
    return true;
  }

  function iniciar(){
    let tentativas=0;
    const timer=setInterval(function(){
      tentativas+=1;
      if(montar()||tentativas>=30)clearInterval(timer);
    },100);
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar,{once:true});
  else iniciar();
})();
</script>
