<style id="coopex-admin-toolbar-unified-style">
  /* Remove as duas faixas redundantes do topo. Os controles são movidos para o menu. */
  header{display:none!important}
  .banner{display:none!important}

  .bank-toolbar-wrap{
    position:sticky!important;
    top:0!important;
    z-index:1600!important;
    width:100%!important;
    min-height:58px!important;
    padding:0 14px!important;
    background:#0b1933!important;
    border:0!important;
    border-bottom:1px solid #233655!important;
    box-shadow:0 4px 15px rgba(3,12,31,.18)!important;
    overflow:visible!important;
  }
  .bank-toolbar{
    width:100%!important;
    min-height:58px!important;
    display:flex!important;
    align-items:stretch!important;
    gap:0!important;
    overflow:visible!important;
  }
  .bank-toolbar .bank-group{flex:0 0 auto!important}
  .bank-toolbar .bank-group-btn{
    min-width:0!important;
    height:58px!important;
    padding:0 14px!important;
    background:transparent!important;
    color:#fff!important;
    border:0!important;
    border-radius:0!important;
    box-shadow:none!important;
    font-size:.87rem!important;
    font-weight:850!important;
    opacity:1!important;
    white-space:nowrap!important;
  }
  .bank-toolbar .bank-group-btn *{color:#fff!important;opacity:1!important}
  .bank-toolbar .bank-group-btn:hover,
  .bank-toolbar .bank-group.open>.bank-group-btn{
    background:rgba(255,255,255,.09)!important;
    color:#fff!important;
    box-shadow:inset 0 -3px 0 #4f80ff!important;
  }
  .bank-toolbar .bank-submenu{
    top:58px!important;
    background:#fff!important;
    border-color:#d9e3f3!important;
  }

  .admin-toolbar-right{
    margin-left:auto!important;
    min-width:max-content!important;
    display:flex!important;
    align-items:center!important;
    justify-content:flex-end!important;
    gap:6px!important;
    padding-left:12px!important;
  }
  .admin-toolbar-right .kpis{
    display:flex!important;
    align-items:center!important;
    justify-content:flex-end!important;
    gap:5px!important;
    flex-wrap:nowrap!important;
  }
  .admin-toolbar-right .kpi{
    min-width:72px!important;
    min-height:42px!important;
    padding:5px 9px!important;
    display:grid!important;
    grid-template-columns:auto auto!important;
    grid-template-areas:"icon label" "icon value"!important;
    align-items:center!important;
    column-gap:6px!important;
    border:1px solid rgba(255,255,255,.18)!important;
    border-radius:10px!important;
    background:rgba(255,255,255,.07)!important;
    color:#fff!important;
    box-shadow:none!important;
  }
  .admin-toolbar-right .kpi .kpi-icon{
    grid-area:icon!important;
    background:transparent!important;
    border:0!important;
    color:#fff!important;
    padding:0!important;
  }
  .admin-toolbar-right .kpi small{
    grid-area:label!important;
    display:block!important;
    color:#cbd8f5!important;
    font-size:.58rem!important;
    font-weight:800!important;
    line-height:1!important;
    opacity:1!important;
  }
  .admin-toolbar-right .kpi span:not(.kpi-icon){
    grid-area:value!important;
    display:block!important;
    color:#fff!important;
    font-size:.82rem!important;
    font-weight:950!important;
    line-height:1.05!important;
  }
  .admin-toolbar-right .theme-toggle,
  .admin-toolbar-right .logout{
    display:inline-flex!important;
    align-items:center!important;
    justify-content:center!important;
    min-height:38px!important;
    height:38px!important;
    margin:0!important;
    padding:0 11px!important;
    border:1px solid rgba(255,255,255,.22)!important;
    border-radius:9px!important;
    background:rgba(255,255,255,.08)!important;
    color:#fff!important;
    box-shadow:none!important;
    font-size:.72rem!important;
    font-weight:850!important;
    text-decoration:none!important;
    white-space:nowrap!important;
  }
  .admin-toolbar-right .theme-toggle:hover{background:rgba(255,255,255,.15)!important}
  .admin-toolbar-right .logout{
    background:#d8414d!important;
    border-color:#e86972!important;
  }

  /* Mantém o aviso de feriado na própria barra azul da tabela. */
  .panel-head{
    display:flex!important;
    align-items:center!important;
    justify-content:space-between!important;
    gap:10px!important;
    flex-wrap:wrap!important;
  }
  .admin-holiday-status{
    margin-left:auto!important;
    display:inline-flex!important;
    align-items:center!important;
    justify-content:center!important;
    min-height:28px!important;
    padding:4px 10px!important;
    border:1px solid rgba(255,255,255,.28)!important;
    border-radius:999px!important;
    background:rgba(255,255,255,.13)!important;
    color:#fff!important;
    font-size:.69rem!important;
    font-weight:850!important;
    white-space:nowrap!important;
  }

  /* Recupera o espaço vertical retirado das faixas antigas. */
  .viewport{padding-top:8px!important}
  .table-wrap{max-height:calc(100vh - 145px)!important}

  body.dark .bank-toolbar-wrap{background:#071326!important;border-color:#263a60!important}
  body.dark .bank-toolbar .bank-group-btn,
  body.dark .bank-toolbar .bank-group-btn *{color:#fff!important}
  body.dark .admin-toolbar-right .kpi{background:#12213d!important;border-color:#334a75!important}

  @media(max-width:1450px){
    .bank-toolbar-wrap{overflow-x:auto!important;overflow-y:visible!important}
    .bank-toolbar{width:max-content!important;min-width:100%!important}
    .bank-toolbar .bank-group-btn{padding:0 10px!important;font-size:.8rem!important}
    .admin-toolbar-right .kpi{min-width:64px!important;padding:5px 7px!important}
  }
  @media(max-width:900px){
    .admin-toolbar-right .kpis .kpi:nth-child(n+3){display:none!important}
    .admin-toolbar-right .theme-toggle{max-width:42px!important;overflow:hidden!important;padding:0 10px!important}
  }
  @media(max-width:680px){
    .bank-toolbar-wrap{padding:0 6px!important}
    .bank-toolbar .bank-group-btn{height:52px!important;font-size:.72rem!important}
    .admin-toolbar-right .kpis{display:none!important}
    .admin-toolbar-right{padding-left:5px!important}
    .admin-toolbar-right .theme-toggle,.admin-toolbar-right .logout{height:34px!important;min-height:34px!important;padding:0 9px!important}
    .table-wrap{max-height:calc(100vh - 132px)!important}
  }
</style>

<script id="coopex-admin-toolbar-unified-script">
(function(){
  function texto(el){return String(el?.textContent||'').replace(/\s+/g,' ').trim()}

  function montar(){
    const header=document.querySelector('header');
    const toolbar=document.querySelector('.bank-toolbar');
    if(!header||!toolbar||document.getElementById('adminToolbarRight'))return false;

    const topbar=header.querySelector('.topbar');
    const kpis=topbar?.querySelector('.kpis');
    const theme=topbar?.querySelector('.theme-toggle');
    const logout=topbar?.querySelector('.logout');

    const right=document.createElement('div');
    right.id='adminToolbarRight';
    right.className='admin-toolbar-right';

    if(kpis)right.appendChild(kpis);
    if(theme)right.appendChild(theme);
    if(logout)right.appendChild(logout);
    toolbar.appendChild(right);

    const banner=document.querySelector('.banner');
    const panelHead=document.querySelector('.panel-head');
    if(banner&&panelHead){
      const badges=[...banner.querySelectorAll('.badge')];
      const holiday=badges.find(item=>/feriado|dia normal|não é feriado|nao e feriado/i.test(texto(item)))||badges[badges.length-1];
      if(holiday){
        holiday.classList.add('admin-holiday-status');
        holiday.classList.remove('good','bad','neu');
        panelHead.appendChild(holiday);
      }
    }

    header.style.setProperty('display','none','important');
    if(banner)banner.style.setProperty('display','none','important');
    return true;
  }

  function iniciar(){
    let tentativas=0;
    const timer=setInterval(function(){
      tentativas+=1;
      if(montar()||tentativas>=30)clearInterval(timer);
    },100);
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar,{once:true});
  else iniciar();
})();
</script>
