<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Cadastrar Cooperado - Coopex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fc;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #003399;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #003399;
            margin-bottom: 1.5rem;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 1rem;
            color: #003399;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 0.25rem;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 2rem;
            background-color: #003399;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #002080;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #003399;
            text-decoration: none;
            font-weight: bold;
        }
        .messages {
            color: red;
            margin-top: 1rem;
        }
        @media (max-width: 600px) {
            .container {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Cadastrar Cooperado</h1>
    </header>
    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="messages">
                <ul>
                {% for msg in messages %}
                    <li>{{ msg }}</li>
                {% endfor %}
                </ul>
            </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('cadastrar_cooperado') }}">
            <label>Nome:</label>
            <input type="text" name="nome" required/>

            <label>Senha:</label>
            <input type="password" name="senha" required/>

            <button type="submit">Cadastrar</button>
        </form>

        <a class="back-link" href="{{ url_for('admin') }}">Voltar</a>
    </div>
</body>
</html>
