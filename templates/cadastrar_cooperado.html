<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Cadastrar Cooperado - Coopex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            --azul: #003399;
            --azul-escuro: #001a66;
            --azul-claro: #e8f1ff;
            --cinza: #f4f6fc;
            --borda: #b7cfff;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--cinza);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--azul-escuro);
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(90deg, var(--azul), #1253d4 70%);
            color: #fff;
            padding: 1.3rem 0;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: 0 2px 10px #00339933;
        }
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .formbox {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 3px 14px #00339919;
            padding: 2.2rem 2.3rem 1.4rem 2.3rem;
            max-width: 360px;
            width: 100%;
        }
        h2, h1 {
            text-align: center;
            color: var(--azul);
            font-size: 1.34em;
            margin-bottom: 1.6rem;
            letter-spacing: 0.03em;
        }
        label {
            display: block;
            margin-bottom: 0.3rem;
            margin-top: 1rem;
            color: var(--azul);
            font-weight: bold;
            font-size: 1.04em;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 1.1em 1em;
            border: 1.7px solid var(--borda);
            border-radius: 8px;
            font-size: 1.07em;
            background: var(--azul-claro);
            outline: none;
            margin-bottom: 0.7rem;
            transition: border 0.17s;
        }
        input:focus {
            border: 2px solid var(--azul);
            background: #f4f8ff;
        }
        button {
            width: 100%;
            padding: 1.07em;
            background: var(--azul);
            color: #fff;
            font-size: 1.15em;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 1.1rem;
            box-shadow: 0 3px 10px #00339918;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: background 0.17s, box-shadow 0.15s;
        }
        button:hover, button:focus {
            background: #1253d4;
            box-shadow: 0 6px 16px #00339925;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.1rem;
            color: var(--azul);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.03em;
            transition: color 0.15s;
        }
        .back-link:hover { color: #1253d4; }
        .messages {
            color: #c9002d;
            background: #f5e7ef;
            margin: 0.6rem 0 0.6rem 0;
            padding: 7px 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.04em;
        }
        @media (max-width: 470px) {
            header {
                font-size: 1em;
                padding: 1.1rem 0 1rem 0;
            }
            .formbox {
                max-width: 99vw;
                min-width: 0;
                padding: 1.6rem 6vw 1.4rem 6vw;
                box-shadow: 0 2px 7px #00339911;
            }
            input, button, .back-link { font-size: 0.97em;}
        }
        @media (max-width: 370px) {
            .formbox {
                padding: 1.1rem 1vw 1.1rem 1vw;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Cadastrar Cooperado</h1>
    </header>
    <div class="container">
      <div class="formbox">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="messages">
                <ul style="list-style:none;padding-left:0;margin:0;">
                {% for msg in messages %}
                    <li>{{ msg }}</li>
                {% endfor %}
                </ul>
            </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('cadastrar_cooperado') }}" autocomplete="off">
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" required autocomplete="off" maxlength="80"/>

            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" required autocomplete="new-password" maxlength="40"/>

            <button type="submit">Cadastrar</button>
        </form>
        <a class="back-link" href="{{ url_for('admin') }}">Voltar</a>
      </div>
    </div>
</body>
</html>
