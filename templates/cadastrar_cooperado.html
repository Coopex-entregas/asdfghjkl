<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Cadastrar Cooperado - Coopex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    /* Estilo básico e cores similares aos outros templates */
  </style>
</head>
<body>
  <header>
    <h1>Cadastrar Cooperado</h1>
  </header>
  <div class="container">
    {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="messages">
        <ul>
        {% for msg in messages %}
          <li>{{ msg }}</li>
        {% endfor %}
        </ul>
      </div>
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('cadastrar_cooperado') }}">
      <label>Nome:</label>
      <input type="text" name="nome" required/>

      <label>Senha:</label>
      <input type="password" name="senha" required/>

      <button type="submit">Cadastrar</button>
    </form>

    <a class="back-link" href="{{ url_for('admin') }}">Voltar</a>
  </div>
</body>
</html>
