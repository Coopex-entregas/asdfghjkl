<style id="coopex-dashboard-admin-style">
  :root{
    --dash-bg:#f3f6fb;--dash-card:#fff;--dash-text:#102142;--dash-muted:#617194;
    --dash-line:#dbe4f2;--dash-blue:#123b9e;--dash-blue2:#1e55cf;
    --dash-shadow:0 5px 18px rgba(24,48,108,.07);--dash-shadow-lg:0 14px 34px rgba(24,48,108,.12)
  }
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  body{background:var(--dash-bg)!important;color:var(--dash-text)!important}
  .wrap{width:100%!important;max-width:none!important;margin:0!important;padding:12px 16px 30px!important}

  /* Cabeçalho profissional, mantendo todos os filtros */
  .top{position:relative!important;z-index:1000!important;background:linear-gradient(90deg,#0b2f86,#174bbd)!important;border-bottom:1px solid rgba(255,255,255,.2)!important;box-shadow:0 4px 16px rgba(11,44,135,.16)!important;backdrop-filter:none!important}
  .topbar{width:100%!important;max-width:none!important;margin:0!important;padding:10px 14px 12px!important;display:grid!important;grid-template-columns:240px minmax(0,1fr) auto!important;gap:10px 12px!important;align-items:center!important}
  .brand{min-height:46px!important;padding:5px 7px!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:#fff!important}
  .brand img{width:40px!important;height:40px!important;border-radius:11px!important}
  .brand b{color:#fff!important;font-size:1rem!important}.brand small{color:#dce7ff!important}
  .topbar .actions{grid-column:3;grid-row:1;display:flex!important;gap:6px!important;justify-content:flex-end!important;flex-wrap:wrap!important}
  .topbar .actions .btn{height:36px!important;min-height:36px!important;padding:0 11px!important;border:1px solid rgba(255,255,255,.38)!important;border-radius:10px!important;background:rgba(255,255,255,.12)!important;color:#fff!important;box-shadow:none!important;font-size:.76rem!important}
  .topbar .actions .btn.primary{background:#fff!important;color:#123b9e!important;border-color:#fff!important}.topbar .actions .btn.green{background:#0e9f62!important;color:#fff!important;border-color:#55c99a!important}.topbar .actions .btn.red{background:#d94848!important;color:#fff!important;border-color:#ef8d8d!important}
  .topbar .filters{grid-column:1/-1;grid-row:2;display:grid!important;grid-template-columns:repeat(9,minmax(112px,1fr))!important;gap:7px!important;padding:10px!important;border:1px solid rgba(255,255,255,.2)!important;border-radius:14px!important;background:rgba(255,255,255,.10)!important;align-items:end!important}
  .topbar .f label{display:block!important;margin:0 0 4px 2px!important;color:#e6eeff!important;font-size:.62rem!important;font-weight:900!important;letter-spacing:.04em!important;text-transform:uppercase!important}
  .topbar .f input,.topbar .f select{width:100%!important;height:36px!important;min-height:36px!important;padding:0 9px!important;border:1px solid rgba(255,255,255,.52)!important;border-radius:10px!important;background:#fff!important;color:#10295f!important;box-shadow:none!important;font-size:.74rem!important;font-weight:800!important}
  .topbar .f input:focus,.topbar .f select:focus{border-color:#fff!important;box-shadow:0 0 0 3px rgba(255,255,255,.18)!important}

  /* Menu igual ao Admin */
  .dash-bank-wrap{position:sticky;top:0;z-index:1050;width:100%;background:#fff;border-bottom:1px solid var(--dash-line);box-shadow:0 4px 12px rgba(24,55,115,.06)}
  .dash-bank{min-height:49px;padding:0 14px;display:flex;align-items:stretch;gap:2px;overflow-x:auto;overflow-y:visible;scrollbar-width:thin}
  .dash-group{position:relative;flex:0 0 auto}.dash-group-btn{min-width:128px;height:49px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:0;background:transparent;color:#294578;font:inherit;font-size:.82rem;font-weight:850;cursor:pointer;white-space:nowrap}
  .dash-group-btn:hover,.dash-group.open>.dash-group-btn{background:#eff4ff;color:#0f43c8;box-shadow:inset 0 -3px 0 #174fd6}
  .dash-submenu{display:none;position:fixed;z-index:1400;min-width:245px;max-width:min(380px,92vw);padding:8px;border:1px solid #dce5f4;border-radius:0 0 14px 14px;background:#fff;box-shadow:0 16px 34px rgba(25,52,108,.16)}
  .dash-group.open>.dash-submenu{display:flex;flex-direction:column;gap:3px}.dash-submenu a,.dash-submenu button{width:100%;min-height:39px;padding:9px 11px;display:flex;align-items:center;gap:9px;border:0;border-radius:9px;background:transparent;color:#263f73;font:inherit;font-size:.8rem;font-weight:780;text-align:left;text-decoration:none;cursor:pointer}.dash-submenu a:hover,.dash-submenu button:hover{background:#eef4ff;color:#0f43c8}.dash-sep{height:1px;background:#edf1f8;margin:4px 3px}
  .dash-bank-spacer{flex:1 0 20px}.dash-bank-direct{height:49px;padding:0 14px;display:flex;align-items:center;gap:7px;color:#294578;font-size:.8rem;font-weight:850;text-decoration:none;white-space:nowrap}.dash-bank-direct:hover{background:#eff4ff;color:#0f43c8}

  .dash-context{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 16px;background:#fbfcff;border-bottom:1px solid var(--dash-line)}
  .dash-context-left,.dash-context-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.dash-context-title{font-size:.75rem;font-weight:900;color:#173d8d}.dash-chip{display:inline-flex;align-items:center;gap:5px;min-height:27px;padding:4px 8px;border:1px solid #cfdbef;border-radius:999px;background:#fff;color:#506286;font-size:.69rem;font-weight:800}.dash-chip strong{color:#173f9f}.dash-context button{height:31px;padding:0 10px;border:1px solid #cbd8ed;border-radius:9px;background:#fff;color:#183a82;font:inherit;font-size:.72rem;font-weight:850;cursor:pointer}

  /* Conteúdo amplo, claro e organizado */
  .hero{margin-top:12px!important;padding:18px 20px!important;border:1px solid #214fb5!important;border-radius:18px!important;background:linear-gradient(105deg,#123b9e,#1d55cf)!important;box-shadow:var(--dash-shadow-lg)!important}.hero h1{font-size:1.5rem!important}.hero p{font-size:.86rem!important}.heroChip{padding:7px 10px!important;border-radius:9px!important;background:rgba(255,255,255,.13)!important}
  .gridKpi{gap:9px!important;margin-top:10px!important}.gridKpi>.kpi{min-height:94px!important;padding:12px 13px!important;border:1px solid var(--dash-line)!important;border-radius:15px!important;background:#fff!important;box-shadow:var(--dash-shadow)!important}.gridKpi>.kpi:before{width:5px!important}.gridKpi>.kpi .lab{color:#596b90!important}.gridKpi>.kpi .val{font-size:1.28rem!important;color:#102142!important}.gridKpi>.kpi .hint{color:#6b7b9b!important}
  .board,.board3,.board4,.year-compare-board,.year-compare-tables{gap:10px!important}.card,.year-compare-kpi,.year-compare-table-wrap{border:1px solid var(--dash-line)!important;border-radius:16px!important;background:#fff!important;box-shadow:var(--dash-shadow)!important}.card{padding:13px!important}.cardHead{min-height:42px!important;margin-bottom:9px!important}.card h2,.year-compare-head h3,.sectionTitle h3{color:#153b8c!important}.sub{color:#657597!important}.sectionTitle{margin:18px 0 8px!important;padding:0 2px 7px!important;border-bottom:1px solid var(--dash-line)!important}.sectionTitle h3{font-size:.96rem!important}
  .tableWrap,.year-compare-table-wrap{border:1px solid var(--dash-line)!important;border-radius:12px!important;background:#fff!important}table{font-size:.8rem!important}th{background:#123b9e!important;color:#fff!important;border-bottom:0!important;font-size:.69rem!important;letter-spacing:.02em!important;text-transform:uppercase!important}td{color:#1b315b!important;border-bottom-color:#e6ecf6!important}tr:hover td{background:#eef4ff!important}.chartBox{height:250px!important}.chartBox.small{height:215px!important}.chartBox.tall{height:310px!important}

  body.dark-mode{--dash-bg:#071326;--dash-card:#0f1d35;--dash-text:#eef3ff;--dash-muted:#aebcda;--dash-line:#263b62;background:#071326!important;color:#eef3ff!important}
  body.dark-mode .top{background:linear-gradient(90deg,#061a55,#0b2d78)!important;border-bottom-color:#19386f!important}.dark-mode .topbar .filters{background:rgba(3,14,39,.28)!important}.dark-mode .topbar .f input,.dark-mode .topbar .f select{background:#0b1730!important;color:#f4f8ff!important;border-color:#4b6391!important}
  body.dark-mode .dash-bank-wrap{background:#0c172b;border-color:#25395f}.dark-mode .dash-group-btn,.dark-mode .dash-bank-direct{color:#dbe6ff}.dark-mode .dash-group-btn:hover,.dark-mode .dash-group.open>.dash-group-btn,.dark-mode .dash-bank-direct:hover{background:#16294b;color:#fff}.dark-mode .dash-submenu{background:#111e36;border-color:#2a406b}.dark-mode .dash-submenu a,.dark-mode .dash-submenu button{color:#dce7ff}.dark-mode .dash-submenu a:hover,.dark-mode .dash-submenu button:hover{background:#1b3157;color:#fff}.dark-mode .dash-sep{background:#263b62}.dark-mode .dash-context{background:#0e1a31;border-color:#24385e}.dark-mode .dash-context-title{color:#dce7ff}.dark-mode .dash-chip,.dark-mode .dash-context button{background:#13223d;border-color:#334a76;color:#dce7ff}.dark-mode .dash-chip strong{color:#9dbbff}
  body.dark-mode .gridKpi>.kpi,body.dark-mode .card,body.dark-mode .year-compare-kpi,body.dark-mode .tableWrap,body.dark-mode .year-compare-table-wrap{background:#0f1d35!important;border-color:#263b62!important;box-shadow:0 12px 30px rgba(0,0,0,.22)!important}.dark-mode .gridKpi>.kpi .val,.dark-mode td{color:#f1f5ff!important}.dark-mode .gridKpi>.kpi .lab,.dark-mode .gridKpi>.kpi .hint,.dark-mode .sub{color:#aebcda!important}.dark-mode .card h2,.dark-mode .sectionTitle h3,.dark-mode .year-compare-head h3{color:#dce7ff!important}.dark-mode th{background:#12377f!important;color:#fff!important}.dark-mode tr:hover td{background:#132b57!important}

  @media(max-width:1550px){.topbar .filters{grid-template-columns:repeat(5,minmax(130px,1fr))!important}}
  @media(max-width:1050px){.topbar{grid-template-columns:1fr auto!important}.brand{grid-column:1}.topbar .actions{grid-column:2}.topbar .filters{grid-template-columns:repeat(3,minmax(140px,1fr))!important}.wrap{padding:10px!important}}
  @media(max-width:700px){.topbar{display:flex!important;flex-wrap:wrap!important;padding:8px!important}.brand{flex:1;min-width:210px!important}.topbar .actions{width:100%;justify-content:flex-start!important}.topbar .filters{width:100%;grid-template-columns:1fr 1fr!important}.dash-bank{padding:0 6px}.dash-group-btn{min-width:112px;padding:0 10px}.dash-context{padding:7px 9px}.wrap{padding:8px!important}.hero{padding:15px!important}.gridKpi>.kpi{min-height:86px!important}}
  @media(max-width:460px){.topbar .filters{grid-template-columns:1fr!important}.topbar .actions .btn{flex:1}.dash-context-right{width:100%}.dash-context button{flex:1}}
</style>

<script id="coopex-dashboard-admin-script">
(function(){
  const form=document.querySelector('.topbar');
  if(!form)return;

  function link(href,icon,label){return `<a href="${href}"><span>${icon}</span>${label}</a>`}
  const toolbar=document.createElement('nav');toolbar.className='dash-bank-wrap noPrint';
  toolbar.innerHTML=`<div class="dash-bank">
    <div class="dash-group"><button class="dash-group-btn" type="button">☰ Operação⌄</button><div class="dash-submenu">
      ${link("{{ url_for('admin') }}",'▦','Painel Admin')}
      ${link("{{ url_for('cadastrar_entrega') }}",'⚡','Entrega rápida')}
      ${link("{{ url_for('cadastrar_entrega', modo='completo') }}",'▤','Entrega completa')}
      ${link("{{ url_for('escala') }}",'◷','Escala semanal')}
    </div></div>
    <div class="dash-group"><button class="dash-group-btn" type="button">▣ Cadastros⌄</button><div class="dash-submenu">
      ${link("{{ url_for('clientes') }}",'♙','Clientes')}
      ${link("{{ url_for('cadastrar_cooperado') }}",'♟','Cooperados')}
      ${link("{{ url_for('precos_rotas') }}",'⌖','Preços por bairro')}
    </div></div>
    <div class="dash-group"><button class="dash-group-btn" type="button">R$ Financeiro⌄</button><div class="dash-submenu">
      ${link("{{ url_for('creditos') }}",'¤','Créditos de clientes')}
      <button type="button" data-scroll="Crédito e Financeiro"><span>▥</span>Resumo financeiro</button>
      <button type="button" data-scroll="Comparativo mensal e anual"><span>↗</span>Comparativo anual</button>
    </div></div>
    <div class="dash-group"><button class="dash-group-btn" type="button">▥ Relatórios⌄</button><div class="dash-submenu">
      <button type="button" data-scroll="Operação, Cooperados e Contratos"><span>◫</span>Operação e contratos</button>
      <button type="button" data-scroll="Bairros e Rotas"><span>⌖</span>Bairros e rotas</button>
      <div class="dash-sep"></div><button type="button" data-print><span>▧</span>Imprimir relatório</button>
    </div></div>
    <div class="dash-bank-spacer"></div><a class="dash-bank-direct" href="{{ url_for('admin') }}">← Voltar ao Admin</a>
  </div>`;
  form.closest('.top').insertAdjacentElement('afterend',toolbar);

  const context=document.createElement('div');context.className='dash-context noPrint';
  context.innerHTML='<div class="dash-context-left"><span class="dash-context-title">Filtros ativos</span></div><div class="dash-context-right"><button type="button" data-apply>Aplicar filtros</button><button type="button" data-clear>Limpar filtros</button></div>';
  toolbar.insertAdjacentElement('afterend',context);

  function positionMenu(group){const btn=group.querySelector('.dash-group-btn'),menu=group.querySelector('.dash-submenu'),r=btn.getBoundingClientRect();menu.style.top=`${Math.round(r.bottom)}px`;menu.style.left=`${Math.min(Math.round(r.left),window.innerWidth-menu.offsetWidth-8)}px`}
  document.querySelectorAll('.dash-group-btn').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const group=btn.closest('.dash-group'),was=group.classList.contains('open');document.querySelectorAll('.dash-group.open').forEach(x=>x.classList.remove('open'));if(!was){group.classList.add('open');requestAnimationFrame(()=>positionMenu(group))}}));
  document.addEventListener('click',()=>document.querySelectorAll('.dash-group.open').forEach(x=>x.classList.remove('open')));
  window.addEventListener('resize',()=>document.querySelectorAll('.dash-group.open').forEach(positionMenu));
  document.querySelectorAll('[data-print]').forEach(btn=>btn.addEventListener('click',()=>window.print()));
  document.querySelectorAll('[data-scroll]').forEach(btn=>btn.addEventListener('click',()=>{const txt=btn.dataset.scroll.toLowerCase();const target=[...document.querySelectorAll('.sectionTitle h3,.year-compare-head h3')].find(x=>(x.textContent||'').toLowerCase().includes(txt));target?.closest('.sectionTitle,.year-compare')?.scrollIntoView({behavior:'smooth',block:'start'})}));

  const periodo=form.querySelector('[name="periodo"]');
  const specific=[...form.querySelectorAll('[name="data_inicio"],[name="data_fim"],[name="cooperado_id"],[name="grupo_id"],[name="cliente"],[name="status_pagamento"],[name="origem"],[name="destino"]')];
  function hasValue(el){if(el.tagName==='SELECT')return el.value&&el.value!=='todos';return Boolean(el.value.trim())}
  specific.forEach(el=>el.addEventListener('change',()=>{if(hasValue(el)&&periodo)periodo.value='personalizado'}));
  specific.filter(el=>el.tagName!=='SELECT').forEach(el=>el.addEventListener('input',()=>{if(hasValue(el)&&periodo)periodo.value='personalizado'}));

  function chips(){const left=context.querySelector('.dash-context-left');left.querySelectorAll('.dash-chip').forEach(x=>x.remove());const labels={periodo:'Período',data_inicio:'De',data_fim:'Até',cooperado_id:'Cooperado',grupo_id:'Contrato',cliente:'Cliente',status_pagamento:'Pagamento',origem:'Origem',destino:'Destino'};[...form.elements].forEach(el=>{if(!el.name||!labels[el.name])return;let value=el.value;if(!value||value==='todos')return;if(el.tagName==='SELECT')value=el.options[el.selectedIndex]?.text||value;const chip=document.createElement('span');chip.className='dash-chip';chip.innerHTML=`<strong>${labels[el.name]}:</strong> ${value}`;left.appendChild(chip)});if(!left.querySelector('.dash-chip')){const chip=document.createElement('span');chip.className='dash-chip';chip.textContent='Nenhum filtro específico';left.appendChild(chip)}}
  chips();specific.forEach(el=>el.addEventListener('change',chips));periodo?.addEventListener('change',chips);
  context.querySelector('[data-apply]').addEventListener('click',()=>form.requestSubmit());
  context.querySelector('[data-clear]').addEventListener('click',()=>{form.querySelectorAll('input').forEach(i=>i.value='');form.querySelectorAll('select').forEach(s=>s.value=s.name==='periodo'?'mes':'todos');form.requestSubmit()});
})();
</script>
