<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Cadastrar Entrega</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --azul:#0033aa; --azul-2:#002b88; --bg:#f0f4ff; --card:#fff;
      --borda:#d9e1f2; --texto:#1a1a1a; --muted:#667085; --chip:#eef3ff;
      --ok:#16a34a; --warn:#b45309;
    }
    *{box-sizing:border-box}
    body{
      font-family: Arial, sans-serif;
      background:var(--bg);
      color:var(--texto);
      display:flex; flex-direction:column; align-items:center;
      padding:20px;
    }
    h1{ color:var(--azul); margin-bottom:18px; }
    form{
      background:var(--card); padding:22px; border-radius:12px;
      box-shadow:0 0 15px rgba(0,0,0,.08);
      width:100%; max-width:460px;
      border:1px solid var(--borda);
    }
    label{ display:block; margin:10px 0 6px; font-weight:bold; }
    input[type="text"], input[type="number"], select{
      width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;
      margin-bottom:14px; background:#fff; outline:none;
    }
    input:focus, select:focus{ border-color:var(--azul); box-shadow:0 0 0 3px #0033aa22; }
    button{
      width:100%; padding:12px; border:none; border-radius:10px;
      background:var(--azul); color:#fff; font-size:16px; cursor:pointer;
      margin-top:4px;
    }
    button:hover{ background:var(--azul-2); }
    small.hint{ display:block; margin:-6px 0 12px; color:#555; }
    .top-actions{
      width:100%; max-width:460px; display:flex; justify-content:space-between;
      gap:10px; margin-bottom:10px;
    }
    a.link{ color:var(--azul); text-decoration:none; }
    a.link:hover{ text-decoration:underline }
    .search-hint{
      font-size:12px; color:var(--muted); margin:4px 0 6px;
      display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    }
    .pill{
      padding:2px 8px; border-radius:999px; background:#f8fafc; border:1px solid #e2e8f0;
      font-size:11px; color:#475569;
    }
    .result-list{
      border:1px solid var(--borda);
      background:#fff; border-radius:10px; padding:6px;
      margin:-2px 0 14px; max-height:260px; overflow:auto; display:none;
    }
    .result-item{
      display:flex; align-items:center; justify-content:space-between;
      padding:10px; border-radius:8px; cursor:pointer;
    }
    .result-item + .result-item{ border-top:1px dashed #eef2ff; }
    .result-item:hover, .result-item.active{ background:var(--chip); }
    .result-main{ display:flex; flex-direction:column; gap:2px; min-width:0; }
    .result-nome{ font-weight:600; }
    .result-sub{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .empty{ padding:10px; color:var(--muted); text-align:center; }
    .client-meta{
      display:none; margin:-4px 0 14px; padding:10px; border-radius:10px;
      background:#f8fbff; border:1px solid var(--borda); font-size:13px;
    }
    .client-meta strong{ color:var(--azul) }
    .badge-ok{ color:var(--ok); font-weight:700; }
    .badge-warn{ color:var(--warn); font-weight:700; }
    .loading{ font-size:12px; color:var(--muted); margin-top:-8px; margin-bottom:10px; display:none; }
  </style>
</head>
<body>
  <h1>Cadastrar Entrega</h1>

  <div class="top-actions">
    <a class="link" href="{{ url_for('admin') }}">← Voltar ao Painel</a>
    <a class="link" href="{{ url_for('clientes') }}">⚙️ Gerenciar Clientes</a>
  </div>

  <form method="POST" action="{{ url_for('cadastrar_entrega') }}" autocomplete="off">
    <input type="hidden" id="cliente_id" name="cliente_id" />

    <label for="cliente_manual">Cliente:</label>
    <input
      id="cliente_manual"
      name="cliente"
      type="text"
      placeholder="Digite nome do cliente ou telefone"
      required
      autocomplete="off"
      aria-autocomplete="list"
      aria-controls="resultados"
    />
    <div class="search-hint">
      🔎 Busca leve conforme digita
      <span class="pill">sem lista suspensa pesada</span>
      <span class="pill">nome</span>
      <span class="pill">telefone</span>
    </div>
    <div id="loadingBusca" class="loading">Buscando clientes...</div>
    <div id="resultados" class="result-list" role="listbox" aria-label="Resultados de clientes"></div>

    <div id="clienteMeta" class="client-meta"></div>

    <label for="bairro">Bairro da entrega:</label>
    <input id="bairro" name="bairro" type="text" placeholder="Digite o bairro da entrega" required>

    <label for="valor">Valor (R$):</label>
    <input id="valor" name="valor" type="text" inputmode="decimal" placeholder="Ex.: 12,50" required>

    <label for="pagamento">Forma de Pagamento:</label>
    <select id="pagamento" name="pagamento" required>
      <option value="CREDITO_AUTO">Crédito automático (usar saldo do cliente)</option>
      <option value="Dinheiro">Dinheiro</option>
      <option value="Pix">Pix</option>
      <option value="Pix (Cooperativa)">Pix (Cooperativa)</option>
      <option value="Comanda">Comanda</option>
    </select>
    <small class="hint">
      Se deixar em <strong>Crédito automático</strong>, o sistema tenta usar o saldo do cliente.
    </small>

    <label for="cooperado_id">Atribuir Cooperado (opcional):</label>
    <select id="cooperado_id" name="cooperado_id">
      <option value="">-- Nenhum --</option>
      {% for c in cooperados %}
        <option value="{{ c.id }}">{{ c.nome }}</option>
      {% endfor %}
    </select>

    <button type="submit">Cadastrar</button>
  </form>

  <script>
    const inputCliente = document.getElementById('cliente_manual');
    const resultados = document.getElementById('resultados');
    const clienteId = document.getElementById('cliente_id');
    const bairro = document.getElementById('bairro');
    const clienteMeta = document.getElementById('clienteMeta');
    const loadingBusca = document.getElementById('loadingBusca');

    let debounceTimer = null;
    let activeIndex = -1;
    let currentItems = [];
    let lastAbort = null;

    function esc(s){
      return String(s || '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    }

    function showResultados(show){
      resultados.style.display = show ? 'block' : 'none';
    }

    function setMeta(item){
      if(!item){
        clienteMeta.style.display = 'none';
        clienteMeta.innerHTML = '';
        return;
      }
      const saldo = Number(item.saldo_atual || 0);
      clienteMeta.innerHTML = `
        <div><strong>Cliente:</strong> ${esc(item.nome)}</div>
        <div><strong>Telefone:</strong> ${esc(item.telefone || '—')}</div>
        <div><strong>Bairro cadastrado:</strong> ${esc(item.bairro_origem || '—')}</div>
        <div><strong>Endereço:</strong> ${esc(item.endereco || '—')}</div>
        <div><strong>Saldo:</strong> <span class="${saldo > 0 ? 'badge-ok' : 'badge-warn'}">R$ ${saldo.toFixed(2).replace('.', ',')}</span></div>
      `;
      clienteMeta.style.display = 'block';
    }

    function renderItems(items){
      currentItems = items || [];
      activeIndex = -1;
      resultados.innerHTML = '';

      if(!currentItems.length){
        resultados.innerHTML = '<div class="empty">Nenhum cliente encontrado.</div>';
        showResultados(true);
        return;
      }

      currentItems.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'result-item';
        div.dataset.index = idx;
        div.innerHTML = `
          <div class="result-main">
            <div class="result-nome">${esc(item.nome)}</div>
            <div class="result-sub">${esc(item.telefone || '—')} • ${esc(item.bairro_origem || 'sem bairro')}</div>
          </div>
          <div class="pill">Selecionar</div>
        `;
        div.addEventListener('mousedown', (e) => {
          e.preventDefault();
          escolher(item);
        });
        div.addEventListener('mousemove', () => setActive(idx));
        resultados.appendChild(div);
      });

      showResultados(true);
    }

    function setActive(idx){
      const nodes = resultados.querySelectorAll('.result-item');
      nodes.forEach(n => n.classList.remove('active'));
      if(idx >= 0 && idx < nodes.length){
        nodes[idx].classList.add('active');
        activeIndex = idx;
      } else {
        activeIndex = -1;
      }
    }

    function escolher(item){
      inputCliente.value = item.nome || '';
      clienteId.value = item.id || '';
      setMeta(item);
      showResultados(false);
      bairro.focus();
    }

    async function buscarClientes(q){
      if(lastAbort){ lastAbort.abort(); }
      lastAbort = new AbortController();

      loadingBusca.style.display = 'block';
      try{
        const resp = await fetch(`{{ url_for('api_busca_clientes_entrega') }}?q=${encodeURIComponent(q)}&limit=12`, {
          signal: lastAbort.signal,
          headers: { 'X-Requested-With': 'fetch' }
        });
        const data = await resp.json();
        if(!data.ok){
          renderItems([]);
          return;
        }
        renderItems(data.items || []);
      }catch(err){
        if(err.name !== 'AbortError'){
          renderItems([]);
        }
      }finally{
        loadingBusca.style.display = 'none';
      }
    }

    inputCliente.addEventListener('input', () => {
      clienteId.value = '';
      setMeta(null);
      const q = inputCliente.value.trim();

      clearTimeout(debounceTimer);

      if(q.length < 2){
        showResultados(false);
        resultados.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(() => buscarClientes(q), 180);
    });

    inputCliente.addEventListener('keydown', (e) => {
      const items = resultados.querySelectorAll('.result-item');
      if(!items.length || resultados.style.display === 'none') return;

      if(e.key === 'ArrowDown'){
        e.preventDefault();
        const next = activeIndex < items.length - 1 ? activeIndex + 1 : 0;
        setActive(next);
        items[next].scrollIntoView({ block:'nearest' });
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        const prev = activeIndex > 0 ? activeIndex - 1 : items.length - 1;
        setActive(prev);
        items[prev].scrollIntoView({ block:'nearest' });
      } else if(e.key === 'Enter' && activeIndex >= 0){
        e.preventDefault();
        escolher(currentItems[activeIndex]);
      } else if(e.key === 'Escape'){
        showResultados(false);
      }
    });

    document.addEventListener('click', (e) => {
      if(!resultados.contains(e.target) && e.target !== inputCliente){
        showResultados(false);
      }
    });

    document.getElementById('valor').addEventListener('blur', (e) => {
      const raw = String(e.target.value || '').trim();
      if(!raw) return;
      const normalizado = raw.replace(/\s+/g,'').replace('.', '').replace(',', '.');
      const num = Number(normalizado);
      if(!Number.isNaN(num)){
        e.target.value = num.toFixed(2).replace('.', ',');
      }
    });
  </script>
</body>
</html>
