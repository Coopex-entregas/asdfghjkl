{% if request.args.get('modo') == 'completo' %}
  {% include 'cadastrar_entrega_completa.html' %}
  <style id="coopex-complete-visual">
    :root{--cx-blue:#1648d8;--cx-blue2:#0b329f;--cx-bg:#f3f6fd;--cx-card:#fff;--cx-text:#17223f;--cx-muted:#687696;--cx-line:#dbe4f6}
    body{margin:0!important;padding:16px!important;background:var(--cx-bg)!important;color:var(--cx-text)!important;font-family:Inter,Arial,Helvetica,sans-serif!important}
    h1{color:var(--cx-blue2)!important;margin:4px 0 12px!important}
    form{max-width:860px!important;border:1px solid var(--cx-line)!important;border-radius:16px!important;box-shadow:0 10px 28px rgba(18,54,145,.08)!important}
    input[type="text"],input[type="number"],select{min-height:43px!important;border-radius:11px!important;border-color:#c4d2ef!important}
    button{border-radius:11px!important;background:var(--cx-blue)!important;font-weight:850!important}
    button.alt{background:#edf3ff!important;color:var(--cx-blue2)!important;border:1px solid #c4d2ef!important}
    .delivery-mode-switch{width:100%;max-width:860px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:7px;margin:0 0 12px;border:1px solid var(--cx-line);border-radius:14px;background:#fff;box-shadow:0 8px 22px rgba(18,54,145,.07)}
    .delivery-mode-switch a{min-height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;text-decoration:none;font-weight:900;color:var(--cx-blue2)}
    .delivery-mode-switch a.active{background:var(--cx-blue);color:#fff}
    .complete-credit-note{display:none;margin:-7px 0 12px;padding:8px 10px;border-radius:10px;background:#edf3ff;border:1px solid #c4d2ef;color:var(--cx-blue2);font-size:.8rem;font-weight:700}
    @media(max-width:560px){body{padding:10px!important}.delivery-mode-switch{grid-template-columns:1fr}.top-actions{flex-wrap:wrap}}
  </style>
  <script id="coopex-complete-behavior">
  (function(){
    function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0))}
    function setup(){
      const h1=document.querySelector('h1');
      if(h1&&!document.getElementById('deliveryModeSwitch')){
        const nav=document.createElement('div');
        nav.id='deliveryModeSwitch';nav.className='delivery-mode-switch';
        nav.innerHTML='<a href="{{ url_for('cadastrar_entrega') }}">⚡ Entrega rápida</a><a class="active" href="{{ url_for('cadastrar_entrega', modo='completo') }}">📋 Entrega completa</a>';
        h1.insertAdjacentElement('afterend',nav);
      }
      const pg=document.getElementById('pagamento');
      if(pg){
        pg.innerHTML='<option value="Pix" selected>1. Pix</option><option value="Dinheiro">2. Dinheiro</option><option value="Comanda">3. Comanda</option><option id="completeCreditOption" value="CREDITO_AUTO" hidden disabled>4. Crédito automático</option>';
        let note=document.getElementById('completeCreditNote');
        if(!note){note=document.createElement('div');note.id='completeCreditNote';note.className='complete-credit-note';pg.insertAdjacentElement('afterend',note)}
      }
      const original=window.escolher;
      if(typeof original==='function'&&!original.__coopexWrapped){
        const wrapped=function(item){original(item);loadCredit(item)};
        wrapped.__coopexWrapped=true;window.escolher=wrapped;
      }
    }
    async function loadCredit(item){
      const pg=document.getElementById('pagamento'),opt=document.getElementById('completeCreditOption'),note=document.getElementById('completeCreditNote');
      if(!pg||!opt||!item)return;
      const profile={saldo:Number(item.saldo_atual||0),allowed:Math.abs(Number(item.saldo_atual||0))>0.000001,frequent:false};
      try{
        const r=await fetch(`/cliente/${item.id}/credito?format=json`,{headers:{Accept:'application/json','X-Requested-With':'fetch'},cache:'no-store'});
        const d=await r.json();
        if(r.ok&&d.ok){const movs=d.movimentos||[];const consumos=movs.filter(m=>String(m.tipo||'').toLowerCase()==='debito'&&(m.entrega_id||String(m.referencia||'').toLowerCase().includes('entrega'))).length;profile.saldo=Number(d.saldo_atual||0);profile.allowed=profile.allowed||movs.length>0||Number(d.total_creditos||0)!==0||Number(d.total_debitos||0)!==0;profile.frequent=consumos>=2}
      }catch(e){}
      opt.hidden=!profile.allowed;opt.disabled=!profile.allowed;note.style.display=profile.allowed?'block':'none';
      if(profile.allowed){note.textContent=`Crédito disponível. Saldo atual: ${money(profile.saldo)}.`;if(profile.frequent){pg.value='CREDITO_AUTO';note.textContent=`Cliente usa crédito automático com frequência. Saldo atual: ${money(profile.saldo)}.`}}else{pg.value='Pix';note.textContent=''}
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});else setup();
  })();
  </script>
{% else %}
  {% include 'cadastrar_entrega_rapida.html' %}
{% endif %}
