<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Cadastrar Entrega - Cliente da lista ou manual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f0f4ff;
      color:#1a1a1a;
      display:flex; flex-direction:column; align-items:center;
      padding:20px;
    }
    h1{ color:#0033aa; margin-bottom:18px; }
    form{
      background:#fff; padding:22px; border-radius:12px;
      box-shadow:0 0 15px rgba(0,0,0,.1);
      width:100%; max-width:460px;
    }
    label{ display:block; margin:10px 0 6px; font-weight:bold; }
    input[type="text"], input[type="number"], select{
      width:100%; padding:10px; border:1px solid #ccc; border-radius:6px;
      margin-bottom:14px; box-sizing:border-box;
    }
    button{
      width:100%; padding:12px; border:none; border-radius:8px;
      background:#0033aa; color:#fff; font-size:16px; cursor:pointer;
    }
    button:hover{ background:#002b88; }
    small.hint{ display:block; margin:-6px 0 12px; color:#555; }
    .top-actions{width:100%; max-width:460px; display:flex; justify-content:space-between; gap:10px; margin-bottom:10px;}
    a.link{ color:#0033aa; text-decoration:none; }
    a.link:hover{ text-decoration:underline }
  </style>
</head>
<body>
  <h1>Cadastrar Entrega</h1>

  <div class="top-actions">
    <a class="link" href="{{ url_for('admin') }}">← Voltar ao Painel</a>
    <a class="link" href="{{ url_for('clientes') }}">⚙️ Gerenciar Clientes</a>
  </div>

  <form method="POST" action="{{ url_for('cadastrar_entrega') }}">
    <!-- 1) PUXAR CLIENTE DA LISTA -->
    <label for="cliente_select">Cliente (cadastrado):</label>
    <select id="cliente_select">
      <option value="">-- Selecione um cliente (opcional) --</option>
      {% if clientes %}
        {% for cl in clientes %}
          <option value="{{ cl.nome }}">{{ cl.nome }}</option>
        {% endfor %}
      {% endif %}
    </select>
    <small class="hint">Se não encontrar o cliente, digite abaixo.</small>

    <!-- 2) DIGITAR MANUALMENTE (este campo é o que será enviado) -->
    <label for="cliente_manual">Ou digite o nome do cliente (manual):</label>
    <input
      id="cliente_manual"
      name="cliente"
      type="text"
      placeholder="Ex.: Restaurante Bom Sabor"
      required
      autocomplete="off"
    />
    <small class="hint">Se você escolher no campo acima, vou preencher aqui automaticamente (pode editar).</small>

    <!-- BAIRRO 100% MANUAL -->
    <label for="bairro">Bairro da entrega:</label>
    <input id="bairro" name="bairro" type="text" placeholder="Digite o bairro da entrega" required>

    <!-- Demais campos -->
    <label for="valor">Valor (R$):</label>
    <input id="valor" name="valor" type="number" step="0.01" min="0" required>

    <label for="pagamento">Forma de Pagamento:</label>
    <select id="pagamento" name="pagamento" required>
      <option value="Dinheiro">Dinheiro</option>
      <option value="Pix">Pix</option>
      <option value="Comanda">Comanda</option>
    </select>

    <label for="cooperado_id">Atribuir Cooperado (opcional):</label>
    <select id="cooperado_id" name="cooperado_id">
      <option value="">-- Nenhum --</option>
      {% for c in cooperados %}
        <option value="{{ c.id }}">{{ c.nome }}</option>
      {% endfor %}
    </select>

    <button type="submit">Cadastrar</button>
  </form>

  <script>
    // Se o usuário escolher um cliente no select, copiamos o nome para o campo manual.
    (function () {
      const sel = document.getElementById('cliente_select');
      const manual = document.getElementById('cliente_manual');

      if (!sel || !manual) return;

      sel.addEventListener('change', () => {
        const nome = sel.value || '';
        // Só preenche se o campo manual estiver vazio, para não sobrescrever o que o usuário escreveu.
        if (!manual.value && nome) manual.value = nome;
      });
    })();
  </script>
</body>
</html>
