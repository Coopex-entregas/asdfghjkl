<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Cadastrar Entrega - Coopex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4ff;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      color: #0033aa;
      margin-bottom: 20px;
    }
    form {
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    small.hint { display:block; margin-top:-10px; margin-bottom:12px; color:#555; }
    .top-actions{width:100%; max-width:420px; display:flex; justify-content:space-between; gap:10px; margin-bottom:10px;}
    .link { text-decoration: none; color: #0033aa; }
    .link:hover { text-decoration: underline; }
    button {
      background-color: #0033aa;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background-color: #002b88; }
  </style>
</head>
<body>
  <h1>Cadastrar Entrega</h1>

  <div class="top-actions">
    <a class="link" href="{{ url_for('admin') }}">← Voltar ao Painel</a>
    <a class="link" href="{{ url_for('clientes') }}">⚙️ Gerenciar Clientes</a>
  </div>

  <form method="POST" action="{{ url_for('cadastrar_entrega') }}">
    <!-- CLIENTE com datalist -->
    <label for="cliente-input">Nome do Cliente:</label>
    <input
      id="cliente-input"
      list="clientes-datalist"
      name="cliente"
      type="text"
      placeholder="Digite ou selecione…"
      required
      autocomplete="off"
    />
    <datalist id="clientes-datalist">
      {% if clientes %}
        {% for cl in clientes %}
          <option
            value="{{ cl.nome }}"
            data-bairro="{{ cl.bairro_origem or '' }}"
            data-telefone="{{ cl.telefone or '' }}"
          ></option>
        {% endfor %}
      {% endif %}
    </datalist>
    <small class="hint">Comece a digitar e escolha um cliente já cadastrado (ou cadastre um novo em “Gerenciar Clientes”).</small>

    <label for="bairro">Bairro:</label>
    <input id="bairro" type="text" name="bairro" required/>

    <label for="valor">Valor (R$):</label>
    <input id="valor" type="number" name="valor" step="0.01" min="0" required/>

    <label for="cooperado_id">Atribuir Cooperado (opcional):</label>
    <select id="cooperado_id" name="cooperado_id">
      <option value="">-- Nenhum --</option>
      {% for c in cooperados %}
        <option value="{{ c.id }}">{{ c.nome }}</option>
      {% endfor %}
    </select>

    <label for="pagamento">Forma de Pagamento:</label>
    <select id="pagamento" name="pagamento" required>
      <option value="Dinheiro">Dinheiro</option>
      <option value="Pix">Pix</option>
      <option value="Comanda">Comanda</option>
    </select>

    <button type="submit">Cadastrar</button>
  </form>

  <script>
    // Auto-preenche o "Bairro" quando o cliente é escolhido do datalist
    (function () {
      const inpCliente = document.getElementById('cliente-input');
      const lista = document.getElementById('clientes-datalist');
      const inpBairro = document.getElementById('bairro');

      function preencherCamposSeConhecido() {
        if (!lista) return;
        const valor = (inpCliente.value || '').trim().toLowerCase();
        if (!valor) return;

        // Procura option cujo value case-insensitive bate com o digitado
        const opt = Array.from(lista.options).find(o => (o.value || '').trim().toLowerCase() === valor);
        if (opt) {
          const bairro = opt.getAttribute('data-bairro') || '';
          // Só preenche bairro se estiver vazio (para não sobrescrever manual)
          if (bairro && !inpBairro.value) inpBairro.value = bairro;
        }
      }

      inpCliente.addEventListener('change', preencherCamposSeConhecido);
      inpCliente.addEventListener('blur', preencherCamposSeConhecido);
    })();
  </script>
</body>
</html>
