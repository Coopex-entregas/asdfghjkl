<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estatísticas por Cooperado - Coopex</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #003399;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .container {
      padding: 2rem;
    }
    .btn {
      background-color: #003399;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      margin-right: 1rem;
    }
    .btn:hover {
      background-color: #002080;
    }
    .filtros {
      margin-bottom: 2rem;
    }
    .filtros label {
      margin-right: 10px;
    }
    .filtros input, .filtros select {
      margin-right: 1rem;
      padding: 5px;
    }
    .resultado {
      background: #e0e7ff;
      padding: 1.5rem;
      border-radius: 10px;
    }
    .resultado div {
      margin: 1rem 0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Estatísticas por Cooperado - Coopex</h1>
  </header>

  <div class="container">
    <form method="GET" action="{{ url_for('estatisticas') }}" class="filtros">
      <label for="cooperado">Cooperado:</label>
      <select name="cooperado_id" id="cooperado">
        <option value="todos">Todos</option>
        {% for c in cooperados %}
        <option value="{{ c.id }}" {% if cooperado_id == c.id|string %}selected{% endif %}>{{ c.nome }}</option>
        {% endfor %}
      </select>

      <label for="data_inicio">De:</label>
      <input type="date" name="data_inicio" id="data_inicio" value="{{ data_inicio }}">

      <label for="data_fim">Até:</label>
      <input type="date" name="data_fim" id="data_fim" value="{{ data_fim }}">

      <button class="btn" type="submit">Filtrar</button>
      <a class="btn" href="{{ url_for('painel_admin') }}">Voltar</a>
    </form>

    <div class="resultado">
      <h2>Resultados:</h2>
      <div>Total de Entregas: <strong>{{ estatisticas.total }}</strong></div>
      <div>Entregas Pagas: <strong>{{ estatisticas.pagas }}</strong></div>
      <div>Entregas Pendentes: <strong>{{ estatisticas.pendentes }}</strong></div>
      <div>Valor Total Gerado: <strong>R$ {{ "%.2f"|format(estatisticas.total_valor) }}</strong></div>
    </div>
  </div>
</body>
</html>
