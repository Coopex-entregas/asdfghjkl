<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Painel Cooperado - Coopex (Cartões empilhados + sessão persistente)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --royal:#0033cc;         /* azul-royal principal */
    --royal-2:#2750ff;       /* acento / hover */
    --ink:#0d1733;           /* texto escuro */
    --muted:#90a5ff;         /* texto suave */
    --bg:#eaf0ff;            /* fundo claro azulado */
    --card:#ffffff;          /* cards */
    --line:#dbe4ff;          /* linhas */
    --good:#12a150;          /* verde */
    --bad:#d11a1a;           /* vermelho */
    --warn:#f59e0b;          /* laranja */
    --r:16px;                /* raio padrão */
    --shadow:0 10px 28px rgba(0,30,130,.12);
  }
  *{box-sizing:border-box}
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#dfe6ff 0%, #c9d6ff 40%, var(--bg) 100%);
  }
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(90deg,var(--royal) 68%,var(--royal-2) 100%);
    color:#fff;padding:.85rem 4vw;font-weight:800;text-align:center;letter-spacing:.2px;
    box-shadow:0 4px 18px rgba(0,40,160,.20);
  }

  /* CONTAINER ENXUTO PARA CELULAR */
  .container{max-width:640px;margin:14px auto 28px;padding:0 4vw 28px}
  .topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0 2px}
  .logout{color:#fff;background:var(--royal);padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:800;box-shadow:0 6px 16px rgba(0,51,204,.22)}
  .logout:active{transform:scale(.98)}

  /* PERÍODO NO TOPO (sem data por entrega) */
  .stats{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
  .stat{background:linear-gradient(180deg,var(--royal),#113cff);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
  .stat span{font-size:.9rem;opacity:.95}
  .stat strong{display:block;color:#ffe066;font-size:1.08rem;margin-top:4px}

  /* GLASS STATS (Total em linha inteira; Pago/Pendente lado a lado) */
  .stats-glass{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
  .glass.total{grid-column:1 / -1}
  .glass{
    position:relative;backdrop-filter:blur(10px);
    background:linear-gradient(180deg,rgba(0,51,204,.30),rgba(39,80,255,.20));
    border:1px solid rgba(120,160,255,.55);
    border-radius:16px;box-shadow:0 12px 30px rgba(0,50,160,.12);
    color:#fff;padding:12px 14px
  }
  .glass .lbl{font-weight:700;opacity:.95}
  .glass .val{display:block;font-weight:900;font-size:1.18rem;margin-top:2px}

  /* CARTA DE FILTRO PEQUENA (MOBILE-FIRST) */
  .filter-card{background:linear-gradient(180deg,#f3f7ff 0%, #eef3ff 100%);border:2px solid var(--royal);border-radius:16px;padding:8px;box-shadow:var(--shadow);margin:10px 0}
  .toolbar{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .toolbar input,.toolbar select,.toolbar button{border:2px solid var(--royal);border-radius:12px;padding:8px 9px;font-size:.95rem;outline:none}
  .toolbar button{background:var(--royal);color:#fff;border:none;font-weight:800;cursor:pointer}
  .toolbar button:active{transform:scale(.98)}
  @media (min-width:520px){.toolbar{grid-template-columns:repeat(6,1fr)}}

  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 6px}
  .chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:800;color:var(--royal)}
  .chip.active{background:var(--royal);color:#fff;border-color:transparent}

  /* === CARTÕES EMPILHADOS (UMA COLUNA) === */
  .stack{display:flex;flex-direction:column;gap:12px}

  .card{
    background:linear-gradient(180deg,#f3f7ff 0%, #eef3ff 100%);
    border-radius:var(--r);
    border:2px solid var(--royal);
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;flex-direction:column
  }
  .card-head{
    background:linear-gradient(135deg, var(--royal), var(--royal-2));
    color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between
  }
  .title{font-weight:800;letter-spacing:.2px}
  .badge{background:#ffffff22;color:#fff;border:2px solid #ffffffaa;padding:6px 12px;border-radius:999px;font-weight:800}

  .card-body{padding:12px 16px;display:grid;grid-template-columns:1fr;gap:10px}
  .row{display:flex;gap:8px;align-items:center}
  .row label{font-weight:700;color:var(--royal);min-width:120px;border-left:4px solid var(--royal);padding-left:8px}
  .row .v{font-weight:700}

  .divider{height:1px;background:rgba(0,51,204,.25);margin:8px 0}

  .actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
  .chip-act{padding:10px 14px;border-radius:999px;font-weight:800;border:2px solid var(--royal);cursor:pointer;user-select:none;background:#fff}
  .chip-act:active{transform:scale(.98)}
  .pg-pago{background:#e6faee;color:var(--good)}
  .pg-pendente{background:#ffefef;color:var(--bad)}
  .ent-entregue{background:#e6faee;color:var(--good)}
  .ent-pendente{background:#fff7e6;color:#c26e00;border-color:#ffd599}

  .recebido-inline{display:none;gap:6px;width:100%}
  .recebido-inline input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex:1}
  .recebido-inline button{background:var(--royal);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}

  .helper{text-align:center;color:var(--royal);font-size:.95rem;margin-top:12px}
  .helper b{background:#eef3ff;padding:2px 6px;border-radius:8px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#0f1a33;color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .18s ease}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <header>Cooperado: <span id="cooperado-nome">Demo</span></header>

  <div class="container">
    <div class="topbar">
      <div style="font-weight:800;color:var(--royal)">Painel do Cooperado — Cartões</div>
      <a class="logout" href="#" onclick="showToast('Você saiu (demo).')">Sair</a>
    </div>

    <!-- Período no topo -->
    <div class="stats">
      <div class="stat" id="stat-data"><span>Período</span><strong id="periodo-topo">Hoje</strong></div>
    </div>

    <!-- Totais com efeito vidro -->
    <div class="stats-glass">
      <div class="glass total"><span class="lbl">Total</span><span class="val" id="tot-geral">R$ 0,00</span></div>
      <div class="glass"><span class="lbl">Pago</span><span class="val" id="tot-pago">R$ 0,00</span></div>
      <div class="glass"><span class="lbl">Pendente</span><span class="val" id="tot-pendente">R$ 0,00</span></div>
    </div>

    <!-- Filtros compactos dentro do limite dos cards -->
    <div class="filter-card">
      <div class="toolbar">
        <input type="date" id="f-inicio">
        <input type="date" id="f-fim">
        <select id="status_pgto">
          <option value="todas">Todas</option>
          <option value="pago">Pagas</option>
          <option value="pendente">Pendentes</option>
        </select>
        <input type="search" id="busca" placeholder="Buscar...">
        <button id="btn-filtrar">Filtrar</button>
        <button id="btn-limpar" title="Limpar filtros">Limpar</button>
      </div>
      <div class="chips">
        <div class="chip active" data-sort="recente">Mais recentes</div>
        <div class="chip" data-sort="valor_desc">Maior valor</div>
        <div class="chip" data-sort="valor_asc">Menor valor</div>
      </div>
    </div>

    <div class="stack" id="cards"></div>
    <div class="helper" id="helper-msg"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ------------------------ DEMO DATA ------------------------
  const demoData = (()=>{
    const now = new Date();
    const clone = (d, mins)=> new Date(d.getTime()+mins*60000);
    const arr=[];
    for(let i=0;i<14;i++){
      const sent = clone(now, -(i*90+30));
      const delivered = clone(sent, 45+Math.floor(Math.random()*60));
      const pago = Math.random()>0.55 ? 'pago' : 'pendente';
      const entregue = Math.random()>0.7 ? 'pendente' : 'entregue';
      const valor = (15 + Math.random()*60);
      arr.push({
        id:i+1,
        cliente:`Cliente ${i+1}`,
        pagamento: ['Pix','Dinheiro','Cartão'][i%3],
        valor: Number(valor.toFixed(2)),
        data_envio: sent,
        data_atribuida: delivered,
        status_pagamento: pago,
        status: entregue,
        bairro: ['Centro','Aldeota','Meireles','Messejana'][i%4],
        recebido_por: entregue==='entregue'? ['Portaria','Recepção','Esposa','Filho'][i%4] : ''
      });
    }
    return arr;
  })();

  // -------------------- STATE & HELPERS ---------------------
  const state = {
    itens: demoData,
    filtro: { inicio:'', fim:'', status:'todas', busca:'', pendentes_all:false },
    sort: 'recente'
  };

  const LS_STATUS_KEY = 'coopex_demo_status_cards_stack_v4';
  const UI_STATE_KEY = 'coopex_demo_ui_state_v4';

  function money(n){return 'R$ '+ n.toFixed(2).replace('.',',');}
  function two(n){return String(n).padStart(2,'0');}
  function ymd(d){return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`}
  function dateBR(d){return `${two(d.getDate())}/${two(d.getMonth()+1)}`} // usado no topo
  function timeBR(d){return `${two(d.getHours())}:${two(d.getMinutes())}`}

  function restorePersistedStatuses(){
    try{ const raw = localStorage.getItem(LS_STATUS_KEY); if(!raw) return; const map = JSON.parse(raw); state.itens = state.itens.map(it=> ({...it, ...map[it.id]})); }catch{}
  }
  function savePersistedStatus(id, patch){
    try{ const raw = localStorage.getItem(LS_STATUS_KEY); const map = raw? JSON.parse(raw) : {}; map[id] = {...(map[id]||{}), ...patch}; localStorage.setItem(LS_STATUS_KEY, JSON.stringify(map)); }catch{}
  }

  function setHelperMessage(){
    const {inicio,fim,status} = state.filtro;
    const helper = document.getElementById('helper-msg');
    const periodo = document.getElementById('periodo-topo');

    // Mostrar "Hoje" se o intervalo for o dia atual
    const today = new Date();
    const ymdToday = ymd(today);
    if(inicio===ymdToday && fim===ymdToday){
      periodo.textContent = `Hoje (${dateBR(today)}/${today.getFullYear()})`;
    }else if(inicio || fim){
      const i = inicio? inicio.split('-') : null;
      const f = fim? fim.split('-') : null;
      const iStr = i? `${i[2]}/${i[1]}/${i[0]}` : '...';
      const fStr = f? `${f[2]}/${f[1]}/${f[0]}` : '...';
      periodo.textContent = `${iStr} — ${fStr}`;
    }else{
      periodo.textContent = `Hoje (${dateBR(today)}/${today.getFullYear()})`;
    }

    if(status==='pendente' && !inicio && !fim){
      helper.innerHTML = '<b>Exibindo todas as pendentes</b> (quando "Pendentes" é escolhido sem data)';
    }else if(!inicio && !fim){
      helper.innerHTML = '<b>Exibindo apenas as entregas do dia atual</b>. Use o filtro para outros dias.';
    }else{ helper.textContent = ''; }
  }

  function applyFilters(){
    const {inicio,fim,status,busca} = state.filtro;
    state.filtro.pendentes_all = (status==='pendente' && !inicio && !fim);
    setHelperMessage();

    let filtered = [...state.itens];

    if(busca){ const q = busca.trim().toLowerCase(); filtered = filtered.filter(it=> `${it.cliente} ${it.bairro} ${it.pagamento}`.toLowerCase().includes(q)); }

    if(status==='pago'){ filtered = filtered.filter(it=> (it.status_pagamento||'').toLowerCase()==='pago'); }
    if(status==='pendente'){ filtered = filtered.filter(it=> (it.status_pagamento||'').toLowerCase()!=='pago'); }

    if(inicio){ const d0 = new Date(inicio+'T00:00:00'); filtered = filtered.filter(it=> it.data_envio >= d0); }
    if(fim){ const d1 = new Date(fim+'T23:59:59'); filtered = filtered.filter(it=> it.data_envio <= d1); }

    return sortRows(filtered);
  }

  function sortRows(rows){
    const s = state.sort; const arr = [...rows];
    if(s==='recente') arr.sort((a,b)=> b.data_envio - a.data_envio);
    if(s==='valor_desc') arr.sort((a,b)=> b.valor - a.valor);
    if(s==='valor_asc') arr.sort((a,b)=> a.valor - b.valor);
    return arr;
  }

  function recalcTotals(rows){
    let total=0, pago=0; (rows||[]).forEach(r=>{ total+=r.valor; if((r.status_pagamento||'').toLowerCase()==='pago') pago+=r.valor; });
    const pendente = Math.max(0,total-pago);
    document.getElementById('tot-geral').textContent = money(total);
    document.getElementById('tot-pago').textContent = money(pago);
    document.getElementById('tot-pendente').textContent = money(pendente);
  }

  function cardTemplate(e){
    const entregue = (e.status==='recebido' || e.status==='entregue');
    return `
      <article class="card" id="card-${e.id}">
        <div class="card-head">
          <div class="title">${e.cliente}</div>
          <div class="badge">${e.bairro||'-'}</div>
        </div>
        <div class="card-body">
          <div class="row"><label>Forma Pgto</label><div class="v">${e.pagamento||'-'}</div></div>
          <div class="row"><label>Bairro Entrega</label><div class="v">${e.bairro||'-'}</div></div>
          <div class="row"><label>Valor</label><div class="v">${money(e.valor)}</div></div>
          <div class="row"><label>Hora Pedido</label><div class="v">${timeBR(e.data_envio)}</div></div>
          <div class="row"><label>Hora Atribuição</label><div class="v">${timeBR(e.data_atribuida)}</div></div>
          <div class="row"><label>Recebido por</label><div class="v">${e.recebido_por||'-'}</div></div>
        </div>
        <div class="divider"></div>
        <div class="actions">
          <span class="chip-act ${e.status_pagamento==='pago'?'pg-pago':'pg-pendente'}" data-action="toggle-pg" data-id="${e.id}" data-status="${e.status_pagamento}">
            ${e.status_pagamento==='pago'?'Pago':'Pendente'}
          </span>
          <span class="chip-act ${entregue?'ent-entregue':'ent-pendente'}" data-action="toggle-entrega" data-id="${e.id}" data-entregue="${entregue?1:0}">
            ${entregue?'Entregue':'Pendente'}
          </span>
          <div class="recebido-inline" id="rcb-${e.id}">
            <input type="text" placeholder="Recebido por" id="rcb-input-${e.id}" maxlength="60">
            <button type="button" data-action="confirmar-recebido" data-id="${e.id}">OK</button>
          </div>
        </div>
      </article>
    `;
  }

  function render(){
    const list = document.getElementById('cards');
    list.innerHTML = '';
    const rows = applyFilters();

    if(rows.length===0){
      list.innerHTML = '<div style="text-align:center;color:var(--royal);padding:14px">Nenhuma entrega encontrada.</div>';
      recalcTotals([]);
      return;
    }

    list.innerHTML = rows.map(cardTemplate).join('');
    recalcTotals(rows);
  }

  // -------------------- EVENTS ---------------------
  function showToast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(()=> el.classList.remove('show'), 2000); }

  function restoreUIState(){
    try{
      const saved = JSON.parse(localStorage.getItem(UI_STATE_KEY)||'{}');
      const fInicio = document.getElementById('f-inicio');
      const fFim = document.getElementById('f-fim');
      const sel = document.getElementById('status_pgto');
      const busca = document.getElementById('busca');
      if(saved.inicio) fInicio.value = saved.inicio;
      if(saved.fim) fFim.value = saved.fim;
      if(saved.status) sel.value = saved.status;
      if(saved.busca) busca.value = saved.busca;
      if(saved.sort){ state.sort = saved.sort; document.querySelectorAll('.chip').forEach(c=>{c.classList.toggle('active', c.dataset.sort===saved.sort)}); }
      state.filtro = {inicio:fInicio.value, fim:fFim.value, status:sel.value, busca:busca.value, pendentes_all:false};
    }catch{}
  }

  function defaultTodayIfEmpty(){
    const fInicio = document.getElementById('f-inicio');
    const fFim = document.getElementById('f-fim');
    if(!fInicio.value && !fFim.value){
      const today = new Date();
      const val = ymd(today);
      fInicio.value = val; fFim.value = val;
      state.filtro.inicio = val; state.filtro.fim = val;
    }
  }

  function bindToolbar(){
    const fInicio = document.getElementById('f-inicio');
    const fFim = document.getElementById('f-fim');
    const sel = document.getElementById('status_pgto');
    const busca = document.getElementById('busca');

    document.getElementById('btn-filtrar').addEventListener('click',()=>{
      state.filtro.inicio = fInicio.value; state.filtro.fim = fFim.value; state.filtro.status = sel.value; state.filtro.busca = busca.value;
      localStorage.setItem(UI_STATE_KEY, JSON.stringify({inicio:fInicio.value,fim:fFim.value,status:sel.value,busca:busca.value,sort:state.sort}));
      render(); showToast('Filtros aplicados');
    });
    document.getElementById('btn-limpar').addEventListener('click',()=>{
      fInicio.value=''; fFim.value=''; sel.value='todas'; busca.value='';
      state.filtro = {inicio:'', fim:'', status:'todas', busca:'', pendentes_all:false};
      localStorage.setItem(UI_STATE_KEY, JSON.stringify({inicio:'',fim:'',status:'todas',busca:'',sort:'recente'}));
      // volta a hoje automaticamente
      defaultTodayIfEmpty();
      render(); showToast('Filtros limpos');
    });
    document.querySelectorAll('.chip').forEach(ch=>{
      ch.addEventListener('click',()=>{
        document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
        ch.classList.add('active');
        state.sort = ch.dataset.sort; 
        const saved = JSON.parse(localStorage.getItem(UI_STATE_KEY)||'{}');
        localStorage.setItem(UI_STATE_KEY, JSON.stringify({...saved, sort: state.sort}));
        render();
      });
    });
  }

  // delegação para toggles nos cartões
  document.addEventListener('click', (ev)=>{
    const t = ev.target; if(!(t instanceof HTMLElement)) return;
    if(t.dataset.action==='toggle-pg'){
      const id = Number(t.dataset.id);
      const novo = (t.dataset.status||'pendente').toLowerCase()==='pago' ? 'pendente' : 'pago';
      t.dataset.status = novo; t.textContent = (novo==='pago')? 'Pago' : 'Pendente';
      t.classList.toggle('pg-pago', novo==='pago'); t.classList.toggle('pg-pendente', novo!=='pago');
      savePersistedStatus(id, {status_pagamento: novo}); render(); return;
    }
    if(t.dataset.action==='toggle-entrega'){
      const id = Number(t.dataset.id); const entregue = t.dataset.entregue==='1'; if(entregue) return;
      const box = document.getElementById('rcb-'+id); box.style.display='flex'; document.getElementById('rcb-input-'+id).focus(); return;
    }
    if(t.dataset.action==='confirmar-recebido'){
      const id = Number(t.dataset.id); const input = document.getElementById('rcb-input-'+id); const nome = (input.value||'').trim(); if(!nome){ showToast('Informe quem recebeu.'); return; }
      const ent = document.querySelector(`#card-${id} [data-action="toggle-entrega"]`);
      if(ent){ ent.textContent='Entregue'; ent.classList.remove('ent-pendente'); ent.classList.add('ent-entregue'); ent.dataset.entregue='1'; }
      document.getElementById('rcb-'+id).style.display='none';
      savePersistedStatus(id, {status:'entregue', recebido_por:nome}); render(); return;
    }
  });

  // -------------------- INIT ---------------------
  function init(){
    restorePersistedStatuses();
    restoreUIState();
    defaultTodayIfEmpty(); // sempre inicia em HOJE caso vazio
    bindToolbar();
    render();
    setHelperMessage();
  }
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
