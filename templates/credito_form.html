<!-- templates/credito_form.html -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>{{ 'Editar' if credito else 'Novo' }} crédito</title></head>
<body style="font-family:sans-serif;max-width:720px;margin:32px auto">
  <h2>{{ 'Editar' if credito else 'Novo' }} crédito</h2>
  <form method="post">
    <div>
      <label>Cliente</label><br>
      {% if credito %}
        <input type="text" value="{{ credito.cliente_id }}" disabled>
      {% else %}
        <!-- troque por um select de clientes se quiser -->
        <input type="number" name="cliente_id" required>
      {% endif %}
    </div>
    <div>
      <label>Valor bruto</label><br>
      <input type="number" step="0.01" name="valor" value="{{ credito.valor_bruto if credito else '' }}" required>
    </div>
    <div>
      <label>Desconto</label><br>
      <select name="desconto_tipo">
        {% set dt = (credito.desconto_tipo if credito else 'nenhum') %}
        <option value="nenhum"      {{ 'selected' if dt=='nenhum' }}>Nenhum</option>
        <option value="percentual"  {{ 'selected' if dt=='percentual' }}>Percentual (%)</option>
        <option value="real"        {{ 'selected' if dt=='real' }}>Valor (R$)</option>
      </select>
      <input type="number" step="0.01" name="desconto_valor" value="{{ credito.desconto_valor if credito else 0 }}">
    </div>
    <div>
      <label>Motivo</label><br>
      <input type="text" name="motivo" value="{{ credito.motivo if credito else '' }}" style="width:100%">
    </div>
    <div style="margin-top:12px">
      <button type="submit">Salvar</button>
      <a href="{{ url_for('creditos', cliente_id=(credito.cliente_id if credito else request.args.get('cliente_id'))) }}">Cancelar</a>
    </div>
  </form>
</body>
</html>
