<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Editar crédito #{{ credito.id }} | Coopex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ url_for('static', filename='logo_kratos.png') }}">
  <style>
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin:0;
      background:#0b1220;
      color:#e6efff;
    }
    .wrap{
      max-width:600px;
      margin:24px auto;
      padding:16px;
    }
    .card{
      background:#0f1629;
      border:1px solid #1c2a4a;
      border-radius:16px;
      padding:16px 18px 20px;
      box-shadow:0 10px 30px rgba(0,0,0,.4);
    }
    h1{margin-top:0;font-size:1.4rem}
    label{
      display:block;
      font-size:.85rem;
      font-weight:700;
      margin:6px 0 3px;
    }
    input, select, textarea{
      width:100%;
      padding:9px 10px;
      border-radius:10px;
      border:1px solid #29438f;
      background:#050b1a;
      color:#e6efff;
      font-size:.9rem;
    }
    input:focus, select:focus, textarea:focus{
      outline:none;
      box-shadow:0 0 0 2px rgba(88,132,255,.6);
    }
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .col{flex:1 1 0}
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:9px 14px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:800;
      font-size:.88rem;
    }
    .btn.primary{
      background:linear-gradient(90deg,#2347c7,#5a7dff);
      color:#fff;
    }
    .btn.secondary{
      background:transparent;
      color:#c5d2ff;
      border:1px solid #3b4e92;
    }
    .actions{
      margin-top:14px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    a{color:#9bb6ff;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Editar crédito #{{ credito.id }}</h1>
      <p style="font-size:.9rem;opacity:.9;margin-top:-4px">
        Cliente ID: {{ credito.cliente_id }}<br>
        Criado em: {{ credito.criado_em }}
      </p>

      <form method="POST">
        <div class="row">
          <div class="col">
            <label for="valor">Valor bruto (R$)</label>
            <input type="number" id="valor" name="valor" step="0.01" min="0"
                   value="{{ '%.2f'|format(credito.valor or credito.valor_bruto or 0) }}">
          </div>
          <div class="col">
            <label for="desconto_tipo">Tipo de desconto</label>
            <select id="desconto_tipo" name="desconto_tipo">
              <option value="nenhum"    {% if credito.desconto_tipo == 'nenhum' %}selected{% endif %}>Nenhum</option>
              <option value="percentual" {% if credito.desconto_tipo == 'percentual' %}selected{% endif %}>Percentual (%)</option>
              <option value="real"      {% if credito.desconto_tipo == 'real' %}selected{% endif %}>Valor (R$)</option>
            </select>
          </div>
        </div>

        <label for="desconto_valor">Valor do desconto</label>
        <input type="number" id="desconto_valor" name="desconto_valor" step="0.01" min="0"
               value="{{ '%.2f'|format(credito.desconto_valor or 0) }}">

        <label for="motivo">Motivo / observação</label>
        <input type="text" id="motivo" name="motivo" maxlength="180"
               value="{{ credito.motivo or '' }}">

        <div class="actions">
          <button type="submit" class="btn primary">Salvar</button>
          <a href="{{ url_for('creditos', cliente_id=credito.cliente_id) }}" class="btn secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
