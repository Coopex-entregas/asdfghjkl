<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agendar Entrega</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
            padding: 30px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 0px 12px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
        }
        input[type="text"],
        input[type="datetime-local"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Agendar Entrega</h2>
        <form method="POST" action="{{ url_for('agendar_entrega') }}">
            <label for="cliente">Cliente:</label>
            <input type="text" name="cliente" id="cliente" required>

            <label for="bairro">Bairro:</label>
            <input type="text" name="bairro" id="bairro" required>

            <label for="valor">Valor (R$):</label>
            <input type="number" name="valor" id="valor" step="0.01" required>

            <label for="data">Data da Entrega:</label>
            <input type="datetime-local" name="data" id="data" required>

            <label for="status_entrega">Status da Entrega:</label>
            <select name="status_entrega" id="status_entrega">
                <option value="pendente">Pendente</option>
                <option value="entregue">Entregue</option>
            </select>

            <label for="status_pagamento">Status do Pagamento:</label>
            <select name="status_pagamento" id="status_pagamento">
                <option value="pendente">Pendente</option>
                <option value="pago">Pago</option>
            </select>

            <button type="submit">Agendar Entrega</button>
        </form>
    </div>
</body>
</html>
