<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Agendar Entrega - Coopex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4ff;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      color: #0033aa;
      margin-bottom: 20px;
    }
    form {
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="number"],
    select,
    input[type="datetime-local"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    button {
      background-color: #0033aa;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #002b88;
    }
    a {
      text-decoration: none;
      color: #0033aa;
      margin-bottom: 20px;
      display: inline-block;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Agendar Entrega</h1>
  <a href="{{ url_for('admin') }}">← Voltar ao Painel</a>
  <form method="POST" action="{{ url_for('agendar_entrega') }}">
    <label>Nome do Cliente:</label>
    <input type="text" name="cliente" required/>

    <label>Bairro:</label>
    <input type="text" name="bairro" required/>

    <label>Valor (R$):</label>
    <input type="number" name="valor" step="0.01" min="0" required/>

    <label>Data e hora da entrega:</label>
    <input type="datetime-local" name="data" required/>

    <label>Status Pagamento:</label>
    <select name="status_pagamento">
      <option value="Pendente">Pendente</option>
      <option value="Pago">Pago</option>
    </select>

    <label>Status Entrega:</label>
    <select name="status_entrega">
      <option value="pendente">Pendente</option>
      <option value="recebido">Entregue</option>
    </select>

    <label>Forma de Pagamento:</label>
    <select name="pagamento" required>
      <option value="Dinheiro">Dinheiro</option>
      <option value="Pix">Pix</option>
      <option value="Comanda">Comanda</option>
    </select>

    <button type="submit">Agendar</button>
  </form>
</body>
</html>
