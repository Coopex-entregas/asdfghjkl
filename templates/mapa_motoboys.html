<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Mapa dos motoboys</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root{
      --royal:#1248dc;
      --royal-2:#0d35ad;
      --royal-3:#2361ff;
      --bg:#eef4ff;
      --ink:#10213f;
      --muted:#62759d;
      --line:rgba(18,72,220,.16);
      --glass:rgba(255,255,255,.86);
      --white:#fff;
      --shadow:0 18px 50px rgba(18,72,220,.14);
      --soft:0 8px 20px rgba(16,33,63,.08);
      --green:#17a55a;
      --orange:#d87a00;
      --red:#d43838;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1000px 360px at 8% -10%, rgba(35,97,255,.20), transparent 60%),
        radial-gradient(900px 360px at 100% 0%, rgba(18,72,220,.14), transparent 60%),
        linear-gradient(180deg,#f8fbff 0%, var(--bg) 100%);
      overflow:hidden;
    }

    #map{
      position:fixed;
      inset:0;
      z-index:1;
      background:#eef4ff;
    }

    /* Camada geral NÃO bloqueia o mapa */
    .ui-layer{
      position:fixed;
      inset:12px;
      z-index:700;
      pointer-events:none;
    }

    .card{
      pointer-events:auto;
      background:var(--glass);
      border:1px solid var(--line);
      border-radius:22px;
      backdrop-filter:blur(14px);
      box-shadow:var(--shadow);
    }

    /* topo compacto */
    .topbar{
      position:absolute;
      top:0;
      left:0;
      right:0;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      padding:12px 14px;
    }

    .top-left{
      min-width:260px;
      max-width:520px;
    }

    .eyebrow{
      font-size:.74rem;
      letter-spacing:.12em;
      font-weight:900;
      text-transform:uppercase;
      color:var(--royal);
    }

    .title{
      font-size:1.18rem;
      font-weight:1000;
      margin-top:4px;
    }

    .sub{
      font-size:.84rem;
      color:var(--muted);
      margin-top:4px;
      line-height:1.35;
    }

    .top-right{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
      max-width:100%;
    }

    .filter-chip,
    .small-btn{
      height:40px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--royal-2);
      font:inherit;
      font-weight:900;
      cursor:pointer;
      box-shadow:var(--soft);
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      white-space:nowrap;
    }

    .filter-chip.active,
    .small-btn.primary{
      background:linear-gradient(135deg,var(--royal),var(--royal-3));
      color:#fff;
      border:none;
    }

    /* busca lateral compacta */
    .search-box{
      position:absolute;
      top:112px;
      left:0;
      width:min(360px, calc(100vw - 24px));
      padding:12px;
    }

    .label{
      display:block;
      font-size:.8rem;
      color:var(--muted);
      font-weight:800;
      margin:0 0 6px;
    }

    .input{
      width:100%;
      height:44px;
      border-radius:15px;
      border:1px solid var(--line);
      background:#fff;
      padding:0 14px;
      font:inherit;
      color:var(--ink);
      outline:none;
      box-shadow:var(--soft);
    }

    .autocomplete{
      display:none;
      margin-top:8px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
      max-height:250px;
      overflow:auto;
    }

    .autocomplete.open{display:block}

    .ac-item{
      padding:11px 12px;
      border-top:1px solid #edf2ff;
      cursor:pointer;
    }

    .ac-item:first-child{border-top:none}
    .ac-item:hover{background:#f6f9ff}

    .ac-item strong{
      display:block;
      font-size:.92rem;
    }

    .ac-item small{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:.81rem;
    }

    .search-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .action-btn{
      height:42px;
      border:none;
      border-radius:14px;
      background:#fff;
      color:var(--royal-2);
      font:inherit;
      font-weight:900;
      cursor:pointer;
      border:1px solid var(--line);
      box-shadow:var(--soft);
    }

    .action-btn.primary{
      background:linear-gradient(135deg,var(--royal),var(--royal-3));
      color:#fff;
      border:none;
    }

    /* kpis pequenos */
    .kpis{
      position:absolute;
      top:112px;
      right:0;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      max-width:min(560px, calc(100vw - 24px));
    }

    .kpi{
      min-width:120px;
      padding:10px 12px;
    }

    .kpi .k{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:.8rem;
      color:var(--muted);
      font-weight:900;
      text-transform:uppercase;
    }

    .kpi .v{
      margin-top:4px;
      font-size:1.18rem;
      font-weight:1000;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:999px;
      display:inline-block;
      flex:0 0 auto;
    }

    .dot.green{background:var(--green)}
    .dot.orange{background:var(--orange)}
    .dot.red{background:var(--red)}

    /* painel selecionado no rodapé, compacto */
    .bottom-panel{
      position:absolute;
      left:0;
      bottom:0;
      width:min(430px, calc(100vw - 24px));
      padding:14px 16px;
    }

    .bottom-panel h3{
      margin:0 0 4px;
      font-size:1rem;
    }

    .muted{
      color:var(--muted);
      font-size:.84rem;
    }

    .kv{
      display:grid;
      grid-template-columns:auto 1fr;
      gap:8px 12px;
      margin-top:12px;
      font-size:.9rem;
    }

    .kv b{color:var(--royal-2)}

    .mini-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .mini-btn{
      height:38px;
      padding:0 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      font:inherit;
      font-weight:900;
      cursor:pointer;
      box-shadow:var(--soft);
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    /* lista curta flutuante, não ocupa a tela toda */
    .quick-list{
      position:absolute;
      right:0;
      bottom:0;
      width:min(430px, calc(100vw - 24px));
      max-height:38vh;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      overflow:auto;
    }

    .person{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:11px 12px;
      box-shadow:var(--soft);
      cursor:pointer;
    }

    .person.active{
      border-color:rgba(18,72,220,.34);
      box-shadow:0 10px 24px rgba(18,72,220,.12);
    }

    .person-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .person strong{
      display:block;
      font-size:.92rem;
    }

    .person small{
      display:block;
      margin-top:5px;
      color:var(--muted);
      line-height:1.35;
      font-size:.81rem;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:26px;
      padding:4px 9px;
      border-radius:999px;
      font-size:.74rem;
      font-weight:900;
      border:1px solid var(--line);
      white-space:nowrap;
    }

    .badge.green{
      color:var(--green);
      background:rgba(23,165,90,.10);
    }

    .badge.red{
      color:var(--red);
      background:rgba(212,56,56,.10);
    }

    .badge.mix-go{
      color:#3d5a26;
      background:linear-gradient(90deg, rgba(23,165,90,.12) 0 58%, rgba(216,122,0,.12) 58% 100%);
    }

    .badge.mix-ro{
      color:#7c4032;
      background:linear-gradient(90deg, rgba(212,56,56,.12) 0 58%, rgba(216,122,0,.12) 58% 100%);
    }

    .leaflet-control-attribution{display:none}

    .leaflet-control-zoom{
      border:none !important;
      box-shadow:var(--shadow) !important;
      overflow:hidden;
      border-radius:16px !important;
      margin-top:88px !important;
      margin-right:14px !important;
    }

    .leaflet-control-zoom a{
      width:40px !important;
      height:40px !important;
      line-height:40px !important;
      color:var(--ink) !important;
      border:none !important;
    }

    .leaflet-popup-content-wrapper{
      border-radius:18px;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      background:#fff;
      color:var(--ink);
    }

    .leaflet-popup-content{
      margin:14px;
      min-width:220px;
    }

    .popup-title{
      font-size:1rem;
      font-weight:1000;
      color:var(--royal-2);
      margin-bottom:8px;
    }

    .popup-row{
      margin-top:6px;
      font-size:.9rem;
    }

    .popup-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .popup-actions a{
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#f8fbff;
      color:var(--royal-2);
      font-size:.82rem;
      font-weight:900;
    }

    @media (max-width:900px){
      .topbar{
        position:static;
        width:100%;
      }

      .search-box,
      .kpis,
      .bottom-panel,
      .quick-list{
        position:static;
        width:100%;
        max-width:none;
        margin-top:10px;
      }

      .ui-layer{
        overflow:auto;
      }

      .quick-list{
        max-height:none;
      }

      .leaflet-control-zoom{
        margin-top:14px !important;
      }
    }

    #personList,
    .quick-list,
    .person{
      display:none !important;
    }

    @media (max-width:640px){
      .top-right{
        width:100%;
        justify-content:flex-start;
      }

      .filter-chip,
      .small-btn{
        flex:1 1 auto;
      }

      .search-actions{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="ui-layer">
    <section class="card topbar">
      <div class="top-left">
        <div class="eyebrow">Monitoramento ao vivo</div>
        <div class="title">Mapa dos motoboys</div>
        <div class="sub">Busca rápida, filtros corretos e mapa livre para arrastar, clicar e usar zoom.</div>
      </div>

      <div class="top-right">
        <button type="button" class="filter-chip active" data-filter="todos">Todos</button>
        <button type="button" class="filter-chip" data-filter="online">Online</button>
        <button type="button" class="filter-chip" data-filter="com_entrega">Com entrega</button>
        <button type="button" class="filter-chip" data-filter="offline">Offline</button>
        <a class="small-btn" href="/trajetos">Trajetos</a>
        <a class="small-btn primary" href="{{ url_for('admin') }}">Voltar</a>
      </div>
    </section>

    <section class="card search-box">
      <label class="label" for="searchInput">Buscar cooperado</label>
      <input id="searchInput" class="input" type="text" autocomplete="off" placeholder="Digite o nome do motoboy">
      <div id="autocompleteList" class="autocomplete"></div>

      <div class="search-actions">
        <button id="btnFollowSelected" class="action-btn primary" type="button">Seguir</button>
        <button id="btnClearFollow" class="action-btn" type="button">Parar</button>
        <button id="btnFitAll" class="action-btn" type="button">Enquadrar</button>
        <button id="btnRefresh" class="action-btn" type="button">Atualizar</button>
      </div>
    </section>

    <section class="kpis">
      <div class="card kpi">
        <div class="k"><span class="dot green"></span> Online</div>
        <div class="v" id="countOnline">0</div>
      </div>
      <div class="card kpi">
        <div class="k"><span class="dot orange"></span> Com entrega</div>
        <div class="v" id="countBusy">0</div>
      </div>
      <div class="card kpi">
        <div class="k"><span class="dot red"></span> Offline</div>
        <div class="v" id="countOffline">0</div>
      </div>
    </section>

    <aside class="card bottom-panel">
      <h3 id="infoName">Selecione um motoboy</h3>
      <div class="muted" id="infoSubtitle">Clique em um marcador ou escolha na lista.</div>

      <div class="kv">
        <b>Status</b><span id="infoStatus">—</span>
        <b>Velocidade</b><span id="infoSpeed">—</span>
        <b>Entregas abertas</b><span id="infoDeliveries">—</span>
        <b>Atualizado</b><span id="infoUpdated">—</span>
      </div>

      <div class="mini-actions">
        <button id="btnMaps" class="mini-btn" type="button">Abrir no Maps</button>
        <button id="btnStreet" class="mini-btn" type="button">Ver rua</button>
        <button id="btnReplay" class="mini-btn" type="button">Trajetos</button>
      </div>
    </aside>

    <section id="personList" class="quick-list"></section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const seed = Array.isArray({% if motoboys_js is defined %}{{ motoboys_js|tojson|safe }}{% else %}[]{% endif %})
      ? {% if motoboys_js is defined %}{{ motoboys_js|tojson|safe }}{% else %}[]{% endif %}
      : [];

    const DATA_ENDPOINT = '/mapa_motoboys?format=json';
    const POLL_MS = 2000;

    const map = L.map('map', {
      preferCanvas: true,
      zoomControl: true,
      minZoom: 3,
      maxZoom: 21,
      zoomSnap: 0.25
    }).setView([-5.79448, -35.211], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      minZoom: 3,
      maxZoom: 22,
      maxNativeZoom: 19,
      updateWhenZooming: false,
      updateWhenIdle: true,
      keepBuffer: 8
    }).addTo(map);

    setTimeout(() => map.invalidateSize(), 200);
    window.addEventListener('resize', () => {
      setTimeout(() => map.invalidateSize(), 120);
    });

    const markers = new Map();
    let allItems = seed.slice();
    let selected = null;
    let followId = null;
    let currentFilter = 'todos';
    let timer = null;

    const $ = id => document.getElementById(id);
    const norm = s => (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const fmt = v => (v === null || v === undefined || v === '') ? '—' : String(v);

    function mapsUrl(lat, lng){
      return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
    }

    function streetUrl(lat, lng){
      return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;
    }

    function isBusy(item){
      return Number(item.entregas_abertas || 0) > 0 || item.status === 'em_corrida';
    }

    function isOnline(item){
      return item.status === 'livre' || item.status === 'em_corrida';
    }

    function visualState(item){
      const online = isOnline(item);
      const busy = isBusy(item);

      if (online && busy) return 'online_busy';
      if (online && !busy) return 'online_free';
      if (!online && busy) return 'offline_busy';
      return 'offline_free';
    }

    function statusLabel(item){
      const state = visualState(item);
      if (state === 'online_busy') return 'Online com entrega';
      if (state === 'online_free') return 'Online';
      if (state === 'offline_busy') return 'Offline com entrega';
      return 'Offline';
    }

    function badgeClass(item){
      const state = visualState(item);
      if (state === 'online_busy') return 'mix-go';
      if (state === 'online_free') return 'green';
      if (state === 'offline_busy') return 'mix-ro';
      return 'red';
    }

    function priority(item){
      const state = visualState(item);
      if (state === 'online_busy') return 4;
      if (state === 'online_free') return 3;
      if (state === 'offline_busy') return 2;
      return 1;
    }

    function markerSvg(item){
      const state = visualState(item);

      let base = '#17a55a';
      let accent = '';
      let halo = 'rgba(23,165,90,.16)';

      if (state === 'online_busy'){
        base = '#17a55a';
        accent = '<circle cx="18" cy="6" r="3.8" fill="#d87a00" stroke="#ffffff" stroke-width="1.4"/>';
      } else if (state === 'offline_busy'){
        base = '#d43838';
        accent = '<circle cx="18" cy="6" r="3.8" fill="#d87a00" stroke="#ffffff" stroke-width="1.4"/>';
        halo = 'rgba(212,56,56,.16)';
      } else if (state === 'offline_free'){
        base = '#d43838';
        halo = 'rgba(212,56,56,.16)';
      }

      return `
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="11" fill="${halo}"/>
          <circle cx="12" cy="12" r="7.4" fill="${base}" stroke="#ffffff" stroke-width="2"/>
          <circle cx="12" cy="12" r="2.1" fill="#ffffff"/>
          ${accent}
        </svg>
      `;
    }

    function iconFor(item){
      return L.icon({
        iconUrl: 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(markerSvg(item)))),
        iconSize: [24, 24],
        iconAnchor: [12, 12],
        popupAnchor: [0, -12]
      });
    }

    function popupHtml(item){
      return `
        <div class="popup-title">${item.nome || 'Cooperado'}</div>
        <div><span class="badge ${badgeClass(item)}">${statusLabel(item)}</span></div>
        <div class="popup-row"><strong>Km/h:</strong> ${Number(item.velocidade || 0).toFixed(1)}</div>
        <div class="popup-row"><strong>Entregas abertas:</strong> ${Number(item.entregas_abertas || 0)}</div>
        <div class="popup-row"><strong>Atualizado:</strong> ${fmt(item.ultima_atualizacao)}</div>
        <div class="popup-row"><strong>Precisão:</strong> ${item.accuracy_m ? Number(item.accuracy_m).toFixed(0) + ' m' : '—'}</div>
        <div class="popup-actions">
          <a href="${mapsUrl(item.lat, item.lng)}" target="_blank" rel="noopener">Maps</a>
          <a href="${streetUrl(item.lat, item.lng)}" target="_blank" rel="noopener">Ver rua</a>
          <a href="/trajetos?cooperado_id=${item.id}">Trajetos</a>
        </div>
      `;
    }

    function setInfo(item){
      selected = item || null;

      $('infoName').textContent = item ? item.nome : 'Selecione um motoboy';
      $('infoSubtitle').textContent = item ? 'Use seguir para acompanhar em tempo real.' : 'Clique em um marcador ou escolha na lista.';
      $('infoStatus').textContent = item ? statusLabel(item) : '—';
      $('infoSpeed').textContent = item ? `${Number(item.velocidade || 0).toFixed(1)} km/h` : '—';
      $('infoDeliveries').textContent = item ? String(Number(item.entregas_abertas || 0)) : '—';
      $('infoUpdated').textContent = item ? fmt(item.ultima_atualizacao) : '—';

      document.querySelectorAll('.person').forEach(el => {
        el.classList.toggle('active', item && String(el.dataset.id) === String(item.id));
      });
    }

    function filteredItems(){
      const q = norm($('searchInput').value);

      return allItems.filter(item => {
        if (currentFilter === 'online' && !isOnline(item)) return false;
        if (currentFilter === 'com_entrega' && !isBusy(item)) return false;
        if (currentFilter === 'offline' && isOnline(item)) return false;
        if (q && !norm(item.nome).includes(q)) return false;
        return true;
      });
    }

    function refreshCounters(){
      $('countOnline').textContent = allItems.filter(i => isOnline(i)).length;
      $('countBusy').textContent = allItems.filter(i => isBusy(i)).length;
      $('countOffline').textContent = allItems.filter(i => !isOnline(i)).length;
    }

    function buildAutocomplete(){
      const host = $('autocompleteList');
      const q = norm($('searchInput').value).trim();

      if (!q){
        host.classList.remove('open');
        host.innerHTML = '';
        return;
      }

      const matches = allItems.filter(i => norm(i.nome).includes(q)).slice(0, 8);

      if (!matches.length){
        host.classList.remove('open');
        host.innerHTML = '';
        return;
      }

      host.innerHTML = matches.map(item => `
        <div class="ac-item" data-id="${item.id}">
          <strong>${item.nome}</strong>
          <small>${statusLabel(item)} • ${Number(item.entregas_abertas || 0)} entrega(s)</small>
        </div>
      `).join('');

      host.classList.add('open');

      host.querySelectorAll('.ac-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          const item = allItems.find(i => String(i.id) === String(id));
          if (!item) return;
          $('searchInput').value = item.nome;
          host.classList.remove('open');
          renderAll();
          focusItem(item.id, true);
        });
      });
    }

    function buildList(items){ return; }

    function renderMarkers(items){
      const ids = new Set(items.map(i => String(i.id)));

      Array.from(markers.keys()).forEach(id => {
        if (!ids.has(String(id))){
          map.removeLayer(markers.get(id));
          markers.delete(id);
        }
      });

      items.forEach(item => {
        let marker = markers.get(item.id);

        if (!marker){
          marker = L.marker([item.lat, item.lng], {
            icon: iconFor(item),
            zIndexOffset: priority(item) * 1000 + Number(item.entregas_abertas || 0)
          }).addTo(map);

          marker.on('click', () => {
            setInfo(item);
            marker.bindPopup(popupHtml(item)).openPopup();
          });

          markers.set(item.id, marker);
        } else {
          marker.setLatLng([item.lat, item.lng]);
          marker.setIcon(iconFor(item));
          marker.setZIndexOffset(priority(item) * 1000 + Number(item.entregas_abertas || 0));
          marker.off('click');
          marker.on('click', () => {
            setInfo(item);
            marker.bindPopup(popupHtml(item)).openPopup();
          });
        }
      });

      if (followId){
        const f = allItems.find(i => String(i.id) === String(followId));
        if (f){
          map.panTo([f.lat, f.lng], { animate:true, duration:.8 });
        }
      }
    }

    function renderAll(){
      const items = filteredItems();
      refreshCounters();
      renderMarkers(items);
      buildAutocomplete();
    }

    function focusItem(id, openPopup){
      const item = allItems.find(i => String(i.id) === String(id));
      if (!item) return;

      setInfo(item);

      let marker = markers.get(item.id);
      if (!marker){
        renderAll();
        marker = markers.get(item.id);
      }

      if (!marker) return;

      map.setView([item.lat, item.lng], Math.max(map.getZoom(), 18), { animate:true });

      if (openPopup){
        marker.bindPopup(popupHtml(item)).openPopup();
      }
    }

    function fitAll(){
      const items = filteredItems();
      if (!items.length) return;

      const bounds = L.latLngBounds(items.map(i => [i.lat, i.lng]));
      map.fitBounds(bounds.pad(0.16), { maxZoom: 18 });
      setTimeout(() => map.invalidateSize(), 120);
    }

    async function fetchData(){
      try{
        const resp = await fetch(DATA_ENDPOINT, { cache:'no-store' });
        const data = await resp.json();

        allItems = (Array.isArray(data) ? data : []).sort((a, b) => {
          const pa = priority(a), pb = priority(b);
          if (pa !== pb) return pb - pa;
          return (Number(b.entregas_abertas || 0) - Number(a.entregas_abertas || 0))
            || (a.nome || '').localeCompare(b.nome || '');
        });

        if (selected){
          const newer = allItems.find(i => String(i.id) === String(selected.id));
          if (newer) selected = newer;
        }

        renderAll();
      } catch(err){
        console.error(err);
      }
    }

    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderAll();
      });
    });

    $('searchInput').addEventListener('input', renderAll);
    $('searchInput').addEventListener('focus', buildAutocomplete);

    document.addEventListener('click', (e) => {
      const host = $('autocompleteList');
      if (!host.contains(e.target) && e.target !== $('searchInput')){
        host.classList.remove('open');
      }
    });

    $('btnFollowSelected').addEventListener('click', () => {
      if (!selected) return;
      followId = String(selected.id);
      focusItem(selected.id, true);
    });

    $('btnClearFollow').addEventListener('click', () => {
      followId = null;
    });

    $('btnFitAll').addEventListener('click', fitAll);
    $('btnRefresh').addEventListener('click', fetchData);

    $('btnMaps').addEventListener('click', () => {
      if (selected) window.open(mapsUrl(selected.lat, selected.lng), '_blank', 'noopener');
    });

    $('btnStreet').addEventListener('click', () => {
      if (selected) window.open(streetUrl(selected.lat, selected.lng), '_blank', 'noopener');
    });

    $('btnReplay').addEventListener('click', () => {
      window.location.href = '/trajetos' + (selected ? `?cooperado_id=${selected.id}` : '');
    });

    map.on('dragstart', () => {
      followId = null;
    });

    allItems = seed.slice().sort((a, b) => {
      const pa = priority(a), pb = priority(b);
      if (pa !== pb) return pb - pa;
      return (Number(b.entregas_abertas || 0) - Number(a.entregas_abertas || 0))
        || (a.nome || '').localeCompare(b.nome || '');
    });

    renderAll();

    if (allItems.length){
      fitAll();
    }

    timer = setInterval(fetchData, POLL_MS);
  </script>
</body>
</html>
