{% include 'editar_entrega_original.html' %}
{% include 'coopex_visual_patch.html' %}
<style id="coopex-edit-delivery-dark-fix">
  .wrap{width:min(1180px,100%)!important;max-width:1180px!important}
  body.dark{
    --bg:#071326!important;
    --card:#101f38!important;
    --text:#f2f6ff!important;
    --muted:#c2d0eb!important;
    --line:#314a73!important;
    color-scheme:dark!important;
    background:#071326!important;
    color:#f2f6ff!important;
  }
  html body.dark .back{color:#c7d7ff!important}
  html body.dark .shell{background:#0d1b32!important;border-color:#3a527b!important;box-shadow:0 18px 44px rgba(0,0,0,.34)!important}
  html body.dark .shell form{background:#0d1b32!important;color:#f2f6ff!important}
  html body.dark .shell form .section{
    background:#12213a!important;
    background-image:none!important;
    border-color:#3a527b!important;
    color:#f2f6ff!important;
  }
  html body.dark .shell form .section h2{color:#c7d8ff!important}
  html body.dark .shell form .info{
    background:#09162a!important;
    background-image:none!important;
    border-color:#3d5785!important;
    color:#f5f8ff!important;
  }
  html body.dark .shell form .info strong{color:#a9c4ff!important}
  html body.dark .shell form label{color:#cbd9f2!important;-webkit-text-fill-color:#cbd9f2!important}
  html body.dark .shell form input[type="text"],
  html body.dark .shell form input[type="number"],
  html body.dark .shell form select,
  html body.dark .shell form textarea{
    background:#071428!important;
    background-image:none!important;
    color:#fff!important;
    -webkit-text-fill-color:#fff!important;
    border-color:#4a6694!important;
    box-shadow:none!important;
  }
  html body.dark .shell form input::placeholder,
  html body.dark .shell form textarea::placeholder{color:#8fa2c2!important;-webkit-text-fill-color:#8fa2c2!important;opacity:1!important}
  html body.dark .shell form select option{background:#071428!important;color:#fff!important}
  html body.dark .shell form input:focus,
  html body.dark .shell form select:focus,
  html body.dark .shell form textarea:focus{border-color:#79a0ff!important;box-shadow:0 0 0 4px rgba(86,126,255,.2)!important}
  html body.dark .shell form .stop{background:#09162a!important;border-color:#3d5785!important;color:#f2f6ff!important}
  html body.dark .shell form .stop-badge{background:#1a3157!important;color:#dbe7ff!important}
  html body.dark .shell form .btn-soft{background:#18315a!important;color:#eef3ff!important;border:1px solid #45628f!important}
  html body.dark .shell form .submit-row{background:transparent!important}
  html body.dark .hero{background:linear-gradient(135deg,#123da8,#1d56dc)!important}
  @media(max-width:760px){.wrap{width:100%!important}.shell{border-radius:20px!important}}
</style>
<script id="coopex-edit-delivery-theme-now">
(function(){
  const apply=()=>{
    if(localStorage.getItem('coopex_theme')==='dark')document.body.classList.add('dark');
    else document.body.classList.remove('dark');
  };
  apply();
  window.addEventListener('pageshow',apply);
})();
</script>
