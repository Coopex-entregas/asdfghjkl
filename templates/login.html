<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login | Painel Coopex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #0A192F; color: #FFF; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: #112D4E; padding: 30px 30px 20px 30px; border-radius: 14px; box-shadow: 0 2px 20px #0005; width: 320px; }
        h2 { margin: 0 0 15px; color: #00BFFF; font-weight: 700; text-align: center;}
        label { color: #FFF; font-size: 16px; }
        input { width: 100%; padding: 10px; margin: 8px 0 18px; border: none; border-radius: 8px; background: #DBE2EF; }
        button { width: 100%; padding: 12px; background: #00BFFF; border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 17px; cursor: pointer;}
        button:hover { background: #2563eb;}
        .mensagem { background: #f44336; color: #fff; padding: 8px 10px; border-radius: 7px; margin-bottom: 10px; text-align: center;}
    </style>
</head>
<body>
    <form class="login-box" method="POST" action="{{ url_for('login') }}">
        <h2>Painel Coopex</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
                <div class="mensagem">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" required autofocus>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
