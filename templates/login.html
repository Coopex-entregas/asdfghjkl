<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - KRATOS SYSTEM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #e3f0fd;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 10px #ccc;
            padding: 30px;
            text-align: center;
        }
        .container img {
            max-height: 50px;
            margin: 0 10px;
            vertical-align: middle;
        }
        h2 {
            color: #1967be;
            margin: 20px 0;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
        }
        button {
            background: #1967be;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }
        .erro {
            color: red;
            margin-bottom: 12px;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <img src="{{ url_for('static', filename='logo_coopex.png') }}" alt="Logo COOPEX" style="height: 120px; margin: 10px;">
    	    <img src="{{ url_for('static', filename='logo_kratos.png') }}" alt="KRATOS SYSTEM" style="height: 40px; margin: 10px;">
        </div>
        <h2>Login</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="erro">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        <form method="POST" autocomplete="off">
            <input type="text" name="usuario" placeholder="Usuário" required autofocus>
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
