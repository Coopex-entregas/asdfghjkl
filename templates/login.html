<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Painel de Login</title>
    <style>
        body { background: #fff; color: #222; font-family: Arial; }
        .container { max-width: 350px; margin: 90px auto; background: #e3f0fd; border-radius: 14px; box-shadow: 0 2px 8px #ccc; padding: 36px 36px 32px 36px; }
        h2 { color: #1967be; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin: 8px 0 16px 0; border-radius: 7px; border: 1px solid #d3d3d3;}
        button { background: #1967be; color: #fff; border: none; border-radius: 7px; padding: 12px 0; width: 100%; font-size: 1.1em; font-weight: bold; }
        .erro { color: red; margin-bottom: 10px; text-align: center;}
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="erro">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="usuario" placeholder="Usuário" required autofocus>
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
