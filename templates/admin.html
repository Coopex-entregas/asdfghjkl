<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Kratos System - Supervisão</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#003399;--azul-escuro:#1e2a44;--azul-grad:linear-gradient(90deg,#003399 55%,#4f8cff 110%);
  --azul-hover:#174ea6;--roxo:#6366f1;--verde:#13a038;--vermelho:#d11a1a;--amarelo:#ffe066;
  --cinza-bg:#f3f6fb;--grafite:#0f172a;--shadow:0 6px 24px #0033991a;--shadow-sm:0 2px 10px #00339918;
  --glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.75);--blur:10px;--radius:16px;--rsm:11px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--cinza-bg);color:var(--azul-escuro)}
/* ===== Header com KPIs ===== */
header{position:sticky;top:0;z-index:99;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
  padding:12px 2vw;background:rgba(0,51,153,.82);backdrop-filter:blur(var(--blur));color:#fff;box-shadow:var(--shadow)}
.header-left{display:flex;align-items:center;gap:14px}
.logo-topo{width:58px;height:58px;background:#fff;border-radius:14px;object-fit:contain;border:2.5px solid #ddeaff;padding:6px;
  box-shadow:0 2px 13px #0033991f}
h1{margin:0;font-weight:800;font-size:1.28rem;letter-spacing:.3px;white-space:nowrap}
.header-kpis{display:flex;gap:12px;flex-wrap:wrap}
.kpi{min-width:190px;padding:10px 14px;border-radius:12px;border:1px solid var(--glass-b);background:var(--glass);
  backdrop-filter:blur(var(--blur));box-shadow:var(--shadow-sm);color:#0e1a37;font-weight:700}
.kpi small{color:#003399;font-weight:800}
.kpi strong{display:block;color:#003399;font-size:1.25rem;margin-top:2px}
.logout{background:#c1121f;color:#fff;border:none;border-radius:18px;padding:9px 22px;font-weight:800;box-shadow:var(--shadow-sm);text-decoration:none}
.logout:hover{background:#a20f1a}
/* ===== Painel ===== */
.painel-bg{position:relative;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 2vw 14px;margin:12px 0 18px;
  overflow:hidden;background:linear-gradient(115deg,#f4f8ff 60%,#e3f2ff 100%);}
.bg-overlay{position:absolute;inset:0;background:rgba(255,255,255,.38);backdrop-filter:blur(6px);z-index:0;border:1px solid var(--glass-b)}
.painel-bg > .content{position:relative;z-index:2;max-width:1280px;margin:auto}
/* ===== Linha 2: Lista / Cooperados / Data+Feriado ===== */
.row-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid #e6ebff;border-radius:13px;box-shadow:var(--shadow-sm);padding:14px}
.card h3{margin:0 0 10px;color:#003399;font-size:1.02rem}
.espera-bar{display:flex;gap:8px;margin-bottom:6px}
#espera-nome{flex:1;border:1.2px solid #a8b9e4;border-radius:8px;padding:7px 10px;background:#f7faff}
.espera-add{background:#003399;color:#fff;border:none;border-radius:50%;width:34px;height:34px;font-weight:800;box-shadow:var(--shadow-sm);cursor:pointer}
#espera-lista{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:8px;background:#f1f6ff;border:1px solid #d9e4ff;padding:5px 8px;border-radius:9px}
.chip-num{background:#003399;color:#fff;border-radius:6px;padding:2px 6px;font-weight:800;font-size:.85em}
.chip-x{margin-left:auto;background:#e53e3e;color:#fff;border:none;border-radius:6px;width:24px;height:24px;cursor:pointer;font-weight:800}
#filtro-cooperado{width:100%;margin-bottom:8px;border:1.2px solid #a8b9e4;border-radius:8px;padding:7px 10px;background:#f7faff}
#lista-cooperados{list-style:none;margin:0;padding:0;max-height:160px;overflow:auto}
#lista-cooperados li{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#lista-cooperados button{background:#d11a1a;color:#fff;border:none;border-radius:4px;padding:2px 6px;font-size:12px;font-weight:800}
.data-feriado{font-weight:800;color:#003399}
.ok{color:#2463ff}.alert{color:#d11a1a}
/* ===== Ações + Filtros (colados na tabela) ===== */
.actions-filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{background:var(--azul-grad);color:#fff;border:none;border-radius:12px;padding:10px 16px;font-weight:800;text-decoration:none;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--azul-hover)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid #e6ebff;border-radius:12px;padding:8px 10px;box-shadow:var(--shadow-sm)}
.filtros label{font-size:13px;color:#003399;font-weight:800}
.filtros select,.filtros input{font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid #a8b9e4;background:#f7faff;color:#003399;font-weight:600}
/* ===== Tabela ===== */
.tabela{background:#fff;border:1px solid #e6ebff;border-radius:16px;box-shadow:var(--shadow);padding:10px;max-height:69vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14.2px;table-layout:fixed}
th,td{border:1px solid #e9edf8;padding:9px 6px;text-align:center;vertical-align:middle;word-break:break-word}
th{position:sticky;top:0;background:linear-gradient(90deg,rgba(0,51,153,.92) 60%,rgba(79,140,255,.92) 120%);color:#fff;font-weight:800}
tbody tr:hover td{background:#f1f6ff}
.status-verde{color:#13a038;background:#e7f9ef;border-radius:7px;padding:3px 6px;font-weight:800;display:inline-block}
.status-vermelho{color:#d11a1a;background:#fdeaea;border-radius:7px;padding:3px 6px;font-weight:800;display:inline-block}
/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(10,16,28,.58);display:none;align-items:center;justify-content:center;z-index:9999}
.modal{background:#fff;border:1px solid #e6ebff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:540px;width:92%;padding:22px 20px 18px;text-align:center}
.modal h2{margin:0 0 8px;color:#003399}.modal p{margin:6px 0 14px;color:#21324d;font-weight:600}
.modal-btn{background:linear-gradient(90deg,#003399,#4f8cff);color:#fff;border:none;border-radius:10px;padding:10px 22px;font-weight:800;cursor:pointer;box-shadow:var(--shadow-sm)}
.icon{width:54px;height:54px;border-radius:50%;background:#fff3cd;border:2px solid #ffec99;color:#b45309;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px}
@media (max-width:1100px){.row-top{grid-template-columns:1fr}.header-kpis{justify-content:flex-start}}
@media (max-width:900px){header{grid-template-columns:1fr auto;row-gap:8px}.header-kpis{grid-column:1/-1}}
</style>
</head>
<body>
<!-- HEADER -->
<header>
  <div class="header-left">
    <img src="{{ url_for('static', filename='logo_kratos.png') }}" alt="Logo Kratos" class="logo-topo">
    <h1>Kratos System - Supervisão</h1>
  </div>
  <div class="header-kpis">
    <div class="kpi"><small>Entregas do Dia</small><strong>{{ estatisticas.total_dia }}</strong></div>
    <div class="kpi"><small>Entregas do Mês</small><strong>{{ estatisticas.total_mes }}</strong></div>
    <div class="kpi"><small>Entregas do Ano</small><strong>{{ estatisticas.total_ano }}</strong></div>
  </div>
  <a class="logout" href="{{ url_for('logout') }}">Sair</a>
</header>

<!-- MODAL -->
<div id="overlay" class="modal-overlay">
  <div class="modal">
    <div class="icon">⚠️</div>
    <h2 id="modal-title">Atenção</h2>
    <p id="modal-msg">Mensagem</p>
    <button id="modal-ok" class="modal-btn" type="button">OK</button>
  </div>
</div>

<!-- PAINEL -->
<div id="painel-bg" class="painel-bg">
  <div class="bg-overlay"></div>
  <div class="content">
    <!-- aqui segue igual seu HTML -->
  </div>
</div>

<!-- scripts removendo função de trocar fundo -->
<script>
const overlay=document.getElementById('overlay');
const modalTitle=document.getElementById('modal-title');
const modalMsg=document.getElementById('modal-msg');
const modalOk=document.getElementById('modal-ok');
function abrirModal(titulo,msg){modalTitle.textContent=titulo;modalMsg.textContent=msg;overlay.style.display='flex';}
modalOk.addEventListener('click',()=>overlay.style.display='none');
</script>
</body>
</html>
