{% include 'admin_original.html' %}
<style id="coopex-admin-quick-complete">
  .quick-delivery-actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;min-width:390px!important}
  .quick-delivery-actions .btn{width:100%!important;white-space:nowrap!important}
  .btn-complete-action{height:46px!important;border-radius:14px!important;font-size:.94rem!important;box-shadow:none!important;background:#edf3ff!important;color:#173f9f!important;border:1px solid #cbd9f6!important}
  body.dark .btn-complete-action{background:#162846!important;color:#edf3ff!important;border-color:#334b75!important}
  @media(max-width:780px){.quick-delivery-actions{min-width:0!important;width:100%!important;grid-template-columns:1fr 1fr!important}}
  @media(max-width:480px){.quick-delivery-actions{grid-template-columns:1fr!important}}
</style>
<script id="coopex-admin-quick-complete-script">
(function(){
  function aplicar(){
    const links=[...document.querySelectorAll('.bank-submenu a')];
    const quick=links.find(a=>(a.textContent||'').trim().toLowerCase()==='nova entrega');
    if(quick){
      quick.href="{{ url_for('cadastrar_entrega') }}";
      quick.innerHTML='<span class="btn-ico">⚡</span>Entrega rápida';
      if(!document.getElementById('adminEntregaCompletaLink')){
        const full=document.createElement('a');
        full.id='adminEntregaCompletaLink';
        full.href="{{ url_for('cadastrar_entrega', modo='completo') }}";
        full.innerHTML='<span class="btn-ico">📋</span>Entrega completa';
        quick.insertAdjacentElement('afterend',full);
      }
    }

    links.filter(a=>(a.textContent||'').toLowerCase().includes('histórico de trajetos')).forEach(a=>a.remove());

    const primary=[...document.querySelectorAll('.quick-left .btn')].find(b=>(b.textContent||'').toLowerCase().includes('nova entrega'));
    if(primary){
      const holder=primary.closest('.quick-left');
      holder.classList.add('quick-delivery-actions');
      primary.innerHTML='<span class="btn-ico">⚡</span> Entrega rápida';
      primary.onclick=function(){window.__markActionStart&&window.__markActionStart();window.location.href="{{ url_for('cadastrar_entrega') }}"};
      if(!document.getElementById('btnEntregaCompletaAdmin')){
        const fullBtn=document.createElement('button');
        fullBtn.id='btnEntregaCompletaAdmin';
        fullBtn.className='btn alt btn-complete-action';
        fullBtn.type='button';
        fullBtn.innerHTML='<span class="btn-ico">📋</span> Entrega completa';
        fullBtn.onclick=function(){window.__markActionStart&&window.__markActionStart();window.location.href="{{ url_for('cadastrar_entrega', modo='completo') }}"};
        holder.appendChild(fullBtn);
      }
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',aplicar,{once:true});else aplicar();
})();
</script>
