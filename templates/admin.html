<script id="coopex-admin-schedule-script">
(function(){
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  let todos=[];
  let escala={carregada:false,restrita:false,idsBase:new Set()};
  let cliqueContexto=null;

  function filaAtual(){
    return [...document.querySelectorAll('#espera-lista .espera-chip[data-cooperado-id]')].map((chip,indice)=>({id:String(chip.dataset.cooperadoId||''),nome:String(chip.dataset.cooperadoNome||chip.querySelector('.espera-chip-text')?.textContent||'').trim(),pos:indice+1})).filter(x=>x.id);
  }

  function aplicarMenu(){
    const links=[...document.querySelectorAll('.bank-submenu a')];
    const quick=links.find(a=>(a.textContent||'').trim().toLowerCase()==='nova entrega'||(a.textContent||'').toLowerCase().includes('entrega rápida'));
    if(quick){
      quick.href="{{ url_for('cadastrar_entrega') }}";quick.innerHTML='<span class="btn-ico">⚡</span>Entrega rápida';
      if(!document.getElementById('adminEntregaCompletaLink')){const full=document.createElement('a');full.id='adminEntregaCompletaLink';full.href="{{ url_for('cadastrar_entrega', modo='completo') }}";full.innerHTML='<span class="btn-ico">📋</span>Entrega completa';quick.insertAdjacentElement('afterend',full)}
      if(!document.getElementById('adminEscalaLink')){const item=document.createElement('a');item.id='adminEscalaLink';item.href="{{ url_for('escala') }}";item.innerHTML='<span class="btn-ico">🗓</span>Escala semanal';(document.getElementById('adminEntregaCompletaLink')||quick).insertAdjacentElement('afterend',item)}
    }
    links.filter(a=>(a.textContent||'').toLowerCase().includes('histórico de trajetos')).forEach(a=>a.remove());
    const primary=[...document.querySelectorAll('.quick-left .btn')].find(b=>(b.textContent||'').toLowerCase().includes('nova entrega')||(b.textContent||'').toLowerCase().includes('entrega rápida'));
    if(primary){
      const holder=primary.closest('.quick-left');holder.classList.add('quick-delivery-actions');primary.innerHTML='<span class="btn-ico">⚡</span> Entrega rápida';primary.onclick=()=>location.href="{{ url_for('cadastrar_entrega') }}";
      if(!document.getElementById('btnEntregaCompletaAdmin')){const b=document.createElement('button');b.id='btnEntregaCompletaAdmin';b.className='btn alt btn-complete-action';b.type='button';b.innerHTML='<span class="btn-ico">📋</span> Entrega completa';b.onclick=()=>location.href="{{ url_for('cadastrar_entrega', modo='completo') }}";holder.appendChild(b)}
      if(!document.getElementById('btnEscalaAdmin')){const b=document.createElement('button');b.id='btnEscalaAdmin';b.className='btn alt btn-scale-action';b.type='button';b.innerHTML='<span class="btn-ico">🗓</span> Escala semanal';b.onclick=()=>location.href="{{ url_for('escala') }}";holder.appendChild(b)}
    }
  }

  function sincronizarTema(){
    const salvo=localStorage.getItem('coopex_theme');if(salvo==='dark')document.body.classList.add('dark');if(salvo==='light')document.body.classList.remove('dark');new MutationObserver(()=>localStorage.setItem('coopex_theme',document.body.classList.contains('dark')?'dark':'light')).observe(document.body,{attributes:true,attributeFilter:['class']});
  }

  async function carregarEscala(){
    try{
      if(!todos.length)todos=(window.COOPERADOS||[]).map(x=>({...x}));
      const r=await fetch('{{ url_for("api_escala_agora") }}',{headers:{Accept:'application/json','X-Requested-With':'fetch'},cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)return;
      const itensBase=(d.itens||[]).filter(x=>norm(x.contrato)==='base');escala.carregada=true;escala.restrita=!!d.restricao_ativa;escala.idsBase=new Set(itensBase.map(x=>String(x.cooperado_id)));
      if(escala.restrita){const idsFila=new Set(filaAtual().map(x=>x.id));const permitidos=new Set([...escala.idsBase,...idsFila]);window.COOPERADOS=todos.filter(c=>permitidos.has(String(c.id))).map(c=>({...c,rotulo:c.nome}))}else window.COOPERADOS=todos.map(c=>({...c}));
      document.querySelectorAll('.coop-edit-select').forEach(prepararSelect);
    }catch(e){}
  }

  async function carregarAgendamentos(){
    try{
      const ids=[...document.querySelectorAll('tr[data-id]')].map(tr=>tr.dataset.id).filter(Boolean).join(',');
      const url='{{ url_for("api_admin_agendamentos") }}'+(ids?`?ids=${encodeURIComponent(ids)}`:'');
      const r=await fetch(url,{headers:{Accept:'application/json','X-Requested-With':'fetch'},cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)return;
      (d.itens||[]).forEach(item=>{
        const tr=document.querySelector(`tr[data-id="${item.id}"]`);if(!tr||tr.cells.length<7)return;
        const pedido=tr.cells[5],atribuicao=tr.cells[6];
        pedido.innerHTML=`<span class="scheduled-clock" title="Entrega agendada para ${item.agendada_data} às ${item.agendada_hora}">🕒 ${item.agendada_hora}</span>`;
        if(item.atribuida_depois){atribuicao.innerHTML=`<span class="scheduled-clock actual" title="Cooperado atribuído depois do horário agendado">${item.atribuicao_hora}</span>`}
        else{const titulo=item.tem_cooperado?'Cooperado atribuído antes do horário; exibindo a hora agendada':'Aguardando atribuição; exibindo a hora agendada';atribuicao.innerHTML=`<span class="scheduled-clock" title="${titulo}">🕒 ${item.atribuicao_hora}</span>`}
      });
    }catch(e){}
  }

  function escolherForaEscala(){
    const termo=prompt('Digite parte do nome do cooperado:');if(!termo)return null;const q=norm(termo);let encontrados=todos.filter(c=>norm(c.nome).includes(q));if(!encontrados.length){alert('Nenhum cooperado encontrado.');return null}if(encontrados.length===1)return encontrados[0];encontrados=encontrados.slice(0,12);const escolha=prompt('Digite o número do cooperado:\n'+encontrados.map((c,i)=>`${i+1}. ${c.nome}`).join('\n'));const indice=Number(escolha)-1;return indice>=0&&indice<encontrados.length?encontrados[indice]:null;
  }

  function prepararSelect(sel){
    if(!sel||sel.dataset.filaBasePreparada==='1'||!escala.restrita)return;sel.dataset.filaBasePreparada='1';
    const atual=String(cliqueContexto?.atual||sel.value||'');const fila=filaAtual();const idsFila=new Set(fila.map(x=>x.id));const atualCoop=todos.find(c=>String(c.id)===atual)||null;
    sel.innerHTML='<option value="">Sem cooperado</option>';
    fila.forEach(item=>{const o=document.createElement('option');o.value=item.id;o.textContent=`${item.pos}º da fila — ${item.nome}`;sel.appendChild(o)});
    todos.filter(c=>escala.idsBase.has(String(c.id))&&!idsFila.has(String(c.id))).forEach(c=>{const o=document.createElement('option');o.value=String(c.id);o.textContent=c.nome;sel.appendChild(o)});
    if(atual&&atualCoop&&![...sel.options].some(o=>String(o.value)===atual)){const o=document.createElement('option');o.value=atual;o.textContent=atualCoop.nome;sel.appendChild(o)}
    const manual=document.createElement('option');manual.value='__fora_escala__';manual.textContent='Digitar outro cooperado';sel.appendChild(manual);
    sel.value=atual&&[...sel.options].some(o=>String(o.value)===atual)?atual:'';sel.title='Sem cooperado aparece primeiro. Depois vêm todos da fila e os escalados na BASE.';
  }

  document.addEventListener('click',e=>{const alvo=e.target.closest?.('.coop-editable');if(alvo)cliqueContexto={atual:String(alvo.dataset.cooperadoId||'')};},true);
  document.addEventListener('change',e=>{const sel=e.target.closest?.('.coop-edit-select');if(!sel||sel.value!=='__fora_escala__')return;e.preventDefault();e.stopImmediatePropagation();const escolhido=escolherForaEscala();if(!escolhido){sel.value='';return}if(!(window.COOPERADOS||[]).some(c=>String(c.id)===String(escolhido.id)))window.COOPERADOS.push({...escolhido,rotulo:escolhido.nome});let opt=[...sel.options].find(o=>String(o.value)===String(escolhido.id));if(!opt){opt=document.createElement('option');opt.value=String(escolhido.id);opt.textContent=escolhido.nome;sel.insertBefore(opt,sel.options[sel.options.length-1])}sel.value=String(escolhido.id);setTimeout(()=>sel.dispatchEvent(new Event('change',{bubbles:true})),0)},true);
  new MutationObserver(muts=>muts.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.matches?.('.coop-edit-select'))prepararSelect(n);n.querySelectorAll?.('.coop-edit-select').forEach(prepararSelect)}))).observe(document.documentElement,{childList:true,subtree:true});

  function iniciar(){sincronizarTema();aplicarMenu();todos=(window.COOPERADOS||[]).map(x=>({...x}));carregarEscala();carregarAgendamentos();setInterval(()=>{carregarEscala();carregarAgendamentos()},60000)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar,{once:true});else iniciar();
})();
</script>

  #supervisao-live-indicator{position:fixed;right:14px;bottom:14px;z-index:9998;display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #cdd9f2;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 8px 28px rgba(18,54,125,.14);font:800 11px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#173f9f;user-select:none;backdrop-filter:blur(8px)}

  #supervisao-live-indicator.wait .dot{background:#e69a16;box-shadow:0 0 0 3px rgba(230,154,22,.14)}
  #supervisao-live-indicator.off .dot{background:#d64545;box-shadow:0 0 0 3px rgba(214,69,69,.14)}
  body.dark #supervisao-live-indicator{background:rgba(10,23,45,.96);border-color:#334b75;color:#dce8ff}
</style>
<script id="supervisao-live-sync">
(function(){
  const URL_LIVE='{{ url_for("api_admin_live_state") }}';
  const INTERVALO=2000;
  const SCROLL_KEY='supervisao_live_scroll_y';
  let assinatura=null;
  let verificando=false;
  let atualizacaoPendente=false;
  let timer=null;

  function indicador(){
    let el=document.getElementById('supervisao-live-indicator');
    if(!el){
      el=document.createElement('div');
      el.id='supervisao-live-indicator';
      el.innerHTML='<span class="dot"></span><span class="txt">AO VIVO</span>';
      document.body.appendChild(el);
    }
    return el;
  }
  function status(tipo,texto){
    const el=indicador();
    el.classList.toggle('wait',tipo==='wait');
    el.classList.toggle('off',tipo==='off');
    const txt=el.querySelector('.txt'); if(txt) txt.textContent=texto;
  }
  function usuarioEditando(){
    const a=document.activeElement;
    if(a && (a.matches?.('input,textarea,select,[contenteditable="true"]'))) return true;
    if(document.querySelector('.modal.open,.modal.show,[role="dialog"].open,[role="dialog"][aria-hidden="false"],.value-requests-overlay.open')) return true;
    if(document.body.classList.contains('locked')) return true;
    return false;
  }
  function restaurarScroll(){
    const y=Number(sessionStorage.getItem(SCROLL_KEY)||'');
    if(Number.isFinite(y) && y>0){
      sessionStorage.removeItem(SCROLL_KEY);
      requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:'auto'}));
    }
  }
  function atualizarTela(){
    if(usuarioEditando()){
      atualizacaoPendente=true;
      status('wait','NOVA ATUALIZAÇÃO');
      return;
    }
    atualizacaoPendente=false;
    sessionStorage.setItem(SCROLL_KEY,String(Math.max(0,window.scrollY||0)));
    status('wait','ATUALIZANDO');
    window.location.reload();
  }
  async function verificar(){
    if(verificando || document.visibilityState==='hidden') return;
    verificando=true;
    try{
      const r=await fetch(URL_LIVE,{cache:'no-store',credentials:'same-origin',headers:{Accept:'application/json','X-Requested-With':'fetch'}});
      if(!r.ok) throw new Error('live-state '+r.status);
      const d=await r.json();
      if(!d.ok || !d.assinatura) throw new Error('live-state inválido');
      status('ok','AO VIVO');
      if(assinatura===null){assinatura=d.assinatura;return;}
      if(d.assinatura!==assinatura){assinatura=d.assinatura;atualizarTela();}
      else if(atualizacaoPendente && !usuarioEditando()) atualizarTela();
    }catch(e){
      status('off','SEM CONEXÃO');
    }finally{verificando=false;}
  }
  function iniciar(){
    restaurarScroll();
    indicador();
    verificar();
    timer=setInterval(verificar,INTERVALO);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')verificar();});
    document.addEventListener('focusout',()=>{if(atualizacaoPendente)setTimeout(verificar,180);},true);
    window.addEventListener('online',()=>setTimeout(verificar,100));
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar,{once:true});else iniciar();
})();
</script>

<script id="cx-history-lazy-open-20261010">
(function(){
  var key='coopex_history_requested';
  // Somente ao clicar na aba carregamos registros antigos do banco.
  document.addEventListener('click',function(e){
    var tab=e.target.closest('.value-request-tab[data-value-tab="historico"]');
    if(!tab)return;
    if(new URLSearchParams(location.search).get('solicitacoes_historico')==='1')return;
    e.preventDefault();e.stopImmediatePropagation();
    sessionStorage.setItem(key,'1');
    var u=new URL(location.href);
    u.searchParams.set('solicitacoes_historico','1');
    location.assign(u.toString());
  },true);
  function boot(){
    if(new URLSearchParams(location.search).get('solicitacoes_historico')!=='1')return;
    var overlay=document.getElementById('valueRequestsOverlay');
    if(!overlay)return;
    document.querySelectorAll('.value-request-tab').forEach(function(el){el.classList.toggle('active',el.dataset.valueTab==='historico')});
    document.querySelectorAll('.value-request-panel').forEach(function(el){
      var on=el.dataset.valuePanel==='historico';el.classList.toggle('active',on);el.hidden=!on;
    });
    overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
    sessionStorage.removeItem(key);
    // Retirar marcador da barra de endereco; proximos acessos voltam a ser rapidos.
    var u=new URL(location.href);u.searchParams.delete('solicitacoes_historico');
    history.replaceState(history.state,'',u.pathname+u.search+u.hash);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

<script id="cx-admin-responsive-actions-20261010">
(function(){
const query=window.matchMedia('(max-width:1199px)');
function reorganize(){
  const left=document.querySelector('.filters-top .quick-left');
  const actions=document.querySelector('.filters-actions');
  if(!left||!actions)return;
  const quick=document.querySelector('.quick-left .btn-primary-action, .filters-actions .btn-primary-action');
  const complete=document.getElementById('btnEntregaCompletaAdmin');
  const escala=document.getElementById('btnEscalaAdmin');
  // Aguarda o script legado criar botoes de entrega completa e escala.
  if(!quick || !complete || !escala)return;
  const all=[quick,complete,escala];
  if(query.matches){for(let i=all.length-1;i>=0;i--)actions.insertBefore(all[i],actions.firstChild)}
  else all.forEach(el=>{if(el.parentElement!==left)left.appendChild(el)});
}
function start(){reorganize();query.addEventListener('change',reorganize);const left=document.querySelector('.quick-left');if(left){new MutationObserver(()=>{if(!document.getElementById('btnEscalaAdmin'))return;reorganize()}).observe(left,{childList:true})}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>

<script id="cx-pix-sicoob-inline">
(function(){
let csrfPromise=null;
const token=()=>csrfPromise||(csrfPromise=fetch('/admin/pix-sicoob/csrf',{credentials:'same-origin'}).then(async r=>{if(!r.ok)throw Error('Acesso restrito ao administrador master.');return (await r.json()).csrf}));
async function create(url,body){
const csrf=await token();
const res=await fetch(url,{method:'POST',credentials:'same-origin',
headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body||{})});
const data=await res.json().catch(()=>({}));
if(!res.ok)throw Error(data.erro||'Erro de comunicação com a API Pix');
return data;
}
async function copy(code){
if(!code || !String(code).startsWith('000201'))throw Error('A cobrança não tem código Pix Copia e Cola válido. Consulte o banco antes de pagar.');
try{if(!document.hasFocus())throw Error('sem foco');await navigator.clipboard.writeText(code);return true}catch(err){
const modal=document.createElement('div');modal.style.cssText='position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:15px';
const box=document.createElement('section');box.style.cssText='background:#fff;color:#17294d;border-radius:14px;padding:20px;max-width:700px;width:100%;box-sizing:border-box';
const title=document.createElement('h3');title.textContent='Pix Copia e Cola — selecione e copie o código';
const area=document.createElement('textarea');area.value=code;area.readOnly=true;area.style.cssText='width:100%;height:125px;box-sizing:border-box;overflow-wrap:anywhere';
const btn=document.createElement('button');btn.type='button';btn.textContent='Selecionar código';btn.onclick=()=>{area.focus();area.select();try{document.execCommand('copy')}catch(e){}};
const close=document.createElement('button');close.type='button';close.textContent='Fechar';close.onclick=()=>modal.remove();box.append(title,area,btn,close);modal.append(box);document.body.append(modal);area.focus();area.select();return false;
}
}
async function watchPix(kind,id,btn){
const url=kind==='avulso'?'/admin/pix-sicoob/avulso/'+encodeURIComponent(id)+'/verificar':'/admin/pix-sicoob/verificar/'+encodeURIComponent(id);
for(let n=0;n<36;n++){
await new Promise(resolve=>setTimeout(resolve,5000));
if(!document.body.contains(btn))return;
try{const result=await create(url);if(result.status==='PAGO'){
btn.textContent='Pago ✓';btn.disabled=true;btn.dataset.pixPago='1';btn.title='Pagamento confirmado pelo Sicoob';return;
}}catch(err){}
}
}
async function copyDelivery(btn){
btn.disabled=true;const before=btn.textContent;btn.textContent='Aguarde...';
try{const result=await create('/admin/pix-sicoob/cobrar/'+btn.dataset.entregaId);await copy(result.brcode);btn.textContent='Pix pendente';watchPix('entrega',btn.dataset.entregaId,btn);}
catch(err){alert(err.message);btn.textContent=before;}finally{setTimeout(()=>{if(btn.dataset.pixPago!=='1'){btn.disabled=false;btn.textContent=before}},1700)}
}
function attach(){
document.querySelectorAll('.cx-forma-pagamento[data-entrega-id]').forEach(el=>{
const pix=/^pix\s*(?:\(\s*cooperativa\s*\)|cooperativa|da cooperativa)$/i.test((el.dataset.forma||'').trim());
let btn=el.parentElement.querySelector('.cx-pix-copy');
if(!pix){if(btn)btn.remove();return}
if(btn)return;
btn=document.createElement('button');btn.type='button';btn.className='cx-pix-copy';
btn.dataset.entregaId=el.dataset.entregaId;btn.textContent='Copiar Pix';btn.title='Copiar Pix Cooperativa com valor desta entrega';
btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();copyDelivery(btn)});
el.insertAdjacentElement('afterend',btn);
});
}
function avulso(){
if(document.getElementById('cx-pix-avulso'))return;
const root=document.querySelector('.quick-view-bar')||document.querySelector('#tbl');
if(!root)return;
const host=document.createElement('div');
host.id='cx-pix-avulso';host.className='cx-pix-advance';
const label=document.createElement('strong');label.textContent='Pix antecipado';
const input=document.createElement('input');input.type='text';input.inputMode='decimal';input.placeholder='Valor R$ 0,00';input.setAttribute('aria-label','Valor avulso em reais');
const btn=document.createElement('button');btn.className='cx-pix-copy';btn.type='button';btn.textContent='Copiar Pix';
const cliente=document.createElement('input');cliente.placeholder='Nome do cliente';cliente.maxLength=160;cliente.setAttribute('aria-label','Nome do cliente Pix antecipado');cliente.style.width='170px';
const hint=document.createElement('span');hint.textContent='Para cliente que paga antes de lançar a entrega';
const historicoBtn=document.createElement('button');historicoBtn.type='button';historicoBtn.className='cx-pix-copy';historicoBtn.textContent='Histórico Pix';
host.append(label,cliente,input,btn,historicoBtn,hint);root.parentElement.insertBefore(host,root);
historicoBtn.onclick=()=>window.open('/admin/pix-sicoob/historico','_blank','noopener');
btn.addEventListener('click',async()=>{
const raw=input.value.trim();if(!cliente.value.trim()){alert('Informe o nome do cliente');return}if(!/^\d{1,6}(?:[,.]\d{1,2})?$/.test(raw)){alert('Digite o valor, exemplo: 25,00');return}
btn.disabled=true;btn.textContent='Aguarde...';
try{let data=await create('/admin/pix-sicoob/avulso',{valor:raw.replace(',','.'),cliente_nome:cliente.value.trim()});await copy(data.brcode);btn.textContent='Pix pendente';hint.textContent='Cobrança avulsa gerada · '+data.id+' · Pendente';watchPix('avulso',data.id,btn);}
catch(e){alert(e.message);btn.textContent='Copiar Pix'}finally{btn.disabled=false;}
});
}
document.addEventListener('DOMContentLoaded',()=>{attach();avulso();const observer=new MutationObserver(()=>{attach();avulso()});observer.observe(document.body,{childList:true,subtree:true});});
})();
</script>

<script id="coopex-pix-credit-sale-alert">
(function(){
const url='/api/admin/pix-creditos/novas-vendas';
let known=new Set(),ready=false,context=null,unlocked=false;
const storageKey='coopex-credit-sales-notified';
function loadSeen(){try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch(e){return []}}
function saveSeen(id){try{const a=loadSeen();if(!a.includes(id))localStorage.setItem(storageKey,JSON.stringify([...a,id].slice(-80)))}catch(e){}}
function enableSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;context=context||new C();context.resume().then(()=>unlocked=context.state==='running').catch(()=>{})}catch(e){}}
document.addEventListener('click',enableSound,{passive:true});document.addEventListener('keydown',enableSound,{passive:true});
function beep(){if(!unlocked||!context)return;try{let now=context.currentTime;for(let n=0;n<2;n++){let o=context.createOscillator(),g=context.createGain();o.type='sine';o.frequency.value=n?1050:880;g.gain.setValueAtTime(0.0001,now+n*.2);g.gain.exponentialRampToValueAtTime(.15,now+n*.2+.015);g.gain.exponentialRampToValueAtTime(.0001,now+n*.2+.18);o.connect(g);g.connect(context.destination);o.start(now+n*.2);o.stop(now+n*.2+.19)}}catch(e){}}
function notify(v){let id=String(v.solicitacao_id);saveSeen(id);beep();const box=document.createElement('div');box.style.cssText='position:fixed;z-index:1000000;top:10px;left:50%;transform:translateX(-50%);max-width:700px;width:calc(100% - 32px);padding:16px 22px;text-align:center;border-radius:12px;color:white;background:#159d50;box-shadow:0 6px 26px #0005;font:bold 17px system-ui;pointer-events:none';box.textContent='Você vendeu um novo crédito! '+(v.cliente_nome||'Cliente')+' · '+Number(v.valor).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});document.body.append(box);setTimeout(()=>box.remove(),2000)}
async function refresh(){try{const response=await fetch(url,{cache:'no-store',credentials:'same-origin'});if(!response.ok)return;const rows=(await response.json()).vendas||[];const stored=new Set(loadSeen());if(!ready){rows.forEach(v=>known.add(String(v.solicitacao_id)));ready=true;return}for(const v of rows.slice().reverse()){const id=String(v.solicitacao_id);if(!known.has(id)&&!stored.has(id))notify(v);known.add(id)}}catch(e){}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{refresh();setInterval(refresh,5000)});else{refresh();setInterval(refresh,5000)}
})();
</script>

<script id="cx-pix-led-script">
(function(){
let pix=[],fila=[],paidKnown=null,lastText='',audioContext=null,enabledSound=false,lastMode='',exitAlert=null,exitTimer=null,entryAlert=[],entryTimer=null,entryUntil=0;
const parse=v=>{if(!v)return NaN;const s=String(v).replace(' ','T');return Date.parse(s+(s.endsWith('Z')||/[+-]\\d\\d:\\d\\d$/.test(s)?'':'Z'))};
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const countdown=ms=>{if(ms<=0)return 'VENCIDO';const m=Math.ceil(ms/60000);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')+'m'};
async function unlockSound(){
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return false;
  audioContext=audioContext||new C();
  if(audioContext.state==='suspended')await audioContext.resume();
  enabledSound=audioContext.state==='running';
  window.dispatchEvent(new CustomEvent('coopex-led-audio-state',{detail:{enabled:enabledSound}}));
  return enabledSound;
 }catch(e){enabledSound=false;return false}
}
window.__coopexLedUnlockAudio=unlockSound;
document.addEventListener('pointerdown',unlockSound,{once:true});
document.addEventListener('keydown',unlockSound,{once:true});
function cashSound(){if(!enabledSound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioContext=audioContext||new C();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime;[880,1320,1760,2093].forEach((hz,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(hz,now+i*.085);g.gain.setValueAtTime(.0001,now+i*.085);g.gain.exponentialRampToValueAtTime(.11,now+i*.085+.018);g.gain.exponentialRampToValueAtTime(.0001,now+i*.085+.14);o.connect(g);g.connect(audioContext.destination);o.start(now+i*.085);o.stop(now+i*.085+.15)})}catch(e){}}
function paidToast(x){cashSound();const div=document.createElement('div');div.style.cssText='position:fixed;top:18px;right:18px;z-index:999999;max-width:430px;background:#063e22;border:2px solid #40ef82;box-shadow:0 7px 30px #0008;border-radius:12px;padding:16px 20px;color:#d7ffea;font:700 15px system-ui';div.textContent='💵 PIX RECEBIDO · '+(x.cliente_nome||'Cliente')+' · '+money(x.valor);document.body.appendChild(div);setTimeout(()=>div.remove(),6500)}
async function paidRefresh(){try{const r=await fetch('/admin/pix-sicoob/historico/dados',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;const all=(await r.json()).cobrancas||[];const good=all.filter(x=>x.status==='PAGO'||x.status==='APROVADO');const ids=new Set(good.map(x=>x.tipo+':'+x.uid+':'+x.status));if(paidKnown!==null){for(const x of good){const key=x.tipo+':'+x.uid+':'+x.status;if(!paidKnown.has(key))paidToast(x)}}paidKnown=ids}catch(e){}}
function draw(){
 const led=document.getElementById('cx-pix-led');if(!led)return;
 const now=Date.now();
 const exiting=exitAlert&&now<exitAlert.until;
 const entering=entryAlert.length>0&&now<entryUntil;
 if(exitAlert&&!exiting)exitAlert=null;
 if(entryAlert.length&&!entering)entryAlert=[];
 const warnings=pix.map(x=>({...x,ms:parse(x.expira_em)-now})).filter(x=>Number.isFinite(x.ms)&&x.ms<=3600000).sort((a,b)=>a.ms-b.ms);
 const mode=exiting?'saida':(entering?'entrada':(warnings.length?'alert':'fila'));
 const messages=exiting?['SAÍDA DA FILA · '+exitAlert.nome+' · '+exitAlert.hora+' · MOTIVO: '+exitAlert.motivo]:entering?['ENTRADA: '+entryAlert.map(x=>x.nome+' '+x.hora).join(' · ')]:warnings.length?warnings.map(x=>(x.tipo==='Entrega'?'ENTREGA #'+x.id:'AVULSO')+' · '+(x.nome||'Cliente')+' · '+countdown(x.ms)+' · '+(x.ms<=0?'VENCIDO':x.ms<=900000?'ALERTA 15 MIN':x.ms<=1800000?'ALERTA 30 MIN':'ATENÇÃO 1 HORA')):fila.map((x,i)=>String(x.pos||i+1)+'º '+x.nome);
 const result=messages.join('     ✦     ')||(warnings.length?'AVISO PIX':'SEM COOPERADOS NA FILA');
 if(result!==lastText||mode!==lastMode){
  lastText=result;lastMode=mode;
  led.querySelector('.cx-led-inner').textContent='  ✦  '+result+'  ✦  ';
  led.classList.toggle('cx-led-blue',mode==='fila');
  led.classList.toggle('cx-led-exit',mode==='saida');
  led.classList.toggle('cx-led-entry',mode==='entrada');
  led.querySelector('.cx-led-inner').style.animationDuration=(exiting||entering)?'13s':'32s';
 }
 led.querySelector('.cx-led-count').textContent=exiting?'SAÍDA':entering?'ENTRADA':('PIX '+pix.length);
}
function queueExitSound(){
 if(!enabledSound||!audioContext)return;
 try{
  if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
  const now=audioContext.currentTime;
  [[0,850],[.15,1050],[.3,850]].forEach(([offset,freq])=>{
   const osc=audioContext.createOscillator(),gain=audioContext.createGain();
   osc.type='sine';osc.frequency.value=freq;
   gain.gain.setValueAtTime(.0001,now+offset);
   gain.gain.exponentialRampToValueAtTime(.21,now+offset+.017);
   gain.gain.exponentialRampToValueAtTime(.0001,now+offset+.125);
   osc.connect(gain);gain.connect(audioContext.destination);
   osc.start(now+offset);osc.stop(now+offset+.13);
  });
 }catch(e){}
}
function queueEntrySound(){
 if(!enabledSound||!audioContext)return;
 try{
  if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
  const now=audioContext.currentTime;
  [[0,920],[.19,1180],[.38,1480]].forEach(([offset,freq])=>{
   const osc=audioContext.createOscillator(),gain=audioContext.createGain();
   osc.type='square';osc.frequency.value=freq;
   gain.gain.setValueAtTime(.0001,now+offset);
   gain.gain.exponentialRampToValueAtTime(.34,now+offset+.018);
   gain.gain.exponentialRampToValueAtTime(.0001,now+offset+.19);
   osc.connect(gain);gain.connect(audioContext.destination);
   osc.start(now+offset);osc.stop(now+offset+.20);
  });
 }catch(e){}
}
function queueClock(value){
 const d=value?new Date(value):new Date();
 return (Number.isFinite(d.getTime())?d:new Date()).toLocaleTimeString('pt-BR',{timeZone:'America/Fortaleza',hour:'2-digit',minute:'2-digit'});
}
function showQueueEntry(data){
 if(!data||!data.nome)return;
 const item={id:String(data.cooperado_id||''),nome:String(data.nome),hora:queueClock(data.quando)};
 if(entryAlert.some(x=>x.id===item.id&&x.hora===item.hora))return;
 entryAlert.push(item);
 if(entryAlert.length>25)entryAlert.shift();
 entryUntil=Date.now()+15000;
 if(entryTimer)clearTimeout(entryTimer);
 window.dispatchEvent(new CustomEvent('coopex-led-entry',{detail:{...data,hora:item.hora}}));
 queueEntrySound();
 draw();
 entryTimer=setTimeout(()=>{entryAlert=[];entryUntil=0;draw();entryTimer=null},15000);
}
function showQueueExit(data){
 if(!data||!data.nome||!data.motivo)return;
 const hora=queueClock(data.quando);
 exitAlert={nome:String(data.nome),motivo:String(data.motivo),hora,until:Date.now()+15000};
 if(exitTimer)clearTimeout(exitTimer);
 window.dispatchEvent(new CustomEvent('coopex-led-exit',{detail:{...data,hora}}));
 queueExitSound();
 draw();
 exitTimer=setTimeout(()=>{exitAlert=null;draw();exitTimer=null},15000);
}
function connectQueueExitSocket(){
 if(window.__coopexLedSocketConnected)return;
 // Socket.IO pode carregar depois do script do painel; faça novas tentativas curtas.
 if(typeof io!=='function'){
  if(!window.__coopexLedSocketRetries)window.__coopexLedSocketRetries=0;
  if(window.__coopexLedSocketRetries++<50)setTimeout(connectQueueExitSocket,250);
  return;
 }
 window.__coopexLedSocketConnected=true;
 const socket=io({transports:['websocket','polling'],reconnection:true,reconnectionDelay:1000,reconnectionDelayMax:10000});
 window.__coopexLedSocket=socket;
 socket.on('coopex_fila_saida_alerta',showQueueExit);
 socket.on('coopex_fila_entrada_alerta',showQueueEntry);
 socket.on('coopex_supervisao_recado_atualizado',()=>window.dispatchEvent(new Event('coopex-led-note-changed')));
 // Atualiza a fila imediatamente quando o servidor grava ou altera a ordem.
 socket.on('fila_espera_atualizada',data=>{
  if(!data||!Array.isArray(data.itens))return;
  fila=data.itens.map((item,i)=>({nome:String(item.nome||'Cooperado'),pos:Number(item.pos||i+1)}));
  window.dispatchEvent(new CustomEvent('coopex-led-fila',{detail:fila}));
  draw();
 });
 socket.on('connect',()=>{refreshQueue();window.dispatchEvent(new Event('coopex-led-socket-ready'))});
 socket.on('connect_error',err=>console.warn('LED realtime: aguardando conexão',err&&err.message));
}

async function refreshQueue(){try{const r=await fetch('/api/admin/pix-led-fila',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;fila=(await r.json()).cooperados||[];window.dispatchEvent(new CustomEvent('coopex-led-fila',{detail:fila}));draw()}catch(e){console.warn('Fila LED: sincronização na conexão indisponível',e)}}
async function refreshPix(){try{const r=await fetch('/admin/pix-sicoob/avisos',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;pix=(await r.json()).cobrancas||[];window.dispatchEvent(new CustomEvent('coopex-led-pix',{detail:pix}));draw()}catch(e){}}
function refresh(){refreshQueue();refreshPix()}
function init(){const host=document.getElementById('cx-pix-avulso');if(!host){setTimeout(init,1000);return}if(document.getElementById('cx-pix-led'))return;const led=document.createElement('span');led.id='cx-pix-led';led.title='Fila de cooperados e alertas de vencimento Pix. Clique para ver o histórico.';led.innerHTML='<span class="cx-led-count">PIX 0</span><span class="cx-led-inner">CONSULTANDO...</span>';led.onclick=()=>window.open('/admin/pix-sicoob/historico','_blank','noopener');host.appendChild(led);connectQueueExitSocket();refresh();paidRefresh();setInterval(refreshPix,30000);setInterval(draw,10000);setInterval(paidRefresh,30000)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<!-- COOPEX: aviso temporario de ultima saida (15 segundos) -->
<script id="coopex-ultima-saida-timeout">
(function(){
  'use strict';
  const DURACAO=15000;
  const expiracoes=new Map();
  const temporizadores=new WeakMap();
  let verificacaoPendente=false;

  function candidatos(){
    const raiz=document.querySelector('#espera-lista')?.parentElement?.parentElement || document;
    return [...raiz.querySelectorAll('div,aside,section,li,p')].filter(el=>{
      if(el.id==='espera-lista' || el.contains(document.getElementById('espera-lista')))return false;
      const texto=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(!/^(?:🔴\s*)?Última saída\s*:/i.test(texto))return false;
      return ![...el.children].some(filho=>['DIV','ASIDE','SECTION','LI','P'].includes(filho.tagName) && /^(?:🔴\s*)?Última saída\s*:/i.test((filho.textContent||'').replace(/\s+/g,' ').trim()));
    });
  }
  function ocultar(el){
    if(!el.isConnected)return;
    el.style.setProperty('display','none','important');
    el.setAttribute('aria-hidden','true');
  }
  function verificar(){
    verificacaoPendente=false;
    const agora=Date.now();
    for(const [chave,ate] of expiracoes){
      if(ate < agora-60000)expiracoes.delete(chave);
    }
    for(const el of candidatos()){
      const chave=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(!chave)continue;
      let ate=expiracoes.get(chave);
      if(!ate){ate=agora+DURACAO;expiracoes.set(chave,ate);}
      if(agora>=ate){ocultar(el);continue;}
      if(temporizadores.has(el))continue;
      const timer=setTimeout(()=>{temporizadores.delete(el);ocultar(el);verificar();},Math.max(0,ate-agora));
      temporizadores.set(el,timer);
    }
  }
  function agendar(){
    if(verificacaoPendente)return;
    verificacaoPendente=true;
    requestAnimationFrame(verificar);
  }
  function iniciar(){
    verificar();
    const alvo=document.querySelector('#espera-lista')?.parentElement?.parentElement || document.body;
    if(alvo)new MutationObserver(agendar).observe(alvo,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar,{once:true});
  else iniciar();
})();
</script>

<script id="coopex-supervisao-gelo-led-script-v5">
(function(){
'use strict';
const endpoint='/api/admin/supervisao/recado';
const get=id=>document.getElementById(id);
let recado=null,entradas=[],saida=null,pix=[],fila=[];
const hora=v=>{const date=new Date(v||Date.now());return Number.isFinite(date.getTime())?date.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Fortaleza'}):''};
function show(){
 const info=[
 ['cx-led-fila','FILA · '+(fila.length?fila.map((f,i)=>(f.pos||i+1)+'º '+f.nome).join('  ·  '):'SEM COOPERADOS NA FILA'),true],
 ['cx-led-recado',recado&&!recado.lido_em?'RECADO · '+recado.mensagem+' · '+recado.autor+' '+hora(recado.criado_em):'',Boolean(recado&&!recado.lido_em)],
 ['cx-led-entrada',entradas.length?'ENTRADA · '+entradas.map(x=>x.nome+' '+x.hora).join(' · '):'',Boolean(entradas.length)],
 ['cx-led-saida',saida?'SAÍDA · '+saida.nome+' · '+saida.hora+' · MOTIVO: '+saida.motivo:'',Boolean(saida)],
 ['cx-led-pix',pix.length?'PIX · '+pix.map(x=>x.nome+' '+x.estado).join(' · '):'',Boolean(pix.length)]
 ];
 for(const [id,text,visible] of info){const el=get(id);if(el){el.hidden=!visible;if(visible)el.textContent=text}}
 const read=get('cx-led-note-read'),del=get('cx-led-note-delete');if(read)read.hidden=!recado||Boolean(recado.lido_em);if(del)del.hidden=!recado;
}
async function fetchNote(){try{const r=await fetch(endpoint,{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;const data=await r.json();recado=data.recado||null;show()}catch(_){}}
async function mutate(method,url,data){const r=await fetch(url,{method,credentials:'same-origin',cache:'no-store',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.erro||'Falha ao salvar');await fetchNote()}
function onEntry(data){if(!data||!data.nome)return;const key=String(data.cooperado_id||'')+'|'+String(data.quando||'');if(entradas.some(x=>x.key===key))return;entradas.push({key,nome:String(data.nome),hora:hora(data.quando)});if(entradas.length>30)entradas.shift();show();clearTimeout(onEntry.timer);onEntry.timer=setTimeout(()=>{entradas=[];show()},15000)}
function onExit(data){if(!data||!data.nome||!data.motivo)return;saida={nome:String(data.nome),motivo:String(data.motivo),hora:String(data.hora||hora(data.quando))};show();clearTimeout(onExit.timer);onExit.timer=setTimeout(()=>{saida=null;show()},15000)}
function onPix(data){const now=Date.now();const parse=v=>{const s=String(v||'').replace(' ','T');return Date.parse(s+(/[Zz]$|[+-]\d\d:\d\d$/.test(s)?'':'Z'))};pix=(data||[]).map(x=>({nome:String(x.nome||'Cliente'),ms:parse(x.expira_em)-now})).filter(x=>Number.isFinite(x.ms)&&x.ms<=3600000).sort((a,b)=>a.ms-b.ms).slice(0,5).map(x=>({nome:x.nome,estado:x.ms<=0?'VENCIDO':Math.max(1,Math.ceil(x.ms/60000))+' MIN'}));show()}
function build(){
 const head=document.querySelector('.panel-head'),actions=head?.querySelector('.cx-head-actions'),host=get('cx-pix-avulso'),old=get('cx-pix-led');if(!head||!actions||!host||!old)return false;if(get('cx-supervisao-board'))return true;
 const board=document.createElement('div');board.id='cx-supervisao-board';
 board.innerHTML='<div class="cx-led-top"><span class="cx-led-title">◈ LED · SUPERVISÃO</span><div class="cx-led-buttons"><button id="cx-led-note-write" type="button">✎ Recado</button><button id="cx-led-note-read" type="button" hidden>✓ Li o aviso</button><button id="cx-led-note-delete" type="button" hidden>Apagar</button></div></div>'+
 '<div class="cx-led-screen" aria-label="Avisos da supervisão"><div class="cx-led-line queue" id="cx-led-fila"></div><div class="cx-led-line note" id="cx-led-recado" hidden></div><div class="cx-led-line entry" id="cx-led-entrada" hidden></div><div class="cx-led-line exit" id="cx-led-saida" hidden></div><div class="cx-led-line pix" id="cx-led-pix" hidden></div></div>';
 head.appendChild(board);
 const shortcuts=document.createElement('div');shortcuts.className='cx-led-shortcuts';const labels=['Agendar entrega','Ocultar ou mostrar atribuídas','Bairros','Mapa','Agenda'];
 [...actions.querySelectorAll('button')].forEach((b,i)=>{b.title=labels[i]||b.textContent.trim();b.setAttribute('aria-label',b.title);shortcuts.appendChild(b)});
 host.appendChild(shortcuts);actions.remove();
 const dialog=document.createElement('dialog');dialog.id='cx-supervisao-note-dialog';dialog.innerHTML='<form method="dialog"><h3>Recado para o próximo supervisor</h3><textarea id="cx-note-editor" maxlength="2000" required placeholder="Escreva o recado do turno..."></textarea><p id="cx-note-error" role="alert"></p><menu><button value="cancel">Cancelar</button><button type="button" id="cx-note-save">Salvar recado</button></menu></form>';document.body.appendChild(dialog);
 get('cx-led-note-write').addEventListener('click',()=>{get('cx-note-editor').value=recado?.mensagem||'';get('cx-note-error').textContent='';dialog.showModal()});
 get('cx-note-save').addEventListener('click',async()=>{const msg=get('cx-note-editor').value.trim();if(!msg){get('cx-note-error').textContent='Digite um recado';return}const b=get('cx-note-save');b.disabled=true;try{await mutate('POST',endpoint,{mensagem:msg});dialog.close()}catch(e){get('cx-note-error').textContent=e.message}finally{b.disabled=false}});
 get('cx-led-note-read').addEventListener('click',async()=>{try{await mutate('POST',endpoint+'/confirmar')}catch(e){alert(e.message)}});
 get('cx-led-note-delete').addEventListener('click',async()=>{if(!confirm('Apagar o recado?'))return;try{await mutate('DELETE',endpoint)}catch(e){alert(e.message)}});

 show();fetchNote();return true;
}
window.addEventListener('coopex-led-entry',e=>onEntry(e.detail));
window.addEventListener('coopex-led-exit',e=>onExit(e.detail));
window.addEventListener('coopex-led-pix',e=>onPix(e.detail));
window.addEventListener('coopex-led-fila',e=>{fila=e.detail||[];show()});
window.addEventListener('coopex-led-note-changed',fetchNote);
function init(){if(!build()){let attempt=0;const timer=setInterval(()=>{attempt++;if(build()||attempt>80)clearInterval(timer)},250)}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>

<script id="coopex-supervisao-financas-behavior-v6">
(function(){
'use strict';
function init(){
 const body=document.body;

 const nav=document.querySelector('.bank-toolbar'),requests=document.getElementById('btnSolicitacoesValorMenu'),heading=document.querySelector('.panel-head .panel-title');
 if(nav&&requests&&heading&&!document.querySelector('.cx-day-inline')){
   const badge=document.createElement('span');badge.className='cx-day-inline';
   const text=document.createElement('span');text.textContent=(heading.childNodes[0]?.textContent||'Entregas de hoje').trim();
   badge.appendChild(text);
   const originalBadge=heading.querySelector('#abertasBadge');
   if(originalBadge)badge.appendChild(originalBadge);
   requests.closest('.bank-group')?.insertAdjacentElement('afterend',badge);
 }
 // Sem necessidade de botão Filtrar: selects/datas aplicam na alteração; texto com debounce.
 const form=document.querySelector('.filters-form');
 if(form&&!form.dataset.cxAuto){
  form.dataset.cxAuto='1';let timer=null;
  const dates=()=>[form.querySelector('#data_inicio'),form.querySelector('#data_fim')];
  const ready=()=>{const [a,b]=dates();return Boolean(a?.value&&b?.value&&a.value<=b.value)};
  const apply=()=>{
   if(!document.body.contains(form)||!ready())return;
   window.__markActionStart&&window.__markActionStart();
   form.requestSubmit();
  };
  form.querySelectorAll('select,input[type="date"]').forEach(el=>el.addEventListener('change',()=>{clearTimeout(timer);apply()}));
  form.querySelectorAll('input[type="text"],input[type="search"]').forEach(el=>el.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(apply,750)}));
  form.addEventListener('submit',e=>{if(!ready()){e.preventDefault();e.stopImmediatePropagation();const [a,b]=dates();(a&&!a.value?a:b)?.focus();}},true);
 }
 // Garante atualização de luminosidade mesmo quando o DOM do menu for reconstruído.
 const slider=document.getElementById('cx-brightness');
 // Fica permanentemente visível junto ao menu, mesmo com os KPIs compactados.
 if(slider&&nav){
   const bar=slider.closest('.cx-brightness-control');
   const group=requests?.closest('.bank-group');
   if(bar&&group&&bar.previousElementSibling!==group)group.insertAdjacentElement('afterend',bar);
   else if(bar&&!bar.isConnected)nav.appendChild(bar);
 }

 // Não converter LED em cartões: uma única área LED; texto comprido passa no próprio visor.

 if(led&&!led.dataset.cxScroll){led.dataset.cxScroll='1';const update=()=>led.querySelectorAll('.cx-led-line').forEach(el=>el.classList.toggle('cx-led-scroll',!el.hidden&&el.textContent.length>75));update();new MutationObserver(update).observe(led,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['hidden']});}
}

})();

(function(){

function start(){

 if(!board||!source)return false;
 const screen=board.querySelector('.cx-led-screen');
 if(!screen)return false;
 let track=screen.querySelector('.cx-gelo-led-track');
 if(!track){track=document.createElement('div');track.className='cx-gelo-led-track';screen.appendChild(track)}
 let noteLine=screen.querySelector('.cx-led-note-static');
 if(!noteLine){noteLine=document.createElement('div');noteLine.className='cx-led-note-static';noteLine.hidden=true;screen.appendChild(noteLine)}
 const old=document.getElementById('cx-pix-led');
 let noteAnimationKey='';
 function adjustNoteScroll(){

  const shouldScroll=needed>available+3;

  if(!shouldScroll){noteAnimationKey='';text.style.animationDuration='';return}
  // A distância e o tempo variam com o tamanho real do recado.
  const distance=needed+Math.max(0,available);
  const seconds=Math.max(12,Math.min(180,distance/68));
  const key=noteLine.dataset.noteValue+'|'+Math.round(available);
  if(key!==noteAnimationKey){
   noteAnimationKey=key;
   text.style.animation='none';
   noteLine.style.setProperty('--cx-recado-inicio',Math.max(0,available)+'px');
   noteLine.style.setProperty('--cx-recado-fim',(-needed)+'px');
   text.offsetWidth;
   text.style.animation='';
  }
  noteLine.style.setProperty('--cx-recado-tempo',seconds+'s');
 }
 if(typeof ResizeObserver==='function'){
  new ResizeObserver(()=>requestAnimationFrame(adjustNoteScroll)).observe(noteLine);
 }else window.addEventListener('resize',adjustNoteScroll);
 function paint(){
  const text=(source.textContent||'').trim();

  const note=board.querySelector('#cx-led-recado');
  const noteText=note&&!note.hidden?(note.textContent||'').trim():'';
  const sig=mode+'|'+text;
  if(track.dataset.lastSignature!==sig){
   track.dataset.lastSignature=sig;track.replaceChildren();

   noteLine.dataset.noteValue=noteText;
   noteLine.replaceChildren();
   if(noteText){
    const label=document.createElement('span');
    label.className='cx-led-note-message';
    label.textContent=noteText;
    noteLine.appendChild(label);

<script id="cx-financas-light-dark-v11">
(function(){
'use strict';
function init(){
 const slider=document.getElementById('cx-brightness');
 const nav=document.querySelector('.bank-toolbar');
 const request=document.getElementById('btnSolicitacoesValorMenu');
 const head=document.querySelector('.panel-head'),day=document.querySelector('.cx-day-inline');
 // Cartão dia ao lado do controle na barra, sem duplicar ou pôr no cabeçalho do LED.
 if(day&&nav){const bar=slider?.closest('.cx-brightness-control');if(bar&&bar.parentElement===nav){bar.insertAdjacentElement('afterend',day)}else if(request){request.closest('.bank-group')?.insertAdjacentElement('afterend',day)}}
 if(!slider)return false;
 if(slider.dataset.cxTheme11)return true;
 slider.dataset.cxTheme11='1';
 const paint=()=>{
  const v=Math.max(0,Math.min(100,Number(slider.value)));
  document.documentElement.style.filter='none';
  document.body.style.setProperty('--cx-dim','0%');
  // 0 = azul-noturno; 100 = azul-gelo. Superfícies mudam continuamente.
  // Curva preserva um fundo noturno suficientemente escuro até a troca de contraste.
  const t=Math.pow(v/100,3);
  const mix=(dark,light)=>'#'+dark.map((n,i)=>Math.round(n+(light[i]-n)*t).toString(16).padStart(2,'0')).join('');
  const night=v<80;
  document.body.classList.toggle('cx-sup-night',night);
  const colors={
   '--cx-bg':mix([10,31,58],[230,243,255]),
   '--cx-surface':mix([19,44,73],[245,251,255]),
   '--cx-surface2':mix([23,49,81],[209,232,255]),
   '--cx-input':mix([16,41,69],[247,252,255]),
   '--cx-row':mix([15,41,68],[249,252,255]),
   '--cx-row2':mix([20,47,75],[232,244,255]),
   '--cx-th':mix([24,55,88],[217,234,254]),
   '--cx-title':night?'#f4faff':'#12376f',
   '--cx-text':night?'#e1f1ff':'#19477d',
   '--cx-strong':night?'#bfe4ff':'#0a48a7'
  };
  Object.entries(colors).forEach(([key,val])=>document.body.style.setProperty(key,val));
  document.body.style.setProperty('--cx-tone',String(v/100));
  slider.setAttribute('aria-valuetext',v<48?'Modo noturno legível':'Azul-gelo claro');
  try{localStorage.setItem('cx_sup_brightness',String(v))}catch(e){}
 };
 try{slider.value=localStorage.getItem('cx_sup_brightness')||'100'}catch(e){}
 slider.addEventListener('input',paint);paint();
 return true;
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{init()},{once:true});else init();
})();
</script>

<script id="coopex-supervisao-calendar-glass-v18">
(function(){
'use strict';
function init(){
 const form=document.querySelector('.filters-form');
 if(!form||form.dataset.cxCalendarReady)return Boolean(form);
 form.dataset.cxCalendarReady='1';
 const labels=['D','S','T','Q','Q','S','S'];
 const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
 const pop=document.createElement('div');pop.className='cx-calendar-glass';pop.hidden=true;
 pop.setAttribute('role','dialog');pop.setAttribute('aria-label','Selecionar data');
 document.body.appendChild(pop);
 let active=null,year=0,month=0;
 const fmt=(y,m,d)=>String(y)+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
 function close(){pop.hidden=true;active=null}
 function render(){
  if(!active)return;
  pop.replaceChildren();
  const top=document.createElement('div');top.className='cx-calendar-top';
  function button(label,action){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',action);return b}
  top.appendChild(button('‹',()=>{month--;if(month<0){month=11;year--}render()}));
  const title=document.createElement('strong');title.textContent=months[month]+' '+year;top.appendChild(title);
  top.appendChild(button('›',()=>{month++;if(month>11){month=0;year++}render()}));
  pop.appendChild(top);
  const grid=document.createElement('div');grid.className='cx-calendar-grid';
  labels.forEach(label=>{const sp=document.createElement('span');sp.textContent=label;grid.appendChild(sp)});
  const empty=(new Date(year,month,1).getDay()+6)%7;
  for(let i=0;i<empty;i++){const blank=document.createElement('span');grid.appendChild(blank)}
  const end=new Date(year,month+1,0).getDate();
  const today=new Date(),todayDate=fmt(today.getFullYear(),today.getMonth(),today.getDate());
  for(let day=1;day<=end;day++){
   const date=fmt(year,month,day),b=button(String(day),()=>{active.value=date;active.dispatchEvent(new Event('change',{bubbles:true}));close()});
   b.setAttribute('aria-pressed',String(active.value===date));b.dataset.today=String(date===todayDate);
   if(active.min&&date<active.min || active.max&&date>active.max)b.disabled=true;
   grid.appendChild(b);
  }
  pop.appendChild(grid);
  const footer=document.createElement('div');footer.className='cx-calendar-top';footer.style.marginTop='8px';
  footer.appendChild(button('Hoje',()=>{active.value=todayDate;active.dispatchEvent(new Event('change',{bubbles:true}));close()}));
  footer.appendChild(button('Fechar',close));pop.appendChild(footer);
 }
 function open(input,btn){
  active=input;const chosen=input.value?new Date(input.value+'T12:00:00'):new Date();
  year=chosen.getFullYear();month=chosen.getMonth();render();
  pop.hidden=false;
  const r=btn.getBoundingClientRect();const left=Math.min(Math.max(10,r.left-120),window.innerWidth-340);
  pop.style.left=Math.max(10,left)+'px';
  pop.style.top=(r.bottom+344>window.innerHeight?Math.max(10,r.top-355):r.bottom+8)+'px';
 }
 form.querySelectorAll('input[type=date]').forEach(input=>{
  input.closest('.field')?.classList.add('cx-date-field');
  const btn=document.createElement('button');btn.type='button';btn.className='cx-cal-trigger';
  btn.title='Abrir calendário azul-gelo';btn.setAttribute('aria-label','Abrir calendário: '+(input.id==='data_inicio'?'data inicial':'data final'));
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18M8 14h3M8 18h3"/></svg>';
  btn.addEventListener('click',()=>{if(active===input&&!pop.hidden)close();else open(input,btn)});
  input.insertAdjacentElement('afterend',btn);
  input.addEventListener('click',()=>{if(pop.hidden)open(input,btn)});
 });
 document.addEventListener('pointerdown',e=>{if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('.cx-date-field'))close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 window.addEventListener('resize',()=>{if(!pop.hidden)close()});
 return true;
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>

<script id="coopex-alerta-audio-real-time-v21">
(function(){
function init(){
 const bar=document.querySelector('#cx-led-menu-controls')||document.querySelector('#cx-supervisao-board .cx-led-buttons');
 if(!bar)return false;
 if(document.getElementById('cx-led-sound-enable'))return true;
 const btn=document.createElement('button');
 btn.id='cx-led-sound-enable';btn.type='button';btn.dataset.enabled='false';
 btn.textContent='🔔 Ativar som';btn.title='Habilitar áudio de entrada e saída da fila neste navegador';
 bar.prepend(btn);
 btn.addEventListener('click',async()=>{
  // Desbloqueia o áudio no contexto de uma interação do usuário.
  if(typeof window.__coopexLedUnlockAudio==='function'){
   const ok=await window.__coopexLedUnlockAudio();
   btn.dataset.enabled=String(ok);btn.textContent=ok?'🔊 Som ativo':'🔔 Ativar som';
  }else{btn.textContent='Som indisponível';}
 });
 window.addEventListener('coopex-led-audio-state',e=>{
  const ok=Boolean(e.detail?.enabled);btn.dataset.enabled=String(ok);btn.textContent=ok?'🔊 Som ativo':'🔔 Ativar som';
 });
 return true;
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{if(!init()){let i=0;const h=setInterval(()=>{if(init()||++i>60)clearInterval(h)},250)}},{once:true});else if(!init()){let i=0;const h=setInterval(()=>{if(init()||++i>60)clearInterval(h)},250)}
})();
</script>

<script id="coopex-camera-vetorial-v25">
(function(){
 const icons={
  camera:'<svg viewBox="0 0 24 24" role="img" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  download:'<svg viewBox="0 0 24 24" role="img" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg>'
 };
 function apply(root){
  (root||document).querySelectorAll('#tbl .tabela .foto-btn,#tbl .tabela .foto-dl').forEach(el=>{
   if(el.dataset.cxCameraVector==='1')return;
   el.dataset.cxCameraVector='1';
   const isDownload=el.classList.contains('foto-dl');
   el.replaceChildren();
   const holder=document.createElement('span');holder.innerHTML=isDownload?icons.download:icons.camera;
   el.appendChild(holder.firstElementChild);
   if(!el.hasAttribute('aria-label'))el.setAttribute('aria-label',el.title|| (isDownload?'Baixar foto':'Foto do recebedor'));
  });
 }
 function init(){
  const table=document.getElementById('tbl');if(!table)return;
  apply(table);
  // Cobre eventuais atualizações de linhas sem recriar nem alterar os links.
  const observer=new MutationObserver(mutations=>{
   if(mutations.some(m=>m.addedNodes.length))apply(table);
  });
  observer.observe(table,{childList:true,subtree:true});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>

<script id="coopex-led-na-barra-v28">
(function(){
'use strict';
function move(){
 const board=document.getElementById('cx-supervisao-board');
 const nav=document.querySelector('.bank-toolbar');
 const pix=document.getElementById('cx-pix-avulso');
 const panel=document.querySelector('.viewport .panel');
 const badge=nav?.querySelector('.cx-day-inline');
 if(!board||!nav||!pix||!panel||!badge)return false;
 // O visor agora fica NA MESMA BARRA do dia. Nenhum segundo cabeçalho.
 const former=document.getElementById('cx-led-under-navbar');
 if(board.parentElement!==nav)badge.insertAdjacentElement('afterend',board);
 if(former&&former.childElementCount===0)former.remove();
 board.classList.add('cx-led-compact');
 // Preserva os handlers existentes dos botões: move nós, nunca clona.
 const controls=document.getElementById('cx-led-menu-controls')||document.createElement('div');
 controls.id='cx-led-menu-controls';
 if(controls.parentElement!==pix){
  const shortcuts=pix.querySelector('.cx-led-shortcuts');
  if(shortcuts)pix.insertBefore(controls,shortcuts);else pix.appendChild(controls);
 }
 const btns=board.querySelector('.cx-led-buttons');
 if(btns){
   // Som, Recado, Li o aviso e Apagar ficam juntos antes dos atalhos.
   const done=document.getElementById('btnMarcarTodasEntregues');
   if(done&&done.parentElement!==controls)controls.appendChild(done);
   [...btns.querySelectorAll('button')].forEach(button=>controls.appendChild(button));
 }
 const note=document.getElementById('cx-led-note-write');
 if(note&&note.parentElement!==controls)controls.appendChild(note);
 const done=document.getElementById('btnMarcarTodasEntregues');
 if(done&&done.parentElement!==controls)controls.prepend(done);
 // Restaurar a ordem/estado dos botões do LED sem tirá-los de cena.
 const dayText=badge.querySelector('.cx-day-label');
 if(dayText){
  const title=dayText.querySelector('strong');
  if(title)title.textContent='Entregas do dia';
  dayText.querySelector('small')?.remove();
 }
 const count=badge.querySelector('#abertasBadge');
 if(count){
  // Sempre junto ao nome. Mantém o próprio elemento atualizado pelo sistema.
  if(count.parentElement!==badge)badge.appendChild(count);
 }
 const logout=document.querySelector('header a.logout');
 if(logout&&!logout.dataset.cxNewExit){
  logout.dataset.cxNewExit='1';
  const svg=document.createElement('span');
  svg.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M14 7l5 5-5 5M19 12H9"/></svg>';
  logout.prepend(svg.firstElementChild);
 }
 return true;
}
function init(){
 if(move())return;
 let tries=0;
 const timer=setInterval(()=>{if(move()||++tries>120)clearInterval(timer)},100);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
