<script id="coopex-admin-schedule-script">
(function(){
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  let todos=[];
  let escala={carregada:false,restrita:false,idsBase:new Set()};
  let cliqueContexto=null;

  function filaAtual(){
    return [...document.querySelectorAll('#espera-lista .espera-chip[data-cooperado-id]')].map((chip,indice)=>({id:String(chip.dataset.cooperadoId||''),nome:String(chip.dataset.cooperadoNome||chip.querySelector('.espera-chip-text')?.textContent||'').trim(),pos:indice+1})).filter(x=>x.id);
  }

  function aplicarMenu(){
    const links=[...document.querySelectorAll('.bank-submenu a')];
    const quick=links.find(a=>(a.textContent||'').trim().toLowerCase()==='nova entrega'||(a.textContent||'').toLowerCase().includes('entrega rápida'));
    if(quick){
      quick.href="{{ url_for('cadastrar_entrega') }}";quick.innerHTML='<span class="btn-ico">⚡</span>Entrega rápida';
      if(!document.getElementById('adminEntregaCompletaLink')){const full=document.createElement('a');full.id='adminEntregaCompletaLink';full.href="{{ url_for('cadastrar_entrega', modo='completo') }}";full.innerHTML='<span class="btn-ico">📋</span>Entrega completa';quick.insertAdjacentElement('afterend',full)}
      if(!document.getElementById('adminEscalaLink')){const item=document.createElement('a');item.id='adminEscalaLink';item.href="{{ url_for('escala') }}";item.innerHTML='<span class="btn-ico">🗓</span>Escala semanal';(document.getElementById('adminEntregaCompletaLink')||quick).insertAdjacentElement('afterend',item)}
    }
    links.filter(a=>(a.textContent||'').toLowerCase().includes('histórico de trajetos')).forEach(a=>a.remove());
    const primary=[...document.querySelectorAll('.quick-left .btn')].find(b=>(b.textContent||'').toLowerCase().includes('nova entrega')||(b.textContent||'').toLowerCase().includes('entrega rápida'));
    if(primary){
      const holder=primary.closest('.quick-left');holder.classList.add('quick-delivery-actions');primary.innerHTML='<span class="btn-ico">⚡</span> Entrega rápida';primary.onclick=()=>location.href="{{ url_for('cadastrar_entrega') }}";
      if(!document.getElementById('btnEntregaCompletaAdmin')){const b=document.createElement('button');b.id='btnEntregaCompletaAdmin';b.className='btn alt btn-complete-action';b.type='button';b.innerHTML='<span class="btn-ico">📋</span> Entrega completa';b.onclick=()=>location.href="{{ url_for('cadastrar_entrega', modo='completo') }}";holder.appendChild(b)}
      if(!document.getElementById('btnEscalaAdmin')){const b=document.createElement('button');b.id='btnEscalaAdmin';b.className='btn alt btn-scale-action';b.type='button';b.innerHTML='<span class="btn-ico">🗓</span> Escala semanal';b.onclick=()=>location.href="{{ url_for('escala') }}";holder.appendChild(b)}
    }
  }

  function sincronizarTema(){
    const salvo=localStorage.getItem('coopex_theme');if(salvo==='dark')document.body.classList.add('dark');if(salvo==='light')document.body.classList.remove('dark');new MutationObserver(()=>localStorage.setItem('coopex_theme',document.body.classList.contains('dark')?'dark':'light')).observe(document.body,{attributes:true,attributeFilter:['class']});
  }

  async function carregarEscala(){
    try{
      if(!todos.length)todos=(window.COOPERADOS||[]).map(x=>({...x}));
      const r=await fetch('{{ url_for("api_escala_agora") }}',{headers:{Accept:'application/json','X-Requested-With':'fetch'},cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)return;
      const itensBase=(d.itens||[]).filter(x=>norm(x.contrato)==='base');escala.carregada=true;escala.restrita=!!d.restricao_ativa;escala.idsBase=new Set(itensBase.map(x=>String(x.cooperado_id)));
      if(escala.restrita){const idsFila=new Set(filaAtual().map(x=>x.id));const permitidos=new Set([...escala.idsBase,...idsFila]);window.COOPERADOS=todos.filter(c=>permitidos.has(String(c.id))).map(c=>({...c,rotulo:c.nome}))}else window.COOPERADOS=todos.map(c=>({...c}));
      document.querySelectorAll('.coop-edit-select').forEach(prepararSelect);
    }catch(e){}
  }

  async function carregarAgendamentos(){
    try{
      const ids=[...document.querySelectorAll('tr[data-id]')].map(tr=>tr.dataset.id).filter(Boolean).join(',');
      const url='{{ url_for("api_admin_agendamentos") }}'+(ids?`?ids=${encodeURIComponent(ids)}`:'');
      const r=await fetch(url,{headers:{Accept:'application/json','X-Requested-With':'fetch'},cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)return;
      (d.itens||[]).forEach(item=>{
        const tr=document.querySelector(`tr[data-id="${item.id}"]`);if(!tr||tr.cells.length<7)return;
        const pedido=tr.cells[5],atribuicao=tr.cells[6];
        pedido.innerHTML=`<span class="scheduled-clock" title="Entrega agendada para ${item.agendada_data} às ${item.agendada_hora}">🕒 ${item.agendada_hora}</span>`;
        if(item.atribuida_depois){atribuicao.innerHTML=`<span class="scheduled-clock actual" title="Cooperado atribuído depois do horário agendado">${item.atribuicao_hora}</span>`}
        else{const titulo=item.tem_cooperado?'Cooperado atribuído antes do horário; exibindo a hora agendada':'Aguardando atribuição; exibindo a hora agendada';atribuicao.innerHTML=`<span class="scheduled-clock" title="${titulo}">🕒 ${item.atribuicao_hora}</span>`}
      });
    }catch(e){}
  }

  function escolherForaEscala(){
    const termo=prompt('Digite parte do nome do cooperado:');if(!termo)return null;const q=norm(termo);let encontrados=todos.filter(c=>norm(c.nome).includes(q));if(!encontrados.length){alert('Nenhum cooperado encontrado.');return null}if(encontrados.length===1)return encontrados[0];encontrados=encontrados.slice(0,12);const escolha=prompt('Digite o número do cooperado:\n'+encontrados.map((c,i)=>`${i+1}. ${c.nome}`).join('\n'));const indice=Number(escolha)-1;return indice>=0&&indice<encontrados.length?encontrados[indice]:null;
  }

  function prepararSelect(sel){
    if(!sel||sel.dataset.filaBasePreparada==='1'||!escala.restrita)return;sel.dataset.filaBasePreparada='1';
    const atual=String(cliqueContexto?.atual||sel.value||'');const fila=filaAtual();const idsFila=new Set(fila.map(x=>x.id));const atualCoop=todos.find(c=>String(c.id)===atual)||null;
    sel.innerHTML='<option value="">Sem cooperado</option>';
    fila.forEach(item=>{const o=document.createElement('option');o.value=item.id;o.textContent=`${item.pos}º da fila — ${item.nome}`;sel.appendChild(o)});
    todos.filter(c=>escala.idsBase.has(String(c.id))&&!idsFila.has(String(c.id))).forEach(c=>{const o=document.createElement('option');o.value=String(c.id);o.textContent=c.nome;sel.appendChild(o)});
    if(atual&&atualCoop&&![...sel.options].some(o=>String(o.value)===atual)){const o=document.createElement('option');o.value=atual;o.textContent=atualCoop.nome;sel.appendChild(o)}
    const manual=document.createElement('option');manual.value='__fora_escala__';manual.textContent='Digitar outro cooperado';sel.appendChild(manual);
    sel.value=atual&&[...sel.options].some(o=>String(o.value)===atual)?atual:'';sel.title='Sem cooperado aparece primeiro. Depois vêm todos da fila e os escalados na BASE.';
  }

  document.addEventListener('click',e=>{const alvo=e.target.closest?.('.coop-editable');if(alvo)cliqueContexto={atual:String(alvo.dataset.cooperadoId||'')};},true);
  document.addEventListener('change',e=>{const sel=e.target.closest?.('.coop-edit-select');if(!sel||sel.value!=='__fora_escala__')return;e.preventDefault();e.stopImmediatePropagation();const escolhido=escolherForaEscala();if(!escolhido){sel.value='';return}if(!(window.COOPERADOS||[]).some(c=>String(c.id)===String(escolhido.id)))window.COOPERADOS.push({...escolhido,rotulo:escolhido.nome});let opt=[...sel.options].find(o=>String(o.value)===String(escolhido.id));if(!opt){opt=document.createElement('option');opt.value=String(escolhido.id);opt.textContent=escolhido.nome;sel.insertBefore(opt,sel.options[sel.options.length-1])}sel.value=String(escolhido.id);setTimeout(()=>sel.dispatchEvent(new Event('change',{bubbles:true})),0)},true);
  new MutationObserver(muts=>muts.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.matches?.('.coop-edit-select'))prepararSelect(n);n.querySelectorAll?.('.coop-edit-select').forEach(prepararSelect)}))).observe(document.documentElement,{childList:true,subtree:true});

  function iniciar(){sincronizarTema();aplicarMenu();todos=(window.COOPERADOS||[]).map(x=>({...x}));carregarEscala();carregarAgendamentos();setInterval(()=>{carregarEscala();carregarAgendamentos()},60000)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar,{once:true});else iniciar();
})();
</script>

  #supervisao-live-indicator{position:fixed;right:14px;bottom:14px;z-index:9998;display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #cdd9f2;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 8px 28px rgba(18,54,125,.14);font:800 11px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#173f9f;user-select:none;backdrop-filter:blur(8px)}

  #supervisao-live-indicator.wait .dot{background:#e69a16;box-shadow:0 0 0 3px rgba(230,154,22,.14)}
  #supervisao-live-indicator.off .dot{background:#d64545;box-shadow:0 0 0 3px rgba(214,69,69,.14)}
  body.dark #supervisao-live-indicator{background:rgba(10,23,45,.96);border-color:#334b75;color:#dce8ff}
</style>
<script id="supervisao-live-sync">
(function(){
  const URL_LIVE='{{ url_for("api_admin_live_state") }}';
  const INTERVALO=2000;
  const SCROLL_KEY='supervisao_live_scroll_y';
  let assinatura=null;
  let verificando=false;
  let atualizacaoPendente=false;
  let timer=null;

  function indicador(){
    let el=document.getElementById('supervisao-live-indicator');
    if(!el){
      el=document.createElement('div');
      el.id='supervisao-live-indicator';
      el.innerHTML='<span class="dot"></span><span class="txt">AO VIVO</span>';
      document.body.appendChild(el);
    }
    return el;
  }
  function status(tipo,texto){
    const el=indicador();
    el.classList.toggle('wait',tipo==='wait');
    el.classList.toggle('off',tipo==='off');
    const txt=el.querySelector('.txt'); if(txt) txt.textContent=texto;
  }
  function usuarioEditando(){
    const a=document.activeElement;
    if(a && (a.matches?.('input,textarea,select,[contenteditable="true"]'))) return true;
    if(document.querySelector('.modal.open,.modal.show,[role="dialog"].open,[role="dialog"][aria-hidden="false"],.value-requests-overlay.open')) return true;
    if(document.body.classList.contains('locked')) return true;
    return false;
  }
  function restaurarScroll(){
    const y=Number(sessionStorage.getItem(SCROLL_KEY)||'');
    if(Number.isFinite(y) && y>0){
      sessionStorage.removeItem(SCROLL_KEY);
      requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:'auto'}));
    }
  }
  function atualizarTela(){
    if(usuarioEditando()){
      atualizacaoPendente=true;
      status('wait','NOVA ATUALIZAÇÃO');
      return;
    }
    atualizacaoPendente=false;
    sessionStorage.setItem(SCROLL_KEY,String(Math.max(0,window.scrollY||0)));
    status('wait','ATUALIZANDO');
    window.location.reload();
  }
  async function verificar(){
    if(verificando || document.visibilityState==='hidden') return;
    verificando=true;
    try{
      const r=await fetch(URL_LIVE,{cache:'no-store',credentials:'same-origin',headers:{Accept:'application/json','X-Requested-With':'fetch'}});
      if(!r.ok) throw new Error('live-state '+r.status);
      const d=await r.json();
      if(!d.ok || !d.assinatura) throw new Error('live-state inválido');
      status('ok','AO VIVO');
      if(assinatura===null){assinatura=d.assinatura;return;}
      if(d.assinatura!==assinatura){assinatura=d.assinatura;atualizarTela();}
      else if(atualizacaoPendente && !usuarioEditando()) atualizarTela();
    }catch(e){
      status('off','SEM CONEXÃO');
    }finally{verificando=false;}
  }
  function iniciar(){
    restaurarScroll();
    indicador();
    verificar();
    timer=setInterval(verificar,INTERVALO);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')verificar();});
    document.addEventListener('focusout',()=>{if(atualizacaoPendente)setTimeout(verificar,180);},true);
    window.addEventListener('online',()=>setTimeout(verificar,100));
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar,{once:true});else iniciar();
})();
</script>

<script id="cx-history-lazy-open-20261010">
(function(){
  var key='coopex_history_requested';
  // Somente ao clicar na aba carregamos registros antigos do banco.
  document.addEventListener('click',function(e){
    var tab=e.target.closest('.value-request-tab[data-value-tab="historico"]');
    if(!tab)return;
    if(new URLSearchParams(location.search).get('solicitacoes_historico')==='1')return;
    e.preventDefault();e.stopImmediatePropagation();
    sessionStorage.setItem(key,'1');
    var u=new URL(location.href);
    u.searchParams.set('solicitacoes_historico','1');
    location.assign(u.toString());
  },true);
  function boot(){
    if(new URLSearchParams(location.search).get('solicitacoes_historico')!=='1')return;
    var overlay=document.getElementById('valueRequestsOverlay');
    if(!overlay)return;
    document.querySelectorAll('.value-request-tab').forEach(function(el){el.classList.toggle('active',el.dataset.valueTab==='historico')});
    document.querySelectorAll('.value-request-panel').forEach(function(el){
      var on=el.dataset.valuePanel==='historico';el.classList.toggle('active',on);el.hidden=!on;
    });
    overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
    sessionStorage.removeItem(key);
    // Retirar marcador da barra de endereco; proximos acessos voltam a ser rapidos.
    var u=new URL(location.href);u.searchParams.delete('solicitacoes_historico');
    history.replaceState(history.state,'',u.pathname+u.search+u.hash);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

<script id="cx-admin-responsive-actions-20261010">
(function(){
const query=window.matchMedia('(max-width:1199px)');
function reorganize(){
  const left=document.querySelector('.filters-top .quick-left');
  const actions=document.querySelector('.filters-actions');
  if(!left||!actions)return;
  const quick=document.querySelector('.quick-left .btn-primary-action, .filters-actions .btn-primary-action');
  const complete=document.getElementById('btnEntregaCompletaAdmin');
  const escala=document.getElementById('btnEscalaAdmin');
  // Aguarda o script legado criar botoes de entrega completa e escala.
  if(!quick || !complete || !escala)return;
  const all=[quick,complete,escala];
  if(query.matches){for(let i=all.length-1;i>=0;i--)actions.insertBefore(all[i],actions.firstChild)}
  else all.forEach(el=>{if(el.parentElement!==left)left.appendChild(el)});
}
function start(){reorganize();query.addEventListener('change',reorganize);const left=document.querySelector('.quick-left');if(left){new MutationObserver(()=>{if(!document.getElementById('btnEscalaAdmin'))return;reorganize()}).observe(left,{childList:true})}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>

<script id="cx-pix-sicoob-inline">
(function(){
let csrfPromise=null;
const token=()=>csrfPromise||(csrfPromise=fetch('/admin/pix-sicoob/csrf',{credentials:'same-origin'}).then(async r=>{if(!r.ok)throw Error('Acesso restrito ao administrador master.');return (await r.json()).csrf}));
async function create(url,body){
const csrf=await token();
const res=await fetch(url,{method:'POST',credentials:'same-origin',
headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body||{})});
const data=await res.json().catch(()=>({}));
if(!res.ok)throw Error(data.erro||'Erro de comunicação com a API Pix');
return data;
}
async function copy(code){
if(!code || !String(code).startsWith('000201'))throw Error('A cobrança não tem código Pix Copia e Cola válido. Consulte o banco antes de pagar.');
try{if(!document.hasFocus())throw Error('sem foco');await navigator.clipboard.writeText(code);return true}catch(err){
const modal=document.createElement('div');modal.style.cssText='position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:15px';
const box=document.createElement('section');box.style.cssText='background:#fff;color:#17294d;border-radius:14px;padding:20px;max-width:700px;width:100%;box-sizing:border-box';
const title=document.createElement('h3');title.textContent='Pix Copia e Cola — selecione e copie o código';
const area=document.createElement('textarea');area.value=code;area.readOnly=true;area.style.cssText='width:100%;height:125px;box-sizing:border-box;overflow-wrap:anywhere';
const btn=document.createElement('button');btn.type='button';btn.textContent='Selecionar código';btn.onclick=()=>{area.focus();area.select();try{document.execCommand('copy')}catch(e){}};
const close=document.createElement('button');close.type='button';close.textContent='Fechar';close.onclick=()=>modal.remove();box.append(title,area,btn,close);modal.append(box);document.body.append(modal);area.focus();area.select();return false;
}
}
async function watchPix(kind,id,btn){
const url=kind==='avulso'?'/admin/pix-sicoob/avulso/'+encodeURIComponent(id)+'/verificar':'/admin/pix-sicoob/verificar/'+encodeURIComponent(id);
for(let n=0;n<36;n++){
await new Promise(resolve=>setTimeout(resolve,5000));
if(!document.body.contains(btn))return;
try{const result=await create(url);if(result.status==='PAGO'){
btn.textContent='Pago ✓';btn.disabled=true;btn.dataset.pixPago='1';btn.title='Pagamento confirmado pelo Sicoob';return;
}}catch(err){}
}
}
async function copyDelivery(btn){
btn.disabled=true;const before=btn.textContent;btn.textContent='Aguarde...';
try{const result=await create('/admin/pix-sicoob/cobrar/'+btn.dataset.entregaId);await copy(result.brcode);btn.textContent='Pix pendente';watchPix('entrega',btn.dataset.entregaId,btn);}
catch(err){alert(err.message);btn.textContent=before;}finally{setTimeout(()=>{if(btn.dataset.pixPago!=='1'){btn.disabled=false;btn.textContent=before}},1700)}
}
function attach(){
document.querySelectorAll('.cx-forma-pagamento[data-entrega-id]').forEach(el=>{
const pix=/^pix\s*(?:\(\s*cooperativa\s*\)|cooperativa|da cooperativa)$/i.test((el.dataset.forma||'').trim());
let btn=el.parentElement.querySelector('.cx-pix-copy');
if(!pix){if(btn)btn.remove();return}
if(btn)return;
btn=document.createElement('button');btn.type='button';btn.className='cx-pix-copy';
btn.dataset.entregaId=el.dataset.entregaId;btn.textContent='Copiar Pix';btn.title='Copiar Pix Cooperativa com valor desta entrega';
btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();copyDelivery(btn)});
el.insertAdjacentElement('afterend',btn);
});
}
function avulso(){
if(document.getElementById('cx-pix-avulso'))return;
const root=document.querySelector('.quick-view-bar')||document.querySelector('#tbl');
if(!root)return;
const host=document.createElement('div');
host.id='cx-pix-avulso';host.className='cx-pix-advance';
const label=document.createElement('strong');label.textContent='Pix antecipado';
const input=document.createElement('input');input.type='text';input.inputMode='decimal';input.placeholder='Valor R$ 0,00';input.setAttribute('aria-label','Valor avulso em reais');
const btn=document.createElement('button');btn.className='cx-pix-copy';btn.type='button';btn.textContent='Copiar Pix';
const cliente=document.createElement('input');cliente.placeholder='Nome do cliente';cliente.maxLength=160;cliente.setAttribute('aria-label','Nome do cliente Pix antecipado');cliente.style.width='170px';
const hint=document.createElement('span');hint.textContent='Para cliente que paga antes de lançar a entrega';
const historicoBtn=document.createElement('button');historicoBtn.type='button';historicoBtn.className='cx-pix-copy';historicoBtn.textContent='Histórico Pix';
host.append(label,cliente,input,btn,historicoBtn,hint);root.parentElement.insertBefore(host,root);
historicoBtn.onclick=()=>window.open('/admin/pix-sicoob/historico','_blank','noopener');
btn.addEventListener('click',async()=>{
const raw=input.value.trim();if(!cliente.value.trim()){alert('Informe o nome do cliente');return}if(!/^\d{1,6}(?:[,.]\d{1,2})?$/.test(raw)){alert('Digite o valor, exemplo: 25,00');return}
btn.disabled=true;btn.textContent='Aguarde...';
try{let data=await create('/admin/pix-sicoob/avulso',{valor:raw.replace(',','.'),cliente_nome:cliente.value.trim()});await copy(data.brcode);btn.textContent='Pix pendente';hint.textContent='Cobrança avulsa gerada · '+data.id+' · Pendente';watchPix('avulso',data.id,btn);}
catch(e){alert(e.message);btn.textContent='Copiar Pix'}finally{btn.disabled=false;}
});
}
document.addEventListener('DOMContentLoaded',()=>{attach();avulso();const observer=new MutationObserver(()=>{attach();avulso()});observer.observe(document.body,{childList:true,subtree:true});});
})();
</script>

<script id="coopex-pix-credit-sale-alert">
(function(){
const url='/api/admin/pix-creditos/novas-vendas';
let known=new Set(),ready=false,context=null,unlocked=false;
const storageKey='coopex-credit-sales-notified';
function loadSeen(){try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch(e){return []}}
function saveSeen(id){try{const a=loadSeen();if(!a.includes(id))localStorage.setItem(storageKey,JSON.stringify([...a,id].slice(-80)))}catch(e){}}
function enableSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;context=context||new C();context.resume().then(()=>unlocked=context.state==='running').catch(()=>{})}catch(e){}}
document.addEventListener('click',enableSound,{passive:true});document.addEventListener('keydown',enableSound,{passive:true});
function beep(){if(!unlocked||!context)return;try{let now=context.currentTime;for(let n=0;n<2;n++){let o=context.createOscillator(),g=context.createGain();o.type='sine';o.frequency.value=n?1050:880;g.gain.setValueAtTime(0.0001,now+n*.2);g.gain.exponentialRampToValueAtTime(.15,now+n*.2+.015);g.gain.exponentialRampToValueAtTime(.0001,now+n*.2+.18);o.connect(g);g.connect(context.destination);o.start(now+n*.2);o.stop(now+n*.2+.19)}}catch(e){}}
function notify(v){let id=String(v.solicitacao_id);saveSeen(id);beep();const box=document.createElement('div');box.style.cssText='position:fixed;z-index:1000000;top:10px;left:50%;transform:translateX(-50%);max-width:700px;width:calc(100% - 32px);padding:16px 22px;text-align:center;border-radius:12px;color:white;background:#159d50;box-shadow:0 6px 26px #0005;font:bold 17px system-ui;pointer-events:none';box.textContent='Você vendeu um novo crédito! '+(v.cliente_nome||'Cliente')+' · '+Number(v.valor).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});document.body.append(box);setTimeout(()=>box.remove(),2000)}
async function refresh(){try{const response=await fetch(url,{cache:'no-store',credentials:'same-origin'});if(!response.ok)return;const rows=(await response.json()).vendas||[];const stored=new Set(loadSeen());if(!ready){rows.forEach(v=>known.add(String(v.solicitacao_id)));ready=true;return}for(const v of rows.slice().reverse()){const id=String(v.solicitacao_id);if(!known.has(id)&&!stored.has(id))notify(v);known.add(id)}}catch(e){}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{refresh();setInterval(refresh,5000)});else{refresh();setInterval(refresh,5000)}
})();
</script>

<style id="cx-pix-led-style">
#cx-pix-avulso{flex-wrap:nowrap!important;min-width:0!important;overflow:hidden!important}

#cx-pix-led .cx-led-inner{white-space:nowrap;display:inline-block;min-width:100%;padding-left:100%;animation:cx-led-scroll 32s linear infinite;font:700 13px Consolas,'Courier New',monospace;letter-spacing:1px;color:#40ff81;text-shadow:0 0 3px #21fb6d,0 0 9px #26e879}

</style>
<script id="cx-pix-led-script">
(function(){
let pix=[],fila=[],paidKnown=null,lastText='',audioContext=null,enabledSound=false,lastMode='';
const parse=v=>{if(!v)return NaN;const s=String(v).replace(' ','T');return Date.parse(s+(s.endsWith('Z')||/[+-]\\d\\d:\\d\\d$/.test(s)?'':'Z'))};
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const countdown=ms=>{if(ms<=0)return 'VENCIDO';const m=Math.ceil(ms/60000);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')+'m'};
document.addEventListener('pointerdown',()=>{enabledSound=true},{once:true});
function cashSound(){if(!enabledSound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioContext=audioContext||new C();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime;[880,1320,1760,2093].forEach((hz,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(hz,now+i*.085);g.gain.setValueAtTime(.0001,now+i*.085);g.gain.exponentialRampToValueAtTime(.11,now+i*.085+.018);g.gain.exponentialRampToValueAtTime(.0001,now+i*.085+.14);o.connect(g);g.connect(audioContext.destination);o.start(now+i*.085);o.stop(now+i*.085+.15)})}catch(e){}}
function paidToast(x){cashSound();const div=document.createElement('div');div.style.cssText='position:fixed;top:18px;right:18px;z-index:999999;max-width:430px;background:#063e22;border:2px solid #40ef82;box-shadow:0 7px 30px #0008;border-radius:12px;padding:16px 20px;color:#d7ffea;font:700 15px system-ui';div.textContent='💵 PIX RECEBIDO · '+(x.cliente_nome||'Cliente')+' · '+money(x.valor);document.body.appendChild(div);setTimeout(()=>div.remove(),6500)}
async function paidRefresh(){try{const r=await fetch('/admin/pix-sicoob/historico/dados',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;const all=(await r.json()).cobrancas||[];const good=all.filter(x=>x.status==='PAGO'||x.status==='APROVADO');const ids=new Set(good.map(x=>x.tipo+':'+x.uid+':'+x.status));if(paidKnown!==null){for(const x of good){const key=x.tipo+':'+x.uid+':'+x.status;if(!paidKnown.has(key))paidToast(x)}}paidKnown=ids}catch(e){}}
function draw(){const led=document.getElementById('cx-pix-led');if(!led)return;const now=Date.now();const warnings=pix.map(x=>({...x,ms:parse(x.expira_em)-now})).filter(x=>Number.isFinite(x.ms)&&x.ms<=3600000).sort((a,b)=>a.ms-b.ms);const mode=warnings.length?'alert':'fila';const messages=warnings.length?warnings.map(x=>(x.tipo==='Entrega'?'ENTREGA #'+x.id:'AVULSO')+' · '+(x.nome||'Cliente')+' · '+countdown(x.ms)+' · '+(x.ms<=0?'VENCIDO':x.ms<=900000?'ALERTA 15 MIN':x.ms<=1800000?'ALERTA 30 MIN':'ATENÇÃO 1 HORA')):fila.map((x,i)=>String(x.pos||i+1)+'º '+x.nome);const result=messages.join('     ✦     ')||(warnings.length?'AVISO PIX':'SEM COOPERADOS NA FILA');if(result!==lastText||mode!==lastMode){lastText=result;lastMode=mode;led.querySelector('.cx-led-inner').textContent='  ✦  '+result+'  ✦  ';led.classList.toggle('cx-led-blue',!warnings.length)}led.querySelector('.cx-led-count').textContent='PIX '+pix.length}
async function refresh(){try{const [r,f]=await Promise.all([fetch('/admin/pix-sicoob/avisos',{credentials:'same-origin',cache:'no-store'}),fetch('/api/admin/pix-led-fila',{credentials:'same-origin',cache:'no-store'})]);if(r.ok)pix=(await r.json()).cobrancas||[];if(f.ok)fila=(await f.json()).cooperados||[];draw()}catch(e){}}
function init(){const host=document.getElementById('cx-pix-avulso');if(!host){setTimeout(init,1000);return}if(document.getElementById('cx-pix-led'))return;const led=document.createElement('span');led.id='cx-pix-led';led.title='Fila de cooperados e alertas de vencimento Pix. Clique para ver o histórico.';led.innerHTML='<span class="cx-led-count">PIX 0</span><span class="cx-led-inner">CONSULTANDO...</span>';led.onclick=()=>window.open('/admin/pix-sicoob/historico','_blank','noopener');host.appendChild(led);refresh();paidRefresh();setInterval(refresh,30000);setInterval(draw,10000);setInterval(paidRefresh,30000)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script id="coopex-submenus-script-2026">
(function(){
function organize(){

 nav.dataset.coopexOrganized='1';
 const groups=[...nav.querySelectorAll(':scope > .bank-group')];

  const button=document.createElement('button');button.type='button';button.className='bank-group-btn';button.textContent=label+' ▾';
  button.setAttribute('aria-expanded','false');

 document.querySelectorAll('.panel-head .cx-head-actions > button').forEach(b=>{

 const settingsLinks=[...document.querySelectorAll('.bank-submenu a')].filter(a=>/certificado/i.test(a.textContent||''));

 const adminAnalytics=[...document.querySelectorAll('.bank-submenu a')].filter(a=>/dashboard gerencial/i.test(a.textContent||''));
 adminAnalytics.forEach(a=>manage.menu.append(a));
 // Nenhuma rota nova sem backend: as demais funcoes existentes permanecem em seus menus.
 if(!settings.menu.children.length){

 const fake=document.getElementById('coopex-gestao-access');if(fake)fake.remove();
