<script id="coopex-dashboard-layout-script">
(function(){
  const form=document.querySelector('form.topbar');
  const period=document.getElementById('periodoSel');
  if(!form||!period)return;

  function setPersonalizado(){
    if(period.value!=='personalizado')period.value='personalizado';
  }

  /* Datas, cooperado, contrato ou qualquer filtro tornam o período personalizado. */
  form.querySelectorAll('input[name="data_inicio"],input[name="data_fim"],select[name="cooperado_id"],select[name="grupo_id"],input[name="cliente"],select[name="status_pagamento"],input[name="origem"],input[name="destino"]').forEach(field=>{
    field.addEventListener('change',setPersonalizado);
    if(field.tagName==='INPUT')field.addEventListener('input',()=>{
      if(field.name==='data_inicio'||field.name==='data_fim')setPersonalizado();
    });
  });

  function savedDark(){
    const unified=localStorage.getItem('coopex_theme');
    if(unified==='dark')return true;
    if(unified==='light')return false;
    const page=localStorage.getItem('coopex_estatisticas_dark');
    return page==='1'||page==='true';
  }

  function updateCharts(dark){
    if(typeof Chart==='undefined'||!Chart.instances)return;
    const text=dark?'#cbd8ef':'#334155';
    const grid=dark?'rgba(105,135,183,.18)':'#e6edf8';
    Chart.instances.forEach(chart=>{
      if(chart.options?.plugins?.legend?.labels)chart.options.plugins.legend.labels.color=text;
      const scales=chart.options?.scales||{};
      Object.values(scales).forEach(scale=>{
        if(scale.ticks)scale.ticks.color=text;
        if(scale.grid)scale.grid.color=grid;
        if(scale.title)scale.title.color=text;
      });
      try{chart.update('none')}catch(e){}
    });
  }

  function applyTheme(dark){
    document.body.classList.toggle('dashboard-dark',dark);
    document.body.classList.toggle('dark-mode',dark);
    document.body.classList.toggle('dark',dark);
    document.documentElement.classList.toggle('dark-mode',dark);
    document.documentElement.classList.toggle('dark',dark);
    localStorage.setItem('coopex_theme',dark?'dark':'light');
    localStorage.setItem('coopex_estatisticas_dark',dark?'1':'0');
    localStorage.setItem('coopex_admin_dark',dark?'1':'0');
    localStorage.setItem('coopex_dark_mode',dark?'dark':'light');
    const btn=document.getElementById('darkModeBtn');
    if(btn)btn.textContent=dark?'☀️ Modo claro':'🌙 Modo noturno';
    setTimeout(()=>updateCharts(dark),20);
  }

  window.toggleDarkMode=function(){applyTheme(!document.body.classList.contains('dashboard-dark'))};
  window.atualizarBotaoDarkMode=function(){applyTheme(document.body.classList.contains('dashboard-dark'))};
  applyTheme(savedDark());

  /* O botão flutuante legado não controla mais um tema separado. */
  const observer=new MutationObserver(()=>{
    const legacy=document.getElementById('coopexLegacyTheme');
    if(legacy&&!legacy.dataset.dashboardBound){
      legacy.dataset.dashboardBound='1';
      legacy.onclick=event=>{event.preventDefault();window.toggleDarkMode()};
    }
  });
  observer.observe(document.body,{childList:true,subtree:true});
})();
</script>
