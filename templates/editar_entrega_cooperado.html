<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Editar Entrega - Coopex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { background: linear-gradient(to right, #0047ab, #007bff); font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;}
    .form-container { background-color: white; padding: 30px 25px; border-radius: 10px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); width: 100%; max-width: 500px;}
    h1 { text-align: center; color: #0047ab; margin-bottom: 20px;}
    label { display: block; margin-bottom: 5px; color: #333; font-weight: bold;}
    input[type="text"], input[type="number"], select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;}
    button { width: 100%; padding: 12px; background-color: #0047ab; border: none; color: white; font-size: 16px; border-radius: 5px; cursor: pointer;}
    button:hover { background-color: #003f99;}
    .back-link { display: block; text-align: center; margin-bottom: 15px; color: #0047ab; text-decoration: none; font-weight: bold;}
    .back-link:hover { text-decoration: underline;}
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Editar Entrega</h1>
    <a class="back-link" href="{{ url_for('admin') }}">← Voltar</a>
    <form method="POST" action="{{ url_for('editar_entrega', id=entrega.id) }}">
      <label for="cliente">Nome do Cliente:</label>
      <input type="text" id="cliente" name="cliente" value="{{ entrega.cliente }}" required />
      <label for="bairro">Bairro:</label>
      <input type="text" id="bairro" name="bairro" value="{{ entrega.bairro }}" required />
      <label for="valor">Valor (R$):</label>
      <input type="number" id="valor" name="valor" value="{{ entrega.valor }}" step="0.01" min="0" required />
      <label for="cooperado_id">Atribuir Cooperado:</label>
      <select name="cooperado_id" id="cooperado_id">
        <option value="">-- Nenhum --</option>
        {% for c in cooperados %}
        <option value="{{ c.id }}" {% if entrega.cooperado_id == c.id %}selected{% endif %}>{{ c.nome }}</option>
        {% endfor %}
      </select>
      <label for="status">Status:</label>
      <select name="status" id="status">
        <option value="pendente" {% if entrega.status == 'pendente' %}selected{% endif %}>Pendente</option>
        <option value="recebido" {% if entrega.status == 'recebido' %}selected{% endif %}>Recebido</option>
      </select>
      <button type="submit">Salvar</button>
    </form>
  </div>
</body>
</html>
