<script id="coopex-dashboard-final-clean-script">
(function(){
  const top=document.querySelector('.top');
  const form=top?.querySelector('.topbar');
  if(!top||!form||document.querySelector('.dashboard-bank-menu'))return;

  form.id='dashboardReportForm';
  form.classList.add('dashboard-clean-header');

  const brand=form.querySelector('.brand');
  const originalFilters=form.querySelector('.filters');
  const originalActions=form.querySelector('.actions');
  const hero=document.querySelector('.hero');
  const heroRight=hero?.querySelector('.heroRight');

  brand?.querySelector('img')?.remove();
  if(brand){
    const box=brand.querySelector('div')||brand;
    box.innerHTML='<b>Dashboard Gerencial COOPEX</b><small>Visão executiva de operação, cooperados, contratos, bairros, rotas, financeiro e crédito.</small>';
  }

  const summary=document.createElement('div');
  summary.className='dashboard-clean-summary';
  if(heroRight){
    [...heroRight.children].forEach(item=>summary.appendChild(item.cloneNode(true)));
  }else{
    summary.innerHTML='<span class="heroChip">{{ periodo_legivel }}</span><span class="heroChip">{{ resumo.total_entregas }} entregas</span><span class="heroChip">R$ {{ "%.2f"|format(resumo.valor_total or 0)|replace(".", ",") }}</span>';
  }
  form.insertBefore(summary,originalActions||null);

  function setHeaderHeight(){
    const height=Math.max(70,Math.ceil(top.getBoundingClientRect().height));
    document.documentElement.style.setProperty('--df-header-h',`${height}px`);
  }
  setHeaderHeight();
  window.addEventListener('resize',setHeaderHeight,{passive:true});

  function findHeading(text){
    const q=String(text||'').toLowerCase();
    return [...document.querySelectorAll('.sectionTitle h3,.year-compare-head h3,.cardHead h2')]
      .find(node=>String(node.textContent||'').toLowerCase().includes(q));
  }
  function goTo(text){
    const heading=findHeading(text);
    const target=heading?.closest('.sectionTitle,.year-compare,.card')||heading;
    target?.scrollIntoView({behavior:'smooth',block:'start'});
  }

  const nav=document.createElement('nav');
  nav.className='dashboard-bank-menu noPrint';
  nav.innerHTML=`<div class="dashboard-bank-menu-inner">
    <div class="dashboard-bank-item"><button class="dashboard-bank-link" type="button" data-home><span class="dashboard-bank-icon">▦</span><span>Visão geral</span></button></div>
    <div class="dashboard-bank-item"><button class="dashboard-bank-button" type="button"><span class="dashboard-bank-icon">◷</span><span>Operação</span><span class="dashboard-bank-arrow">⌄</span></button><div class="dashboard-bank-dropdown">
      <button type="button" data-section="Faturamento e entregas por dia"><span>↗</span>Faturamento por dia</button>
      <button type="button" data-section="Status das entregas"><span>◫</span>Status das entregas</button>
      <button type="button" data-section="Operação, Cooperados e Contratos"><span>▤</span>Resumo da operação</button>
    </div></div>
    <div class="dashboard-bank-item"><button class="dashboard-bank-button" type="button"><span class="dashboard-bank-icon">♙</span><span>Cooperados e contratos</span><span class="dashboard-bank-arrow">⌄</span></button><div class="dashboard-bank-dropdown">
      <button type="button" data-section="Cooperados"><span>♙</span>Produção dos cooperados</button>
      <button type="button" data-section="Contratos"><span>▥</span>Contratos e clientes</button>
      <button type="button" data-section="Estabelecimentos"><span>⌂</span>Estabelecimentos</button>
    </div></div>
    <div class="dashboard-bank-item"><button class="dashboard-bank-button" type="button"><span class="dashboard-bank-icon">¤</span><span>Financeiro</span><span class="dashboard-bank-arrow">⌄</span></button><div class="dashboard-bank-dropdown">
      <button type="button" data-section="Crédito e Financeiro"><span>R$</span>Resumo financeiro</button>
      <button type="button" data-section="Comparativo mensal e anual"><span>↗</span>Comparativo mensal e anual</button>
      <a href="{{ url_for('creditos') }}"><span>¤</span>Créditos dos clientes</a>
    </div></div>
    <div class="dashboard-bank-item"><button class="dashboard-bank-button" type="button"><span class="dashboard-bank-icon">⌖</span><span>Bairros e rotas</span><span class="dashboard-bank-arrow">⌄</span></button><div class="dashboard-bank-dropdown">
      <button type="button" data-section="Bairros e Rotas"><span>⌖</span>Desempenho por bairro</button>
      <button type="button" data-section="Rotas"><span>⇄</span>Rotas mais utilizadas</button>
      <a href="{{ url_for('precos_rotas') }}"><span>R$</span>Preços cadastrados</a>
    </div></div>
    <div class="dashboard-bank-item"><button class="dashboard-bank-button" type="button"><span class="dashboard-bank-icon">▧</span><span>Relatórios</span><span class="dashboard-bank-arrow">⌄</span></button><div class="dashboard-bank-dropdown">
      <button type="button" data-print><span>▧</span>Imprimir relatório</button>
      <a href="{{ url_for('admin') }}"><span>←</span>Voltar ao Admin</a>
    </div></div>
    <div class="dashboard-bank-spacer"></div>
  </div>`;
  top.insertAdjacentElement('afterend',nav);

  const filterShell=document.createElement('section');
  filterShell.className='dashboard-filter-shell noPrint';
  filterShell.innerHTML=`<div class="dashboard-filter-toolbar">
    <span class="dashboard-filter-title">Filtros do relatório</span>
    <div class="dashboard-filter-chips"></div>
    <label class="dashboard-global-search"><span>⌕</span><input type="search" autocomplete="off" placeholder="Pesquisar cooperado, cliente, contrato, bairro, rota ou valor"></label>
    <span class="dashboard-search-count"></span>
    <div class="dashboard-filter-actions"><button type="button" data-filter-toggle>Mostrar filtros</button><button type="button" data-clear>Limpar</button></div>
  </div><div class="dashboard-filter-panel"></div>`;
  nav.insertAdjacentElement('afterend',filterShell);

  const filterPanel=filterShell.querySelector('.dashboard-filter-panel');
  if(originalFilters){
    filterPanel.appendChild(originalFilters);
    originalFilters.querySelectorAll('input,select').forEach(field=>field.setAttribute('form',form.id));
  }

  const applyButton=originalActions?.querySelector('.btn.primary');
  if(applyButton){
    applyButton.classList.add('apply-filter');
    applyButton.setAttribute('form',form.id);
    filterShell.querySelector('.dashboard-filter-actions').appendChild(applyButton);
  }

  function placeDropdown(item){
    const button=item.querySelector('.dashboard-bank-button');
    const dropdown=item.querySelector('.dashboard-bank-dropdown');
    if(!button||!dropdown)return;
    const rect=button.getBoundingClientRect();
    const width=dropdown.offsetWidth||230;
    dropdown.style.top=`${Math.round(rect.bottom)}px`;
    dropdown.style.left=`${Math.max(6,Math.min(Math.round(rect.left),window.innerWidth-width-6))}px`;
  }
  nav.querySelectorAll('.dashboard-bank-button').forEach(button=>button.addEventListener('click',event=>{
    event.stopPropagation();
    const item=button.closest('.dashboard-bank-item');
    const wasOpen=item.classList.contains('open');
    nav.querySelectorAll('.dashboard-bank-item.open').forEach(other=>other.classList.remove('open'));
    if(!wasOpen){item.classList.add('open');requestAnimationFrame(()=>placeDropdown(item))}
  }));
  document.addEventListener('click',()=>nav.querySelectorAll('.dashboard-bank-item.open').forEach(item=>item.classList.remove('open')));
  window.addEventListener('resize',()=>nav.querySelectorAll('.dashboard-bank-item.open').forEach(placeDropdown),{passive:true});
  nav.querySelector('[data-home]')?.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  nav.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',()=>goTo(button.dataset.section)));
  nav.querySelectorAll('[data-print]').forEach(button=>button.addEventListener('click',()=>window.print()));

  const toggleButton=filterShell.querySelector('[data-filter-toggle]');
  toggleButton.addEventListener('click',()=>{
    const open=filterShell.classList.toggle('open');
    toggleButton.textContent=open?'Ocultar filtros':'Mostrar filtros';
  });

  const chipsBox=filterShell.querySelector('.dashboard-filter-chips');
  const labels={periodo:'Período',data_inicio:'De',data_fim:'Até',cooperado_id:'Cooperado',grupo_id:'Contrato',cliente:'Cliente',status_pagamento:'Pagamento',origem:'Origem',destino:'Destino'};
  function updateChips(){
    chipsBox.innerHTML='';
    [...form.elements].forEach(field=>{
      if(!field.name||!labels[field.name])return;
      let value=field.value;
      if(!value||value==='todos')return;
      if(field.tagName==='SELECT')value=field.options[field.selectedIndex]?.text||value;
      const chip=document.createElement('span');
      chip.className='dashboard-filter-chip';
      chip.innerHTML=`<strong>${labels[field.name]}:</strong> ${value}`;
      chipsBox.appendChild(chip);
    });
    if(!chipsBox.children.length){const chip=document.createElement('span');chip.className='dashboard-filter-chip';chip.textContent='Sem filtros específicos';chipsBox.appendChild(chip)}
  }
  updateChips();
  originalFilters?.querySelectorAll('input,select').forEach(field=>field.addEventListener('change',updateChips));

  const periodo=form.querySelector('[name="periodo"]');
  const specific=form.querySelectorAll('[name="data_inicio"],[name="data_fim"],[name="cooperado_id"],[name="grupo_id"],[name="cliente"],[name="status_pagamento"],[name="origem"],[name="destino"]');
  function hasSpecificValue(field){return field.tagName==='SELECT'?Boolean(field.value&&field.value!=='todos'):Boolean(field.value.trim())}
  specific.forEach(field=>{
    const eventName=field.tagName==='SELECT'?'change':'input';
    field.addEventListener(eventName,()=>{if(hasSpecificValue(field)&&periodo)periodo.value='personalizado';updateChips()});
  });

  filterShell.querySelector('[data-clear]').addEventListener('click',()=>{
    originalFilters?.querySelectorAll('input').forEach(input=>input.value='');
    originalFilters?.querySelectorAll('select').forEach(select=>select.value=select.name==='periodo'?'mes':'todos');
    form.requestSubmit();
  });

  const searchInput=filterShell.querySelector('.dashboard-global-search input');
  const searchCount=filterShell.querySelector('.dashboard-search-count');
  function normalize(text){return String(text||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
  function searchDashboard(){
    const query=normalize(searchInput.value);
    const rows=[...document.querySelectorAll('table tbody tr,.rowItem,.alerts .alert')];
    rows.forEach(row=>row.classList.remove('dashboard-search-found'));
    if(!query){rows.forEach(row=>row.classList.remove('dashboard-search-hidden'));searchCount.textContent='';return}
    let found=0;
    rows.forEach(row=>{
      const match=normalize(row.textContent).includes(query);
      row.classList.toggle('dashboard-search-hidden',!match);
      if(match){row.classList.add('dashboard-search-found');found++}
    });
    searchCount.textContent=`${found} resultado${found===1?'':'s'}`;
  }
  searchInput.addEventListener('input',searchDashboard);
  searchInput.addEventListener('keydown',event=>{if(event.key==='Escape'){searchInput.value='';searchDashboard();searchInput.blur()}});
})();
</script>
