name: List history
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/list-history.yml
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - run: git log --oneline -40
