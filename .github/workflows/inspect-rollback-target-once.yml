name: Inspect rollback target
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-rollback-target-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - run: git log --oneline -20
