name: Rollback admin now
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rollback-admin-now.yml
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Show history
        run: git log --oneline -30
