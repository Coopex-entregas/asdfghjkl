name: Corrigir filtro Todos do admin

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-admin-all-filter-once.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover filtro oculto da data de hoje
        shell: python
        run: |
          from pathlib import Path

          caminho = Path("app.py")
          texto = caminho.read_text(encoding="utf-8")

          antigo = '''    # padrão: dia de hoje
              if not data_inicio and not data_fim:
                  inicio_utc, fim_utc = local_date_window_to_utc_range(hoje)
                  query = query.filter(Entrega.data_envio >= inicio_utc, Entrega.data_envio <= fim_utc)
          '''

          novo = '''    # Sem período informado, "Todos" exibe todo o histórico de entregas.
              # A consulta só é restringida por data quando início e/ou fim são preenchidos.
          '''

          if antigo not in texto:
              raise SystemExit("Bloco esperado do filtro automático não foi encontrado em app.py")

          texto = texto.replace(antigo, novo, 1)
          caminho.write_text(texto, encoding="utf-8")

          # Esta automação é usada uma única vez e se remove no mesmo commit da correção.
          Path(".github/workflows/fix-admin-all-filter-once.yml").unlink()

      - name: Validar correção
        shell: bash
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          texto = Path('app.py').read_text(encoding='utf-8')
          assert 'Sem período informado, "Todos" exibe todo o histórico de entregas.' in texto
          assert '''    # padrão: dia de hoje
              if not data_inicio and not data_fim:
                  inicio_utc, fim_utc = local_date_window_to_utc_range(hoje)
                  query = query.filter(Entrega.data_envio >= inicio_utc, Entrega.data_envio <= fim_utc)
          ''' not in texto
          print('Filtro Todos validado com sucesso.')
          PY
          git diff --check

      - name: Salvar diretamente na main
        shell: bash
        run: |
          git config user.name "Coopex Coding Agent"
          git config user.email "coding-agent@users.noreply.github.com"
          git add app.py .github/workflows/fix-admin-all-filter-once.yml
          git commit -m "fix: mostrar todas as entregas ao limpar filtros do admin"
          git push origin HEAD:main
