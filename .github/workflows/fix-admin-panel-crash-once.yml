name: Corrigir queda do painel admin

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-admin-panel-crash-once.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar paginação leve no painel admin
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')
          admin_start = app.index("def admin():")

          query_start = app.index("    entregas_all = (", admin_start)
          query_end = app.index("\n\n    cooperados = ", query_start)
          new_query = '''    # "Todos" mantém acesso ao histórico completo, sem carregar tudo na memória.
              page = max(1, request.args.get('page', 1, type=int) or 1)
              per_page = 100
              total_entregas = query.order_by(None).count()
              total_pages = max(1, (total_entregas + per_page - 1) // per_page)
              page = min(page, total_pages)

              entregas_page = (
                  query.options(joinedload(Entrega.cooperado))
                  .order_by(
                      case((Entrega.cooperado_id.is_(None), 0), else_=1),
                      Entrega.data_envio.desc(),
                      Entrega.id.desc(),
                  )
                  .offset((page - 1) * per_page)
                  .limit(per_page)
                  .all()
              )
              entregas = [_enriquecer_entrega(e) for e in entregas_page]

              pagination_args = request.args.to_dict()
              prev_url = None
              next_url = None
              if page > 1:
                  pagination_args['page'] = page - 1
                  prev_url = url_for('admin', **pagination_args)
              if page < total_pages:
                  pagination_args['page'] = page + 1
                  next_url = url_for('admin', **pagination_args)
          '''
          app = app[:query_start] + new_query + app[query_end:]

          render_needle = "        formas_pagamento_disponiveis=formas_pagamento_disponiveis,"
          render_pos = app.index(render_needle, admin_start) + len(render_needle)
          render_extra = '''
              page=page,
              total_pages=total_pages,
              total_entregas=total_entregas,
              per_page=per_page,
              prev_url=prev_url,
              next_url=next_url,'''
          app = app[:render_pos] + render_extra + app[render_pos:]
          app_path.write_text(app, encoding='utf-8')

          tpl_path = Path('templates/admin.html')
          tpl = tpl_path.read_text(encoding='utf-8')
          include_line = "{% include 'admin_original.html' %}\n"
          patch = '''{% include 'admin_original.html' %}
          <style id="admin-pagination-stability">
            .admin-pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid #e1e8f5;border-top:0;background:#fff;flex-wrap:wrap}
            .admin-pagination-info{font-size:.82rem;color:#66759a;font-weight:800}
            .admin-pagination-actions{display:flex;align-items:center;gap:8px}
            .admin-page-label{font-size:.82rem;font-weight:900;color:#173f9f;white-space:nowrap}
            @media(max-width:640px){.admin-pagination{align-items:stretch}.admin-pagination-actions{width:100%;justify-content:space-between}}
          </style>
          <script id="admin-pagination-stability-script">
          (function(){
            const cfg={
              page:{{ page|default(1)|int }},
              totalPages:{{ total_pages|default(1)|int }},
              total:{{ total_entregas|default(0)|int }},
              perPage:{{ per_page|default(100)|int }},
              prev:{{ prev_url|tojson }},
              next:{{ next_url|tojson }}
            };
            function montar(){
              const shell=document.querySelector('.table-shell');
              if(!shell||document.getElementById('adminPagination'))return;
              const nav=document.createElement('nav');
              nav.id='adminPagination';
              nav.className='admin-pagination';
              nav.setAttribute('aria-label','Paginação das entregas');
              const info=document.createElement('div');
              info.className='admin-pagination-info';
              info.textContent=`${cfg.total} entrega(s) · até ${cfg.perPage} por página`;
              const actions=document.createElement('div');
              actions.className='admin-pagination-actions';
              if(cfg.prev){const a=document.createElement('a');a.className='btn alt';a.href=cfg.prev;a.textContent='Anterior';actions.appendChild(a)}
              const label=document.createElement('span');
              label.className='admin-page-label';
              label.textContent=`Página ${cfg.page} de ${cfg.totalPages}`;
              actions.appendChild(label);
              if(cfg.next){const a=document.createElement('a');a.className='btn alt';a.href=cfg.next;a.textContent='Próxima';actions.appendChild(a)}
              nav.append(info,actions);
              shell.insertAdjacentElement('afterend',nav);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',montar,{once:true});else montar();
          })();
          </script>
          '''
          if include_line not in tpl:
              raise SystemExit('Inclusão principal do admin não encontrada')
          tpl = tpl.replace(include_line, patch, 1)
          tpl_path.write_text(tpl, encoding='utf-8')

          Path('.github/workflows/fix-admin-panel-crash-once.yml').unlink()

      - name: Validar arquivos
        shell: bash
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          app = Path('app.py').read_text(encoding='utf-8')
          tpl = Path('templates/admin.html').read_text(encoding='utf-8')
          assert "per_page = 100" in app
          assert ".limit(per_page)" in app
          assert "prev_url=prev_url" in app
          assert "admin-pagination-stability-script" in tpl
          Environment().parse(tpl)
          print('Painel admin validado com paginação leve.')
          PY
          git diff --check

      - name: Salvar diretamente na main
        shell: bash
        run: |
          git config user.name "Coopex Coding Agent"
          git config user.email "coding-agent@users.noreply.github.com"
          git add app.py templates/admin.html .github/workflows/fix-admin-panel-crash-once.yml
          git commit -m "fix: impedir queda do painel admin com paginação"
          git push origin HEAD:main
