name: Corrigir filtros do painel admin

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-admin-filter-history-once.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir consulta dos filtros
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.py')
          app = path.read_text(encoding='utf-8')

          old = '''    # padrão: dia de hoje
              if not data_inicio and not data_fim:
                  inicio_utc, fim_utc = local_date_window_to_utc_range(hoje)
                  query = query.filter(Entrega.data_envio >= inicio_utc, Entrega.data_envio <= fim_utc)
          '''

          new = '''    # Sem filtros, o painel abre mostrando somente as entregas de hoje.
              # Quando qualquer filtro é aplicado sem datas, a pesquisa deve considerar
              # todo o histórico; caso contrário, cooperados e pagamentos antigos somem.
              filtro_explicito = bool(
                  (cooperado_id and cooperado_id != 'todos')
                  or (status_pagamento and status_pagamento != 'todos')
                  or (forma_pagamento and forma_pagamento.lower() != 'todos')
                  or cliente
                  or endereco
              )
              if not data_inicio and not data_fim and not filtro_explicito:
                  inicio_utc, fim_utc = local_date_window_to_utc_range(hoje)
                  query = query.filter(Entrega.data_envio >= inicio_utc, Entrega.data_envio <= fim_utc)
          '''

          if old not in app:
              raise SystemExit('Bloco original do filtro não encontrado; nenhuma alteração realizada.')

          app = app.replace(old, new, 1)
          path.write_text(app, encoding='utf-8')
          Path('.github/workflows/fix-admin-filter-history-once.yml').unlink()

      - name: Validar sistema
        shell: bash
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          assert 'filtro_explicito = bool(' in app
          assert 'and not filtro_explicito' in app
          assert "database_url = os.environ.get('DATABASE_URL', 'sqlite:///db.sqlite3')" in app
          assert 'per_page = 100' not in app
          print('Filtro validado sem paginação e sem alteração de banco.')
          PY
          git diff --check

      - name: Publicar diretamente na main
        shell: bash
        run: |
          git config user.name "Coopex Coding Agent"
          git config user.email "coding-agent@users.noreply.github.com"
          git add app.py .github/workflows/fix-admin-filter-history-once.yml
          git commit -m "fix: pesquisar histórico ao aplicar filtros no admin"
          git push origin HEAD:main
