name: Corrigir consulta dos filtros do admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-filter-query-once.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir consulta e proteger desempenho
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          old = "\n".join([
              "    # Sem filtros, o painel abre mostrando somente as entregas de hoje.",
              "    # Quando qualquer filtro é aplicado sem datas, a pesquisa deve considerar",
              "    # todo o histórico; caso contrário, cooperados e pagamentos antigos somem.",
              "    filtro_explicito = bool(",
              "        (cooperado_id and cooperado_id != 'todos')",
              "        or (status_pagamento and status_pagamento != 'todos')",
              "        or (forma_pagamento and forma_pagamento.lower() != 'todos')",
              "        or cliente",
              "        or endereco",
              "    )",
              "    if not data_inicio and not data_fim and not filtro_explicito:",
              "        inicio_utc, fim_utc = local_date_window_to_utc_range(hoje)",
              "        query = query.filter(Entrega.data_envio >= inicio_utc, Entrega.data_envio <= fim_utc)",
          ]) + "\n"
          new = "\n".join([
              "    # A abertura normal do painel mostra somente o dia atual.",
              "    # Ao clicar em Filtrar, até mesmo mantendo Todos e datas vazias,",
              "    # a consulta passa a considerar o histórico disponível.",
              "    campos_do_filtro = (",
              "        'cooperado_id', 'data_inicio', 'data_fim', 'status_pagamento',",
              "        'forma_pagamento', 'cliente', 'endereco'",
              "    )",
              "    filtro_solicitado = any(campo in request.args for campo in campos_do_filtro)",
              "    if not data_inicio and not data_fim and not filtro_solicitado:",
              "        inicio_utc, fim_utc = local_date_window_to_utc_range(hoje)",
              "        query = query.filter(Entrega.data_envio >= inicio_utc, Entrega.data_envio <= fim_utc)",
          ]) + "\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Bloco principal esperado não encontrado exatamente uma vez: {count}')
          text = text.replace(old, new, 1)

          old_payment = "    if forma_pagamento and forma_pagamento != 'todos':\n        query = query.filter(func.lower(func.coalesce(Entrega.pagamento, '')) == forma_pagamento.lower())\n"
          new_payment = "    if forma_pagamento and forma_pagamento.lower() not in ('todos', 'todas'):\n        query = query.filter(func.lower(func.coalesce(Entrega.pagamento, '')) == forma_pagamento.lower())\n"
          count = text.count(old_payment)
          if count < 1:
              raise SystemExit('Filtro de forma de pagamento do admin não encontrado')
          text = text.replace(old_payment, new_payment, 1)

          old_query = "\n".join([
              "    entregas_all = (",
              "        query.options(joinedload(Entrega.cooperado))",
              "        .order_by(Entrega.data_envio.desc())",
              "        .all()",
              "    )",
          ]) + "\n"
          new_query = "\n".join([
              "    entregas_all = (",
              "        query.options(joinedload(Entrega.cooperado))",
              "        .order_by(Entrega.data_envio.desc())",
              "        .limit(500)",
              "        .all()",
              "    )",
          ]) + "\n"
          count = text.count(old_query)
          if count != 1:
              raise SystemExit(f'Consulta principal esperada não encontrada exatamente uma vez: {count}')
          text = text.replace(old_query, new_query, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar alteração
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert "filtro_solicitado = any(campo in request.args for campo in campos_do_filtro)" in text
          assert "if not data_inicio and not data_fim and not filtro_solicitado:" in text
          assert ".limit(500)" in text
          assert "forma_pagamento.lower() not in ('todos', 'todas')" in text
          PY
          git diff --check

      - name: Publicar correção e remover workflow temporário
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-admin-filter-query-once.yml
          git add app.py
          git commit -m 'fix: fazer filtros do admin retornarem entregas'
          git push origin main
