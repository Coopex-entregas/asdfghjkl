name: Corrigir exibição dos filtros do admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-filter-display-once.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir exibição das entregas filtradas
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('templates/admin_original.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "body.hide-assigned .row-assigned{display:none}",
                  "body.hide-assigned .row-assigned{display:none}\n    body.filter-active.hide-assigned .row-assigned{display:table-row}"
              ),
              (
                  "<form class=\"filters-form\" method=\"GET\" action=\"{{ url_for('admin') }}\" onsubmit=\"window.__markActionStart&&window.__markActionStart()\">",
                  "<form class=\"filters-form\" method=\"GET\" action=\"{{ url_for('admin') }}\" onsubmit=\"sessionStorage.setItem('coopex_show_assigned_after_filter','1');document.body.classList.add('filter-active');document.body.classList.remove('hide-assigned');window.__markActionStart&&window.__markActionStart()\">"
              ),
              (
                  "        document.body.classList.remove('hide-assigned');\n        const btn = document.getElementById('btnToggleAssigned');",
                  "        const filtroEnviado = sessionStorage.getItem('coopex_show_assigned_after_filter') === '1' || window.location.search.length > 1;\n        if(filtroEnviado){\n          sessionStorage.removeItem('coopex_show_assigned_after_filter');\n          document.body.classList.add('filter-active');\n        }\n        document.body.classList.remove('hide-assigned');\n        const btn = document.getElementById('btnToggleAssigned');"
              ),
              (
                  "          const mostrando = !document.body.classList.contains('hide-assigned');",
                  "          const mostrando = document.body.classList.contains('filter-active') || !document.body.classList.contains('hide-assigned');"
              ),
              (
                  "            btn.textContent = mostrando ? 'Ocultar atribuídas' : 'Atribuídas de hoje';",
                  "            btn.textContent = document.body.classList.contains('filter-active') ? 'Atribuídas exibidas' : (mostrando ? 'Ocultar atribuídas' : 'Mostrar atribuídas');"
              ),
              (
                  "          btn.addEventListener('click', function(){\n            document.body.classList.toggle('hide-assigned');",
                  "          btn.addEventListener('click', function(){\n            if(document.body.classList.contains('filter-active')){\n              document.body.classList.remove('hide-assigned');\n              syncAssignedUi();\n              return;\n            }\n            document.body.classList.toggle('hide-assigned');"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Trecho esperado não encontrado exatamente uma vez: {old[:90]!r} (ocorrências={count})')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar alteração
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('templates/admin_original.html').read_text(encoding='utf-8')
          assert "body.filter-active.hide-assigned .row-assigned{display:table-row}" in text
          assert "coopex_show_assigned_after_filter" in text
          assert "Atribuídas exibidas" in text
          assert "Mostrar atribuídas" in text
          assert "document.body.classList.contains('filter-active')" in text
          PY
          git diff --check

      - name: Publicar correção e remover workflow temporário
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-admin-filter-display-once.yml
          git add templates/admin_original.html
          git commit -m 'fix: exibir entregas atribuídas ao usar filtros'
          git push origin main
